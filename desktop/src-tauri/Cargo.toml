[package]
name = "flowtask-desktop"
version = "2.1.1"
description = "FlowTask · 本地项目管理平台"
authors = ["FlowTask Team"]
homepage = "https://github.com/simple-scm/flowtask"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
