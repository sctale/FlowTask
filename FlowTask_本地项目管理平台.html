/* ---- 通用 popover ---- */
let PO_CB = null;
function openPopover(anchor, html, onPick){
  removePopover();
  const po = document.createElement('div');
  po.className = 'popover'; po.id = 'popover';
  po.innerHTML = html;
  document.body.appendChild(po);
  const r = anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : anchor;
  po.style.top = Math.min(window.innerHeight - po.offsetHeight - 10, r.bottom + 6) + 'px';
  po.style.left = Math.max(8, Math.min(window.innerWidth - po.offsetWidth - 8, r.left)) + 'px';
  PO_CB = onPick;
  $$('.po-item', po).forEach(item=>item.onclick=()=>{ PO_CB && PO_CB(item.dataset.po); });
  setTimeout(()=>document.addEventListener('click', poOutside), 0);
}
function poOutside(e){
  if(!e.target.closest('#popover')) removePopover();
}
function removePopover(){
  const po = $('#popover'); if(po){ po.remove(); document.removeEventListener('click', poOutside); }
  PO_CB = null;
}
/* v1.7.1：可搜索的项目选择器——
   点击「所属项目」后弹出搜索框 + 项目列表：输入即过滤、↑↓ 选择、Enter 确认 */
function openProjectPicker(anchor, currentPid, onPick){
  const projects = P.visibleProjects().filter(p => p.id!==currentPid && !p.archived && P.canWriteProject(p));
  removePopover();
  const po = document.createElement('div');
  po.className = 'popover'; po.id = 'popover';
  po.innerHTML = `
    <div class="pp-search"><input id="pp-search" type="text" placeholder="搜索项目名称…" autocomplete="off"></div>
    <div class="pp-list">
      ${projects.map(p=>`<div class="po-item" data-po="${p.id}" title="${p.scope===SCOPE_SHARED?'团队共享项目':'个人项目'}"><span class="avatar" style="background:${safeColor(p.color)};width:20px;height:20px;font-size:9px">${esc(p.name.slice(0,1))}</span><b>${esc(p.name)}</b><span class="sub">${p.scope===SCOPE_SHARED?'团队共享':'个人'}</span></div>`).join('')}
      ${!projects.length ? '<div class="pp-empty">没有可移动的目标项目（需要对目标项目有写权限）</div>' : ''}
    </div>`;
  document.body.appendChild(po);
  const r = anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : anchor;
  po.style.top = Math.min(window.innerHeight - po.offsetHeight - 10, r.bottom + 6) + 'px';
  po.style.left = Math.max(8, Math.min(window.innerWidth - po.offsetWidth - 8, r.left)) + 'px';
  const inp = $('#pp-search', po);
  const items = $$('.po-item', po);
  const visible = ()=> items.filter(it => it.style.display !== 'none');
  const applyFilter = ()=>{
    const q = inp.value.trim().toLowerCase();
    items.forEach(it=>{ it.style.display = (!q || it.textContent.toLowerCase().includes(q)) ? '' : 'none'; });
    items.forEach(it=>it.classList.remove('hl'));
    const first = visible()[0]; if(first) first.classList.add('hl');
  };
  inp.oninput = applyFilter;
  inp.onkeydown = e=>{
    const vis = visible();
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      if(!vis.length) return;
      const cur = vis.findIndex(it=>it.classList.contains('hl'));
      const next = e.key==='ArrowDown' ? (cur+1 >= vis.length ? 0 : cur+1) : (cur-1 < 0 ? vis.length-1 : cur-1);
      vis.forEach(it=>it.classList.remove('hl'));
      vis[next].classList.add('hl');
    }else if(e.key==='Enter'){
      e.preventDefault();
      const cur = vis.findIndex(it=>it.classList.contains('hl'));
      const target = vis[cur >= 0 ? cur : 0];
      if(target){ removePopover(); onPick && onPick(target.dataset.po); }
    }
  };
  items.forEach(item=>item.onclick=()=>{ removePopover(); onPick && onPick(item.dataset.po); });
  setTimeout(()=>{ inp.focus({preventScroll:true}); document.addEventListener('click', poOutside); }, 0);
}

/* ---- 看板视图（状态三列，拖拽改状态） ---- */
function renderBoardView(proj, canWrite){
  const wrap = $('#proj-body');
  wrap.innerHTML = `<div class="board-wrap">
    ${LIST_STATUSES.map(g => {
      const items = applyFilter(tasksOfProject(proj.id).filter(t=>t.status===g.st))
        .sort((a,b)=>b.order-a.order);
      return `<div class="board-col ${g.st==='done'?'done-col':''}${g.st==='paused'?' paused-col':''}" data-st="${g.st}">
        <div class="board-col-head">
          <span class="col-name">${g.name}</span><span class="col-count">${items.length}</span>
        </div>
        <div class="board-col-body" data-st-body="${g.st}">
          ${items.map(t=>boardCardHTML(t)).join('')}
          ${items.length?'':boardColEmptyHTML(proj, g.st, canWrite)}
        </div>
        ${canWrite?`<div class="board-add-card" data-addcard="${g.st}">＋ 添加任务</div>`:''}
      </div>`;
    }).join('')}
  </div>`;

  // 交互
  $$('#proj-body .board-card').forEach(card=>{
    card.onclick = (e)=>{ if(e.target.closest('.check-circle')) return; openDrawer(card.dataset.task); };
    const chk = $('.check-circle', card);
    if(chk) chk.onclick = (e)=>{ e.stopPropagation(); toggleTaskDone(card.dataset.task); };
  });
  $$('#proj-body [data-addcard]').forEach(el=>el.onclick=()=>{
    openQuickAddModal(proj.id, el.dataset.addcard);
  });

  if(!canWrite) return;

  // 拖拽：卡片 → 列（跨列改状态 + 列内排序，带落点指示）
  $$('#proj-body .board-card').forEach(card=>{
    card.draggable = true;
    card.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', card.dataset.task);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', ()=>{
      card.classList.remove('dragging');
      $$('.board-card').forEach(x=>x.classList.remove('drop-above','drop-below'));
      $$('.board-col').forEach(x=>x.classList.remove('drag-over'));
    });
    card.addEventListener('dragover', e=>{
      e.preventDefault();
      e.stopPropagation();
      const rect = card.getBoundingClientRect();
      const above = e.clientY < rect.top + rect.height/2;
      card.classList.toggle('drop-above', above);
      card.classList.toggle('drop-below', !above);
    });
    card.addEventListener('dragleave', ()=>card.classList.remove('drop-above','drop-below'));
  });
  $$('#proj-body .board-col').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove('drag-over'); });
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.classList.remove('drag-over');
      const taskId = e.dataTransfer.getData('text/plain');
      const t = DB.tasks.find(x=>x.id===taskId);
      if(!t) return;
      if(!P.canWriteTask(t)){ toast(denyWriteTaskMsg(t) + '，任务已放回原位', 'err'); renderProject($('#content')); return; }
      const targetSt = col.dataset.st;
      const others = DB.tasks.filter(x=>x.projectId===proj.id && x.status===targetSt && x.id!==taskId);
      const cardEl = e.target.closest('.board-card');
      if(cardEl && cardEl.dataset.task !== taskId){
        const anchor = DB.tasks.find(x=>x.id===cardEl.dataset.task);
        if(anchor){
          const before = cardEl.classList.contains('drop-above');
          t.order = before ? anchor.order + 0.5 : anchor.order - 0.5;
        }
      }else{
        // 空列或拖到列空白处：放到最前（order 越小越靠前）
        t.order = others.length ? Math.min(...others.map(x=>x.order)) - 1 : Date.now();
      }
      if(t.status !== targetSt){
        t.status = targetSt;
        t.completed = (targetSt==='done');
        t.completedAt = (targetSt==='done') ? Date.now() : null;
        t.activities.push({id:uid('a_'), userId:ME.id, text:`状态改为「${STATUS_NAME[targetSt]}」`, ts:Date.now()});
      }
      saveDB(); renderApp();
    });
  });
}

/* ---- 日历视图 ---- */
let CAL_Y = null, CAL_M = null;
function renderCalendarView(proj, canWrite){
  const wrap = $('#proj-body');
  const now = new Date();
  if(CAL_Y===null || ROUTE.pid !== (renderCalendarView._pid||null)){
    CAL_Y = now.getFullYear(); CAL_M = now.getMonth(); renderCalendarView._pid = ROUTE.pid;
  }
  const y = CAL_Y, m = CAL_M;
  const first = new Date(y, m, 1);
  const startPad = (first.getDay() + 6) % 7; // 周一为一周起点
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrev = new Date(y, m, 0).getDate();
  const pm = m===0 ? 11 : m-1, py = m===0 ? y-1 : y;
  const nm = m===11 ? 0 : m+1, ny = m===11 ? y+1 : y;
  const iso = (yy, mm, dd) => `${yy}-${String(mm+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
  const cells = [];
  for(let i=0;i<startPad;i++) cells.push({ d: daysInPrev-startPad+1+i, other:true, key:'p'+i, date: iso(py,pm,daysInPrev-startPad+1+i) });
  for(let d=1; d<=daysInMonth; d++) cells.push({ d, other:false, key:'c'+d, date: iso(y,m,d) });
  let dn = 1;
  while(cells.length < 42){ cells.push({ d: dn, other:true, key:'n'+dn, date: iso(ny,nm,dn) }); dn++; }

  const tasksByDate = {};
  applyFilter(tasksOfProject(proj.id).filter(t=>t.dueDate)).forEach(t=>{
    (tasksByDate[t.dueDate] = tasksByDate[t.dueDate] || []).push(t);
  });
  // 子任务截止日期也进日历（未完成才显示，标注"子"）
  const subsByDate = {};
  tasksOfProject(proj.id).forEach(t=>{
    (t.subtasks||[]).forEach(s=>{
      if(s.dueDate && !s.done) (subsByDate[s.dueDate] = subsByDate[s.dueDate] || []).push({s, t});
    });
  });
  const today = todayStr();
  const WEEK = ['一','二','三','四','五','六','日'];

  wrap.innerHTML = `<div class="cal-wrap">
    <div class="cal-head">
      <div class="cal-title">${y} 年 ${m+1} 月</div>
      <div class="cal-nav">
        <button class="btn btn-outline btn-sm" id="cal-prev">‹ 上月</button>
        <button class="btn btn-outline btn-sm" id="cal-today">回今天</button>
        <button class="btn btn-outline btn-sm" id="cal-next">下月 ›</button>
      </div>
      <span style="font-size:12px;color:var(--text-faint);margin-left:auto">${Object.keys(tasksByDate).length ? (canWrite?'点击日期格可快速创建任务，点击任务打开详情':'') : '本月暂无到期任务，点击日期格可快速创建'}</span>
    </div>
    <div class="cal-weekrow">${WEEK.map(w=>`<div>周${w}</div>`).join('')}</div>
    <div class="cal-grid">
      ${cells.map(cell=>{
        const tList = cell.date ? (tasksByDate[cell.date]||[]) : [];
        const sList = cell.date ? (subsByDate[cell.date]||[]) : [];
        const shownT = tList.slice(0,4);
        const shownS = sList.slice(0, 4 - shownT.length);
        const more = tList.length + sList.length - shownT.length - shownS.length;
        return `<div class="cal-cell ${cell.other?'other':''} ${cell.date===today?'today':''}" ${cell.date?`data-date="${cell.date}"`:''}>
          <div class="cd">${cell.d}</div>
          ${shownT.map(t=>{
            return `<div class="cal-task ${t.completed?'done-t':''}" data-task="${t.id}" title="任务 · ${esc(t.title)} · ${STATUS_NAME[t.status]||''}" style="border-left-color:${safeColor(proj.color)}"><span class="cal-tag">任务</span><span class="cal-title-text">${esc(t.title)}</span></div>`;
          }).join('')}
          ${shownS.map(({s,t})=>`<div class="cal-task cal-sub" data-subparent="${t.id}" title="子任务 · ${esc(s.title)} · 属于「${esc(t.title)}」" style="border-left-color:${safeColor(proj.color)}"><span class="cal-tag" style="background:#eef1ee;color:#5f6b62">子</span><span class="cal-title-text">${esc(s.title)}</span></div>`).join('')}
          ${more>0?`<div class="cal-more" data-more="${cell.date}">还有 ${more} 项…</div>`:''}
        </div>`;
      }).join('')}
    </div>
  </div>`;

  $('#cal-prev').onclick = ()=>{ CAL_M--; if(CAL_M<0){CAL_M=11;CAL_Y--;} renderCalendarView(proj, canWrite); };
  $('#cal-next').onclick = ()=>{ CAL_M++; if(CAL_M>11){CAL_M=0;CAL_Y++;} renderCalendarView(proj, canWrite); };
  $('#cal-today').onclick = ()=>{ CAL_Y=now.getFullYear(); CAL_M=now.getMonth(); renderCalendarView(proj, canWrite); };
  $$('#proj-body .cal-task[data-task]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openDrawer(el.dataset.task); });
  $$('#proj-body .cal-sub[data-subparent]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openDrawer(el.dataset.subparent); });
  $$('#proj-body .cal-more').forEach(el=>el.onclick=(e)=>{ e.stopPropagation();
    const dl = el.dataset.more;
    const items = (tasksByDate[dl]||[]).map(t=>({kind:'task', t}))
      .concat((subsByDate[dl]||[]).map(x=>({kind:'sub', s:x.s, t:x.t})));
    openPopover(el, items.map(it=> it.kind==='task'
        ? `<div class="po-item" data-po="${it.t.id}">${it.t.completed?'✓':'○'} <span class="po-tag">任务</span> <b>${esc(it.t.title)}</b></div>`
        : `<div class="po-item" data-po="${it.t.id}">○ <span class="po-tag" style="background:#eef1ee;color:#5f6b62">子</span> <b>${esc(it.s.title)}</b><span class="sub">${esc(it.t.title)}</span></div>`).join(''),
      (tid)=>{ removePopover(); openDrawer(tid); });
  });
  if(canWrite){
    $$('#proj-body .cal-cell[data-date]').forEach(cell=>{
      cell.onclick = (e)=>{
        if(e.target.closest('.cal-task') || e.target.closest('.cal-more')) return;
        openQuickAddModal(proj.id, 'todo', cell.dataset.date);
      };
    });
  }
}

/* ---- 甘特图视图 ---- */
function renderGanttView(proj, canWrite){
  const wrap = $('#proj-body');
  const parseD = ds => new Date(ds + 'T00:00:00');
  const diffD = (a,b) => Math.round((parseD(b) - parseD(a)) / 86400000);
  const addD = (ds, n) => { const d = parseD(ds); d.setDate(d.getDate()+n); return localDateStr(d); };

  const rows = [];
  tasksOfProject(proj.id).sort((a,b)=>a.order-b.order).forEach(t=>{
    const subDone = t.subtasks.filter(s=>s.done).length;
    const progress = t.subtasks.length ? Math.round(subDone/t.subtasks.length*100) : (t.completed?100:0);
    const taskStart = t.startDate || t.dueDate;
    const taskEnd = t.dueDate || t.startDate;
    rows.push({ type:'task', id:t.id, item:t, start:taskStart, end:taskEnd, progress, prio:t.priority, assigneeId:t.assigneeId });
    t.subtasks.forEach(s=>{
      const subStart = s.dueDate || t.startDate || t.dueDate;
      const subEnd = s.dueDate || t.dueDate || t.startDate;
      rows.push({ type:'sub', id:s.id, item:s, parent:t, start:subStart, end:subEnd, progress:s.done?100:0, prio:t.priority, assigneeId:s.assigneeId });
    });
  });

  const scheduled = rows.filter(r=>r.start && r.end);
  if(scheduled.length === 0){
    wrap.innerHTML = `<div class="gantt-wrap"><div class="gantt-empty">暂无已排期任务，在列表或看板中为任务设置开始/截止日期后此处将显示排期图。</div></div>`;
    return;
  }

  const allDates = [];
  scheduled.forEach(r=>{ allDates.push(r.start); if(r.end) allDates.push(r.end); });
  allDates.sort();
  const minDate = addD(allDates[0], -2);
  const maxDate = addD(allDates[allDates.length-1], 3);
  const totalDays = diffD(minDate, maxDate);

  const days = [];
  for(let i=0;i<=totalDays;i++){
    const d = new Date(parseD(minDate)); d.setDate(d.getDate()+i);
    const ds = localDateStr(d);
    days.push({ date:ds, day:d.getDate(), weekend: d.getDay()%6===0, today: ds===todayStr() });
  }

  const barColor = { high:'var(--red)', med:'var(--orange)', low:'var(--blue)' };

  // 月份分组（时间轴上方标尺）
  const monthGroups = [];
  days.forEach(d=>{
    const mk = d.date.slice(0,7);
    const last = monthGroups[monthGroups.length-1];
    if(last && last.key===mk) last.span++;
    else monthGroups.push({ key:mk, label:(parseInt(d.date.slice(5,7),10))+'月', span:1 });
  });

  wrap.innerHTML = `<div class="gantt-wrap">
    <div class="gantt-head">
      <div class="gantt-title">排期</div>
      <div class="gantt-legend">
        <span><b style="background:var(--prio-high-bar)"></b>优先级 高</span>
        <span><b style="background:var(--prio-med-bar)"></b>优先级 中</span>
        <span><b style="background:var(--prio-low-bar)"></b>优先级 低</span>
      </div>
    </div>
    <div class="gantt-scroll">
      <div class="gantt-grid" style="grid-template-columns:260px ${days.length*36}px">
        <div class="gantt-header-row">
          <div class="gh-cell" style="padding-bottom:0">任务 / 子任务</div>
          <div class="gh-months">${monthGroups.map(mg=>`<div class="gh-month" style="width:${mg.span*36}px">${mg.label}</div>`).join('')}</div>
        </div>
        <div class="gantt-header-row">
          <div class="gh-cell" style="padding-top:4px"></div>
          <div class="gh-timeline">${days.map(d=>`<div class="gh-day ${d.weekend?'weekend':''} ${d.today?'today':''}">${d.day}</div>`).join('')}</div>
        </div>
        ${rows.map(r=>{
          const u = DB.users.find(x=>x.id===r.assigneeId);
          const hasDate = r.start && r.end;
          let bar = '';
          if(hasDate){
            const offset = Math.max(0, diffD(days[0].date, r.start));
            const duration = Math.min(days.length - offset, diffD(r.start, r.end) + 1);
            const left = (offset / days.length * 100).toFixed(2) + '%';
            const width = (duration / days.length * 100).toFixed(2) + '%';
            const title = `${esc(r.item.title)} · ${r.progress}% · ${prioName(r.prio)}`;
            bar = `<div class="gantt-bar ${r.type==='sub'?'sub':''}" style="left:${left};width:${width};background:${barColor[r.prio]||barColor.low}" data-task="${r.type==='task'?r.item.id:r.parent.id}" title="${title}">${r.progress>0?`<span class="g-progress" style="width:${r.progress}%"></span>`:''}<span style="position:relative;z-index:1;padding-left:4px">${r.progress}%</span></div>`;
          }
          return `<div class="gantt-row">
            <div class="gantt-cell">
              <span class="g-type ${r.type==='sub'?'sub':''}">${r.type==='task'?'任务':'子任务'}</span>
              <span class="g-name">${esc(r.item.title)}</span>
              <span class="g-meta">
                <span class="g-prio ${r.prio}">${prioName(r.prio)}</span>
                ${u?`<span class="avatar" style="background:${safeColor(u.color)}" title="${esc(u.name)}">${esc(u.name.slice(0,1))}</span>`:''}
              </span>
            </div>
            <div class="gantt-bar-cell">
              <div class="g-grid">${days.map(d=>`<div class="g-day ${d.weekend?'weekend':''} ${d.today?'today':''}"></div>`).join('')}</div>
              ${bar || '<span class="g-nodate">未排期</span>'}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;

  $$('#proj-body .gantt-bar').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    openDrawer(el.dataset.task);
  });
}

        </div>`).join('')}
      </div>
    </div>

    <div class="dt-sec">
      <div class="dt-sec-title">项目播报（${sus.length}）${isAdminOrOwner?'<button class="btn btn-outline btn-sm" style="margin-left:10px" id="su-new">＋ 发布项目播报</button>':''}</div>
      ${sus.length ? sus.map(su=>{

        const mood = safeMood(su.mood);
        return `<div class="su-item">

      return true;
    }, '发布');

      mood = b.dataset.mood;
      $$('#su-moods .mood-btn').forEach(x=>{ x.classList.remove('on'); x.style.borderColor=''; });
      b.classList.add('on');
      const c = { ontrack:'var(--green)', atrisk:'var(--orange)', offtrack:'var(--red)' }[mood];
      b.style.borderColor = c;
    });
  };
}
/* ============ 任务详情抽屉 ============ */
let CURRENT_TASK = null;
/* v1.10 抽屉渲染去重登记：{id, sub, epoch}——同一数据纪元内重复打开同一视图时跳过整段重拼 */
let _drawerRendered = { id:null, sub:null, epoch:-1 };
let CURRENT_SUB = null;   // 当前打开的子任务详情视图对象（null = 主任务视图）
function openDrawer(taskId){
  const t = DB.tasks.find(x=>x.id===taskId);
  const proj = t ? P.visibleProject(t.projectId) : null;
  if(!t || !proj){ toast('无权查看该任务', 'err'); return; }
  const drawerBody = $('#drawer-body');
  const wasOpenForSame = CURRENT_TASK && CURRENT_TASK.id === taskId && $('#drawer').classList.contains('on');
  const savedScroll = wasOpenForSame && drawerBody ? drawerBody.scrollTop : 0;
  CURRENT_TASK = t;
  const canWrite = P.canWriteTask(t);
  const assignee = DB.users.find(u=>u.id===t.assigneeId);
  /* v1.7：可移动的目标项目 = 我可见、未归档、且我对它有写权限的其他项目 */
  const moveTargets = P.visibleProjects().filter(p => p.id!==proj.id && !p.archived && P.canWriteProject(p));
  const linkEl0 = $('#drawer-project-link');
  linkEl0.textContent = proj.name;
  linkEl0.title = '前往项目页';
  linkEl0.onclick = ()=>{ closeDrawer(); nav(`#/project/${proj.id}`); };

  $('#drawer').classList.add('on');
  $('#drawer-mask').classList.add('on');

  // 深链：把任务写进 URL（replaceState 不触发 hashchange），支持复制链接与刷新恢复
  if(ROUTE.page==='project' && ROUTE.pid===t.projectId){
    const v = ['list','board','calendar','overview','gantt'].includes(ROUTE.view) ? ROUTE.view : 'overview';
    history.replaceState(null, '', `#/project/${t.projectId}/${v}/${t.id}`);
    ROUTE.tid = t.id; ROUTE.view = v;
  }
  /* v1.10 渲染去重：调用方的 openDrawer 与 renderApp（renderProject 内部按 ROUTE.tid
     再开一次）叠加时，抽屉一次交互会被整段重拼 2-3 遍。同一数据纪元内、抽屉已开着
     同一视图 → 只恢复滚动位置，跳过整段模板重拼与监听器拆建。
     数据一旦变化 saveDB 会 bump 纪元，守卫自动失效，不会显示旧内容。 */
  if(wasOpenForSame && _drawerRendered.id === taskId && _drawerRendered.sub === null && _drawerRendered.epoch === _dataEpoch){
    if(drawerBody) drawerBody.scrollTop = savedScroll;
    return;
  }

  const opts = sel => PRIO_ORDER.map(v=>`<option value="${v}" ${sel===v?'selected':''}>${PRIO[v]}</option>`).join('');
  const userOpts = (sel) => DB.users.filter(u=>u.active && (P.isAdmin() || proj.memberIds.includes(u.id)))
    .map(u=>`<option value="${u.id}" ${sel===u.id?'selected':''}>${esc(u.name)} · ${ROLE_NAME[u.role]}</option>`).join('');
  const recOpts = sel => ['', 'daily', 'weekly', 'monthly'].map(v=>`<option value="${v}" ${sel===v?'selected':''}>${v===''?'不重复':REC_NAME[v]}</option>`).join('');
  const followerHTML = ()=>{
    const fs = (t.followers||[]).map(id=>DB.users.find(u=>u.id===id)).filter(Boolean);
    return `<div class="avatar-stack" style="align-items:center">
      ${fs.map(u=>`<span class="avatar" style="background:${safeColor(u.color)}" title="${esc(u.name)}">${esc(u.name.slice(0,1))}</span>`).join('')}
      ${canWrite?`<button class="follower-add" id="dt-follower-add" title="关注人：接收该任务的动态通知，不代表拥有编辑权">＋ 添加关注人</button>`:(fs.length?'':'<span class="plain">还没有人关注</span>')}
    </div>`;
  };
  const tagHTML = ()=>{
    return (DB.tags||[]).map(g=>{
      const on = (t.tags||[]).includes(g.id);
      return `<span class="tag-chip ${on?'on':'off'}" data-tag="${g.id}" style="${on?`background:${safeColor(g.color)}`:''}">${esc(g.name)}</span>`;
    }).join('') + (canWrite?`<span class="tag-chip off" id="dt-tag-add" title="新建标签">＋</span>`:'');
  };
  const subtaskHTML = ()=>{
    return t.subtasks.map(s=>{
      const asg = DB.users.find(u=>u.id===s.assigneeId);
      const cmt = (s.comments||[]).length;
      return `<div class="subtask-row ${s.done?'done':''}" data-st="${s.id}"${canWrite?' draggable="true"':''}>
        <span class="check-circle ${s.done?'on':''}" title="${checkTitle(s.done, s.status)}" style="width:15px;height:15px"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"><path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="st-title" data-st-open="${s.id}" title="查看子任务详情与评论">${esc(s.title)}${(s.desc||'')?`<span class="subtask-count" title="有描述">¶</span>`:''}</span>
        <button class="st-cmt ${cmt?'has':''}" data-st-open="${s.id}" title="评论（${cmt} 条）">${icon('chat',12)}${cmt?cmt:''}</button>
        ${canWrite ? `
          <span class="st-assign" data-st-assign="${s.id}" title="指派负责人">
            ${asg?`<span class="avatar" style="background:${safeColor(asg.color)};width:20px;height:20px;font-size:9px">${esc(asg.name.slice(0,1))}</span>`
                 :`<span class="avatar-btn" style="width:20px;height:20px;font-size:10px" title="未指派负责人">${icon('user',11)}</span>`}
          </span>
          <button class="st-due ${s.dueDate?dueClass(s.dueDate, s.done, isPaused(s)):'empty'}" data-st-due="${s.id}">${s.dueDate?fmtDate(s.dueDate):'日期'}</button>
          <span class="st-del" data-st-del="${s.id}" title="删除子任务">×</span>` : `
          ${asg?`<span class="avatar" style="background:${safeColor(asg.color)};width:20px;height:20px;font-size:9px">${esc(asg.name.slice(0,1))}</span>`:''}
          ${s.dueDate?`<span class="st-due ${dueClass(s.dueDate, s.done, isPaused(s))}" style="cursor:default">${fmtDate(s.dueDate)}</span>`:''}`}
      </div>`;
    }).join('');
  };

  $('#drawer-body').innerHTML = `
    <div class="drawer-title-row">
      <span class="check-circle ${t.completed?'on':''}" id="dt-check" title="${checkTitle(t.completed, t.status)}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"><path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <textarea id="dt-title" rows="1" ${canWrite?'':'readonly'}>${esc(t.title)}</textarea>
    </div>

    <div class="dt-meta-grid">
      <div class="dt-meta-label">状态</div>
      <div class="dt-meta-value">
        ${canWrite ? statusPillsHTML('dt-status', t.status)
          : `<span class="status-pill ${STATUS_CLS[t.status]||'s-todo'}">${STATUS_NAME[t.status]||'待办'}</span>`}
      </div>
      <div class="dt-meta-label">所属项目</div>
      <div class="dt-meta-value">
        ${canWrite && moveTargets.length
          ? `<button type="button" class="proj-move-btn" id="dt-move-btn" title="点击搜索其他项目并移动过去（子任务、评论与动态会一起走）">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              <span>${esc(proj.name)}</span>
              <svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6" stroke-linecap="round"/></svg>
            </button>`
          : `<span class="plain" title="${esc(proj.name)}">${esc(proj.name)}</span>`}
      </div>
      <div class="dt-meta-label">负责人</div>
      <div class="dt-meta-value">
        ${canWrite ? `<select class="role-select" id="dt-assignee" style="min-width:170px">
            <option value="">未指派</option>${userOpts(t.assigneeId)}</select>`
          : `<span class="plain">${assignee?esc(assignee.name):'未指派'}</span>`}
      </div>
      <div class="dt-meta-label">开始日期</div>
      <div class="dt-meta-value">
        ${canWrite ? dateFieldHTML('dt-start', t.startDate)
          : `<span class="plain">${t.startDate ? fmtDate(t.startDate) : '未设置'}</span>`}
      </div>
      <div class="dt-meta-label">截止日期</div>
      <div class="dt-meta-value">
        ${canWrite ? dateFieldHTML('dt-due', t.dueDate)
          : `<span class="plain">${t.dueDate ? fmtDate(t.dueDate) : '未设置'}</span>`}
      </div>
      <div class="dt-meta-label">优先级</div>
      <div class="dt-meta-value">
        ${canWrite ? prioPillsHTML('dt-prio', t.priority)
          : `<span class="plain">${prioName(t.priority)}</span>`}
      </div>
      <div class="dt-meta-label">重复</div>
      <div class="dt-meta-value">
        ${canWrite ? `<select class="role-select" id="dt-rec">${recOpts(t.recurring||'')}</select>`
          : `<span class="plain">${t.recurring?REC_NAME[t.recurring]:'不重复'}</span>`}
      </div>
      <div class="dt-meta-label">关注人</div>
      <div class="dt-meta-value">${followerHTML()}</div>
    </div>

    <div class="dt-sec"><div class="dt-sec-title">标签</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${tagHTML()}</div>
    </div>

    <div class="dt-sec"><div class="dt-sec-title">描述</div>
      <textarea id="dt-desc" rows="4" placeholder="补充任务描述、验收标准…" ${canWrite?'':'readonly'}>${esc(t.desc)}</textarea>
    </div>

    <div class="dt-sec"><div class="dt-sec-title">子任务 (${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length})</div>
      <div id="dt-subtasks">${subtaskHTML()}</div>
      ${canWrite?`<div class="add-subtask" id="dt-add-sub"><span class="plus">＋</span>添加子任务</div>`:''}
    </div>

    <div class="dt-sec"><div class="dt-sec-title">评论 (${t.comments.length})</div>
      ${t.comments.map(cm=>{
        const u = DB.users.find(x=>x.id===cm.userId)||{name:'?',color:'#999'};
        const editable = canWrite && cm.userId===ME.id;
        const deletable = canWrite && (cm.userId===ME.id || P.isAdmin());
        return `<div class="comment-item" data-cm="${cm.id}">
          <span class="avatar" style="background:${safeColor(u.color)}">${esc(u.name.slice(0,1))}</span>
          <div style="flex:1"><div class="c-head"><span class="c-user">${esc(u.name)}</span><span class="c-time" title="评论于 ${timeTitle(cm.ts)}">${fmtTime(cm.ts)}${cm.editedAt?'<span class="edited-mark">（已编辑 '+timeTitle(cm.editedAt)+'）</span>':''}</span>${(editable||deletable)?`<span class="c-actions">${editable?`<button data-cm-edit="${cm.id}">编辑</button>`:''}${deletable?`<button data-cm-del="${cm.id}">删除</button>`:''}</span>`:''}</div>
          <div class="c-text">${esc(cm.text)}</div></div>
        </div>`;
      }).join('')}
      ${canWrite?`<div class="comment-box">
        <span class="avatar" style="background:${safeColor(ME.color)}">${esc(ME.name.slice(0,1))}</span>
        <textarea id="dt-comment" placeholder="发表评论…（Ctrl+Enter 发送）"></textarea>
      </div>
      <button class="btn btn-primary btn-sm" id="dt-comment-btn" style="margin-top:8px">发送评论</button>`:''}
    </div>

    <div class="dt-sec"><div class="dt-sec-title">活动记录</div>${activityListHTML(t.activities, t.id)}</div>

    ${canWrite?`<div class="dt-danger-zone">
      <button class="btn btn-outline btn-sm" id="dt-dup" title="在同一项目同一状态复制一份任务（不带评论与活动记录）">${icon('copy',13)} 复制任务</button>
      <button class="btn btn-danger btn-sm" id="dt-del" title="删除任务：连同子任务与评论移入回收站，30 天内可恢复">${icon('trash',13)} 删除任务</button>
      <span class="dt-danger-hint">删除后可在回收站保留 30 天，撤销按钮 6 秒内可立即恢复</span>
    </div>`:''}
  `;

  // 标题自适应高度
  const titleEl = $('#dt-title');
  const autoH = ()=>{ titleEl.style.height='auto'; titleEl.style.height = titleEl.scrollHeight+'px'; };
  autoH();
  if(canWrite){
    titleEl.addEventListener('input', ()=>{ autoH(); });
    titleEl.addEventListener('blur', ()=>{
      const v = titleEl.value.trim();
      if(v && v!==t.title){ t.title=v; t.activities.push({id:uid('a_'),userId:ME.id,text:'修改了标题',ts:Date.now()}); saveDB(); renderApp(); }
    });
    $('#dt-check').onclick = ()=>{ closeDrawer(); toggleTaskDone(t.id); };

    /* v1.7.1：所属项目 —— 显示当前项目，点击弹出可搜索切换器，
       选中目标项目即移动；跟随到新项目页并保持抽屉打开 */
    const moveBtn = $('#dt-move-btn');
    if(moveBtn) moveBtn.onclick = (e)=>{
      e.stopPropagation();
      openProjectPicker(moveBtn, proj.id, (pid2)=>{
        if(!pid2 || pid2===t.projectId) return;
        if(moveTaskToProject(t.id, pid2)){
          if(ROUTE.page==='project'){
            const v = ['list','board','calendar','overview','gantt'].includes(ROUTE.view) ? ROUTE.view : 'list';
            history.replaceState(null, '', '#/project/' + pid2 + '/' + v + '/' + t.id);
            ROUTE = parseRoute();
            renderApp();                      // renderProject 会按 ROUTE.tid 重新打开抽屉
          }else{
            renderApp(); openDrawer(t.id);
          }
        }
      });
    };

    // 状态三选（pill 点选，单选高亮）
    bindStatusPills($('#drawer-body'), (st)=>{
      t.status = st;
      const wasCompleted = t.completed;
      t.completed = (st==='done');
      t.completedAt = st==='done' ? Date.now() : null;
      if(st==='done' && !wasCompleted && t.recurring) spawnRecurringNext(t);
      t.activities.push({id:uid('a_'),userId:ME.id,text:`状态改为「${STATUS_NAME[st]}」`,ts:Date.now()});
      saveDB(); renderApp(); openDrawer(t.id);
    });

    $('#dt-assignee').onchange = (e)=>{
      const old = t.assigneeId ? (DB.users.find(u=>u.id===t.assigneeId)||{}).name : '未指派';
      t.assigneeId = e.target.value || null;
      const nm = t.assigneeId ? (DB.users.find(u=>u.id===t.assigneeId)||{}).name : '未指派';
      t.activities.push({id:uid('a_'),userId:ME.id,text:`负责人由「${old}」改为「${nm}」`,ts:Date.now()});
      saveDB();
      if(t.assigneeId) notify(t.assigneeId, 'assign', t.id, { title: t.title });
      renderApp(); updateDrawerContext(t.id);
    };
    $('#dt-start').onchange = (e)=>{
      const r = applyDatePair(t, 'start', e.target.value);
      t.startDate = r.startDate; t.dueDate = r.dueDate;
      if(r.moved==='dueDate') toast('开始日期晚于原截止日期，截止日期已顺延到 ' + fmtDate(r.dueDate), 'err');
      t.activities.push({id:uid('a_'),userId:ME.id,text:'修改了开始日期',ts:Date.now()}); saveDB(); renderApp();
    };
    $('#dt-due').onchange = (e)=>{
      const r = applyDatePair(t, 'due', e.target.value);
      t.startDate = r.startDate; t.dueDate = r.dueDate;
      if(r.moved==='startDate') toast('截止日期早于原开始日期，开始日期已同步为 ' + fmtDate(r.startDate), 'err');
      t.activities.push({id:uid('a_'),userId:ME.id,text:'修改了截止日期',ts:Date.now()}); saveDB(); renderApp();
    };
    bindPrioPills($('#drawer-body'), (p)=>{ t.priority = p; saveDB(); toast(`优先级已设为「${prioName(p)}」`); renderApp(); });
    $('#dt-rec').onchange = (e)=>{
      t.recurring = e.target.value || null;
      t.activities.push({id:uid('a_'),userId:ME.id,text: t.recurring?`设置为${REC_NAME[t.recurring]}重复`:'取消了重复',ts:Date.now()});
      saveDB(); toast(t.recurring?`已开启${REC_NAME[t.recurring]}重复：完成后自动生成下一期`:'已取消重复');
    };
    $('#dt-desc').addEventListener('blur', ()=>{
      if($('#dt-desc').value !== t.desc){ t.desc = $('#dt-desc').value; saveDB(); toast('描述已保存'); }
    });

    // 关注人
    const fadd = $('#dt-follower-add');
    if(fadd) fadd.onclick = ()=>{
      const cands = DB.users.filter(u=>u.active && !(t.followers||[]).includes(u.id) && u.id!==t.assigneeId);
      if(!cands.length) return toast('没有可添加的关注人', 'err');
      openPopover(fadd, cands.map(u=>
        `<div class="po-item" data-po="${u.id}"><span class="avatar" style="background:${safeColor(u.color)};width:20px;height:20px;font-size:9px">${esc(u.name.slice(0,1))}</span><b>${esc(u.name)}</b></div>`).join('')
        + `<div class="po-sep"></div><div class="po-item" data-po="__rm">移除全部关注人</div>`,
        (uid2)=>{
          if(uid2==='__rm'){
            const was = (t.followers||[]).slice();
            removePopover();
            if(!was.length){ toast('这个任务还没有关注人'); return; }
            t.followers = [];
            t.activities.push({id:uid('a_'), userId:ME.id, text:'移除了全部关注人', ts:Date.now()});
            saveDB(); renderApp(); openDrawer(t.id);
            toast('已移除 ' + was.length + ' 位关注人', 'ok',
              { label:'撤销', fn:()=>{ t.followers = was; saveDB(); renderApp(); openDrawer(t.id); } });
            return;
          }
          else{
            t.followers = t.followers||[]; t.followers.push(uid2);
            const u = DB.users.find(x=>x.id===uid2);
            t.activities.push({id:uid('a_'),userId:ME.id,text:`添加 ${u?u.name:''} 为关注人`,ts:Date.now()});
            notify(uid2, 'follower', t.id, { title: t.title });
          }
          saveDB(); removePopover(); renderApp(); openDrawer(t.id);
        });
    };

    // 标签切换
    $$('#drawer-body .tag-chip[data-tag]').forEach(chip=>chip.onclick=()=>{
      const gid = chip.dataset.tag;
      t.tags = t.tags||[];
      const i = t.tags.indexOf(gid);
      if(i>=0) t.tags.splice(i,1); else t.tags.push(gid);
      const g = tagOf(gid);
      t.activities.push({id:uid('a_'),userId:ME.id,text:`${i>=0?'移除':'添加'}标签「${g?g.name:''}」`,ts:Date.now()});
      saveDB(); renderApp(); openDrawer(t.id);
    });
    const tadd = $('#dt-tag-add');
    if(tadd) tadd.onclick = async ()=>{
      const name = await openPromptModal({ title:'新建标签', label:'标签名称', placeholder:'例如：紧急', required:true, emptyTip:'标签名称不能为空', okText:'创建标签' });
      if(!name) return;
      DB.tags = DB.tags||[];
      const exist = findDupName(DB.tags, name);
      if(exist){
        t.tags = t.tags||[]; if(!t.tags.includes(exist.id)) t.tags.push(exist.id);
        saveDB(); renderApp(); openDrawer(t.id); toast('已有同名标签，直接用上了', 'ok'); return;
      }
      const g = { id:uid('g_'), name, color: PROJ_COLORS[Math.floor(Math.random()*PROJ_COLORS.length)] };
      DB.tags.push(g);
      t.tags = t.tags||[]; t.tags.push(g.id);
      saveDB(); renderApp(); openDrawer(t.id);
    };

    // ---- 子任务：完成 / 打开详情 / 指派 / 日期 / 删除（可撤销） ----
    const bindSubtasks = ()=>{
      $$('#drawer-body .subtask-row .check-circle').forEach(chk=>{
        chk.onclick = ()=>{
          const s = t.subtasks.find(x=>x.id===chk.parentElement.dataset.st);
          if(s){ toggleSubDone(t, s); saveDB(); openDrawer(t.id); renderApp(); }
        };
      });
      // 标题 / 评论角标 → 打开子任务详情视图（评论等，与主任务一致）
      $$('#drawer-body [data-st-open]').forEach(el=>{
        el.onclick = (e)=>{ e.stopPropagation(); openSubDrawer(t.id, el.dataset.stOpen); };
      });
      // 指派子任务负责人（popover）
      $$('#drawer-body [data-st-assign]').forEach(el=>{
        el.onclick = (e)=>{
          e.stopPropagation();
          const s = t.subtasks.find(x=>x.id===el.dataset.stAssign);
          const cands = DB.users.filter(u=>u.active && (P.isAdmin() || proj.memberIds.includes(u.id)));
          openPopover(el, cands.map(u=>
            `<div class="po-item" data-po="${u.id}"><span class="avatar" style="background:${safeColor(u.color)};width:20px;height:20px;font-size:9px">${esc(u.name.slice(0,1))}</span><b>${esc(u.name)}</b><span class="sub">${ROLE_NAME[u.role]}</span></div>`).join('')
            + `<div class="po-sep"></div><div class="po-item" data-po="">未指派</div>`,
            (uid2)=>{
              if(s){
                const oldName = s.assigneeId ? (DB.users.find(u=>u.id===s.assigneeId)||{}).name : '未指派';
                const newName = uid2 ? (DB.users.find(u=>u.id===uid2)||{}).name : '未指派';
                s.assigneeId = uid2 || null;
                s.activities.push({id:uid('a_'), userId:ME.id, text:`负责人由「${oldName}」改为「${newName}」`, ts:Date.now()});
                if(s.assigneeId) notify(s.assigneeId, 'subtask_assign', t.id, { subTitle: s.title });
                saveDB(); }
              removePopover(); renderApp(); openDrawer(t.id);
            });
        };
      });
      // 子任务到期日（点击 → date input）
      $$('#drawer-body [data-st-due]').forEach(btn=>{
        btn.onclick = (e)=>{
          e.stopPropagation();
          const s = t.subtasks.find(x=>x.id===btn.dataset.stDue);
          if(!s) return;
          const input = document.createElement('input');
          input.type = 'date'; input.className = 'st-due-input';
          input.value = s.dueDate || '';
          btn.replaceWith(input);
          input.focus({preventScroll:true});
          const commit = ()=>{
            if((s.dueDate || null) !== (input.value || null)){
              s.dueDate = input.value || null;
              s.activities.push({id:uid('a_'), userId:ME.id, text:'修改了截止日期', ts:Date.now()});
              saveDB(); renderApp(); openDrawer(t.id);
            }
          };
          input.addEventListener('blur', commit);
          input.addEventListener('change', commit);
        };
      });
      /* v1.8.1：子任务拖拽排序（拖到目标行上/下方，松手即重排并落盘） */
      let _subDragId = null, _subDropAfter = false;
      $$('#drawer-body .subtask-row[draggable]').forEach(row=>{
        row.addEventListener('dragstart', e=>{
          _subDragId = row.dataset.st;
          if(e.dataTransfer) e.dataTransfer.setData('text/plain', _subDragId);
          row.classList.add('dragging');
        });
        row.addEventListener('dragover', e=>{
          e.preventDefault();
          if(!_subDragId || _subDragId === row.dataset.st) return;
          const r = row.getBoundingClientRect();
          _subDropAfter = e.clientY >= r.top + r.height/2;
          row.classList.toggle('drop-above', !_subDropAfter);
          row.classList.toggle('drop-below', _subDropAfter);
        });
        row.addEventListener('drop', e=>{
          e.preventDefault();
          row.classList.remove('drop-above','drop-below');
          const srcId = _subDragId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
          if(!srcId || srcId === row.dataset.st) return;
          const fromIdx = t.subtasks.findIndex(x=>x.id===srcId);
          if(fromIdx < 0) return;
          const [item] = t.subtasks.splice(fromIdx, 1);
          const dstIdx = t.subtasks.findIndex(x=>x.id===row.dataset.st);
          t.subtasks.splice(_subDropAfter ? dstIdx+1 : dstIdx, 0, item);
          saveDB(); openDrawer(t.id);
        });
        row.addEventListener('dragend', ()=>{
          row.classList.remove('dragging');
          $$('#drawer-body .subtask-row').forEach(r=>r.classList.remove('drop-above','drop-below'));
          _subDragId = null;
        });
      });

      $$('#drawer-body [data-st-del]').forEach(b=>b.onclick=(e)=>{
        e.stopPropagation();
        const idx = t.subtasks.findIndex(x=>x.id===b.dataset.stDel);
        if(idx < 0) return;
        const [item] = t.subtasks.splice(idx, 1);
        t.activities.push({id:uid('a_'), userId:ME.id, text:`删除子任务「${item.title}」`, ts:Date.now()});
        saveDB(); openDrawer(t.id); renderApp();
        toast('子任务已删除', 'ok', { label:'撤销', fn:()=>{
          t.subtasks.splice(Math.min(idx, t.subtasks.length), 0, item);
          saveDB(); renderApp();
        }});
      });
    };
    bindSubtasks();
    bindDateFieldDisplay($('#drawer-body'));
    $('#dt-add-sub').onclick = ()=>{
      openAddSubtaskModal(t, proj);
    };
    // 评论
    const send = ()=>{
      const v = $('#dt-comment').value.trim(); if(!v) return;
      t.comments.push({id:uid('cm_'), userId:ME.id, text:v, ts:Date.now()});
      t.activities.push({id:uid('a_'),userId:ME.id,text:'添加了评论',ts:Date.now()});
      saveDB(); openDrawer(t.id); renderApp();
      const watchers = [t.assigneeId, t.createdBy, ...(t.followers||[])].filter(x=>x && x!==ME.id);
      [...new Set(watchers)].forEach(uid2 => notify(uid2, 'comment', t.id, { title: t.title, text: v }));
    };
    $('#dt-comment-btn').onclick = send;
    $('#dt-comment').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) send(); });

    // 评论编辑（仅作者，原处回显+保存/取消，不触发整页重绘）
    const bindCommentEdit = ()=>{
      $$('#drawer-body [data-cm-edit]').forEach(btn=>{
        btn.onclick = ()=>{
          const cm = t.comments.find(x=>x.id===btn.dataset.cmEdit);
          if(!cm) return;
          const item = btn.closest('.comment-item');
          if(!item) return;
          const textEl = $('.c-text', item);
          const timeEl = $('.c-time', item);
          if(!textEl) return;
          const original = cm.text;
          item.classList.add('editing');
          const area = document.createElement('textarea');
          area.className = 'comment-edit-area';
          area.value = original;
          textEl.replaceWith(area);
          const actions = document.createElement('div');
          actions.className = 'comment-edit-actions';
          actions.innerHTML = `<button class="btn btn-primary btn-sm cm-save">保存</button><button class="btn btn-ghost btn-sm cm-cancel">取消</button>`;
          area.parentNode.insertBefore(actions, area.nextSibling);
          const ac = $('.c-actions', item); if(ac) ac.style.display='none';
          area.focus({preventScroll:true});
          area.setSelectionRange(area.value.length, area.value.length);
          const finish = (saved=false)=>{
            if(!area.parentNode) return; // 防止保存/取消二次触发
            const v = area.value.trim();
            item.classList.remove('editing');
            if(saved && v && v!==original){
              cm.text = v;
              cm.editedAt = Date.now();
              textEl.textContent = v;
              if(timeEl){ timeEl.title = '评论于 ' + timeTitle(cm.ts); timeEl.innerHTML = fmtTime(cm.ts) + '<span class="edited-mark">（已编辑 ' + timeTitle(cm.editedAt) + '）</span>'; }
              t.activities.push({id:uid('a_'),userId:ME.id,text:'修改了评论',ts:Date.now()});
              saveDB();
            }
            area.replaceWith(textEl);
            actions.remove();
            const ac2 = $('.c-actions', item); if(ac2) ac2.style.display='';
          };
          $('.cm-save', actions).onclick = ()=>finish(true);
          $('.cm-cancel', actions).onclick = ()=>finish(false);
          area.addEventListener('keydown', e=>{
            if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); finish(true); }
            if(e.key==='Escape'){ e.preventDefault(); finish(false); }
          });
          area.addEventListener('blur', ()=>{ setTimeout(()=>{ if(!item.querySelector('.comment-edit-area:focus')) finish(false); }, 180); });
        };
      });
    };
    bindCommentEdit();

    // 评论删除（作者本人或管理员；撤销可原位恢复）
    $$('#drawer-body [data-cm-del]').forEach(btn=>btn.onclick=()=>{
      const i = t.comments.findIndex(x=>x.id===btn.dataset.cmDel);
      if(i < 0) return;
      openConfirm({
        title:'删除这条评论？', okText:'删除评论', danger:true,
        onOk:()=>{
          const [item] = t.comments.splice(i, 1);
          t.activities.push({id:uid('a_'), userId:ME.id, text:'删除了评论', ts:Date.now()});
          saveDB(); openDrawer(t.id); renderApp();
          toast('评论已删除', 'ok', { label:'撤销', fn:()=>{
            t.comments.splice(Math.min(i, t.comments.length), 0, item);
            saveDB(); openDrawer(t.id); renderApp();
          }});
        }
      });
    });

    $('#dt-dup').onclick = ()=>{ duplicateTask(t.id); };
    $('#dt-del').onclick = ()=>{
      openConfirm({
        title:'删除任务？',
        html:`删除任务「${esc(t.title)}」？\n将连同其子任务、评论与活动记录移入回收站（30 天内可恢复）。`,
        okText:'删除任务', danger:true,
        onOk:()=>{
          const moved = trashTaskIds([t.id]);
          saveDB(); closeDrawer(); renderApp();
          toast('任务已移入回收站', 'ok',
            moved.length ? { label:'撤销', fn:()=>{ moved.forEach(m=>restoreTrashedTask(m)); saveDB(); renderApp(); } } : null);
        }
      });
    };
  }
  // 重绘抽屉时保留滚动位置，避免焦点/状态切换导致跳到顶部
  // 只读访客：仍允许进入子任务详情查看描述与评论（视图内部会禁用一切编辑）
  if(!canWrite){
    $$('#drawer-body [data-st-open]').forEach(el=> el.onclick=(e)=>{ e.stopPropagation(); openSubDrawer(t.id, el.dataset.stOpen); });
    /* v1.6：完成圆点在只读分支没有处理器，但仍是 pointer 外观——此前点了毫无反馈
       （与列表行同场景的拒绝提示不一致）。给一句明确的拒绝说明 */
    const roCheck = $('#dt-check');
    if(roCheck) roCheck.onclick = ()=>toast(denyWriteTaskMsg(t), 'err');
  }
  /* v1.7.5：只有在重绘同一条任务时才保留滚动位置；
     切到另一条任务一律回到顶部，否则会停在上一条的阅读位置 */
  if(drawerBody) drawerBody.scrollTop = wasOpenForSame ? savedScroll : 0;
  _drawerRendered = { id: taskId, sub: null, epoch: _dataEpoch };   // 渲染去重登记（v1.10）
  /* v1.6：键盘增强必须在 drawer-body 重绘【之后】执行——此前调用发生在
     innerHTML 赋值之前，增强的是上一次打开的旧节点，新抽屉里的控件
     全都没有 tabindex/role，Enter·Space 激活对它们整体失效 */
  /* v1.7.5：活动记录「显示全部 / 收起」开关（key 为 t.id 或 t.id/s.id） */
  $$('#drawer-body [data-act-fold]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const k = b.dataset.actFold;
    if(ACT_EXPANDED.has(k)) ACT_EXPANDED.delete(k); else ACT_EXPANDED.add(k);
    _drawerRendered = { id:null, sub:null, epoch:-1 };   // 折叠态变了：内容确实不同，绕过去重守卫
    const parts = k.split('/');
    if(parts.length === 2) openSubDrawer(parts[0], parts[1]); else openDrawer(parts[0]);
  });
  enhanceA11y($('#drawer-body'));
}
function updateDrawerContext(taskId){
  const t = DB.tasks.find(x=>x.id===taskId);
  if(t && CURRENT_TASK && CURRENT_TASK.id===taskId && $('#drawer').classList.contains('on')){
    const proj = P.visibleProject(t.projectId);
    if(proj){ $('#drawer-project-link').textContent = proj.name; }
  }
}
function closeDrawer(){
  $('#drawer').classList.remove('on');
  $('#drawer-mask').classList.remove('on');
  if(ROUTE.tid && ROUTE.page==='project'){
    if(location.hash.startsWith(`#/project/${ROUTE.pid}/`)){
      history.replaceState(null, '', `#/project/${ROUTE.pid}/${ROUTE.view||'overview'}`);
    }
    ROUTE.tid = null;
  }
  ROUTE.sid = null;
  CURRENT_TASK = null;
  CURRENT_SUB = null;
}
$('#drawer-close').onclick = ()=>closeDrawer();
$('#drawer-mask').onclick = ()=>closeDrawer();
$('#drawer-copy-link').onclick = async ()=>{
  if(!$('#drawer').classList.contains('on')) return;
  const isFile = location.protocol === 'file:';
  const ok = await copyText(location.href);
  if(!ok) return toast('复制失败，请手动复制浏览器地址栏', 'err');
  toast(isFile ? '链接已复制（本地文件方式打开，仅在你自己电脑上能打开）' : '链接已复制，发给同事可直接打开这个任务', 'ok');
};

/* ============ 子任务详情视图（与主任务一致，唯一区别：不能再嵌套子任务） ============ */
function openSubDrawer(taskId, subId){
  const t = DB.tasks.find(x=>x.id===taskId);
  const s = t && (t.subtasks||[]).find(x=>x.id===subId);
  const proj = t ? P.visibleProject(t.projectId) : null;
  if(!t || !s || !proj){ toast('无权查看该子任务', 'err'); return; }
  const drawerBody = $('#drawer-body');
  const wasOpenForSame = CURRENT_SUB && CURRENT_SUB.id === subId && $('#drawer').classList.contains('on');
  const savedScroll = wasOpenForSame && drawerBody ? drawerBody.scrollTop : 0;
  CURRENT_TASK = t; CURRENT_SUB = s;
  const canWrite = P.canWriteTask(t);
  const assignee = DB.users.find(u=>u.id===s.assigneeId);

  $('#drawer').classList.add('on');
  $('#drawer-mask').classList.add('on');

  const linkEl = $('#drawer-project-link');
  linkEl.textContent = '‹ 父任务：' + t.title;
  linkEl.title = '返回主任务';
  linkEl.onclick = ()=>{ openDrawer(t.id); };

  // 深链：#/project/pid/view/tid/sid
  if(ROUTE.page==='project' && ROUTE.pid===t.projectId){
    const v = ['list','board','calendar','overview','gantt'].includes(ROUTE.view) ? ROUTE.view : 'overview';
    history.replaceState(null, '', `#/project/${t.projectId}/${v}/${t.id}/${s.id}`);
    ROUTE.tid = t.id; ROUTE.sid = s.id; ROUTE.view = v;
  }
  /* v1.10 渲染去重（同 openDrawer）：同一纪元内重复打开同一子任务视图直接跳过 */
  if(wasOpenForSame && _drawerRendered.id === taskId && _drawerRendered.sub === subId && _drawerRendered.epoch === _dataEpoch){
    if(drawerBody) drawerBody.scrollTop = savedScroll;
    return;
  }

  const userOpts = (sel) => DB.users.filter(u=>u.active && (P.isAdmin() || proj.memberIds.includes(u.id)))
    .map(u=>`<option value="${u.id}" ${sel===u.id?'selected':''}>${esc(u.name)} · ${ROLE_NAME[u.role]}</option>`).join('');
  const recOpts = sel => ['', 'daily', 'weekly', 'monthly'].map(v=>`<option value="${v}" ${sel===v?'selected':''}>${v===''?'不重复':REC_NAME[v]}</option>`).join('');
  const prioCurrent = (s.priority == null) ? t.priority : s.priority;   // null = 继承主任务
  const followerHTML = ()=>{
    const fs = (s.followers||[]).map(id=>DB.users.find(u=>u.id===id)).filter(Boolean);
    return `<div class="avatar-stack" style="align-items:center">
      ${fs.map(u=>`<span class="avatar" style="background:${safeColor(u.color)}" title="${esc(u.name)}">${esc(u.name.slice(0,1))}</span>`).join('')}
      ${canWrite?`<button class="follower-add" id="ds-follower-add" title="关注人：接收该子任务的动态通知，不代表拥有编辑权">＋ 添加关注人</button>`:(fs.length?'':'<span class="plain">还没有人关注</span>')}
    </div>`;
  };
  const tagHTML = ()=> (DB.tags||[]).map(g=>{
    const on = (s.tags||[]).includes(g.id);
    return `<span class="tag-chip ${on?'on':'off'}" data-stag="${g.id}" style="${on?`background:${safeColor(g.color)}`:''}">${esc(g.name)}</span>`;
  }).join('') + (canWrite?`<span class="tag-chip off" id="ds-tag-add" title="新建标签">＋</span>`:'');

  $('#drawer-body').innerHTML = `
    <div class="drawer-title-row">
      <span class="check-circle st-${s.status||'todo'} ${s.done?'on':''}" id="ds-check" title="${checkTitle(s.done, s.status)}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"><path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <textarea id="ds-title" rows="1" ${canWrite?'':'readonly'}>${esc(s.title)}</textarea>
    </div>
    <div style="margin:-2px 0 6px 32px"><span class="tag" style="background:#eef1ee;color:#5f6b62">子任务</span>
      <span class="status-pill ${STATUS_CLS[s.status]||'s-todo'}" style="margin-left:6px">${STATUS_NAME[s.status]||'待办'}</span></div>

    <div class="dt-meta-grid">
      <div class="dt-meta-label">状态</div>
      <div class="dt-meta-value">
        ${canWrite ? statusPillsHTML('ds-status', s.status)
          : `<span class="status-pill ${STATUS_CLS[s.status]||'s-todo'}">${STATUS_NAME[s.status]||'待办'}</span>`}
      </div>
      <div class="dt-meta-label">负责人</div>
      <div class="dt-meta-value">
        ${canWrite ? `<select class="role-select" id="ds-assignee" style="min-width:170px"><option value="">未指派</option>${userOpts(s.assigneeId)}</select>`
          : `<span class="plain">${assignee?esc(assignee.name):'未指派'}</span>`}
      </div>
      <div class="dt-meta-label">开始日期</div>
      <div class="dt-meta-value">${canWrite ? dateFieldHTML('ds-start', s.startDate) : `<span class="plain">${s.startDate ? fmtDate(s.startDate) : '未设置'}</span>`}</div>
      <div class="dt-meta-label">截止日期</div>
      <div class="dt-meta-value">${canWrite ? dateFieldHTML('ds-due', s.dueDate) : `<span class="plain">${s.dueDate ? fmtDate(s.dueDate) : '未设置'}</span>`}</div>
      <div class="dt-meta-label">优先级</div>
      <div class="dt-meta-value">
        ${canWrite ? `<div id="ds-prio" style="display:flex;gap:8px;flex-wrap:wrap">
            ${PRIO_PILLS.map(x=>`<button type="button" class="sec-preset ${prioCurrent===x.p?'on':''}" data-sprio="${x.p}"><span class="sp-dot" style="background:${x.color}"></span>${x.name}</button>`).join('')}
            <button type="button" class="sec-preset ${s.priority==null?'on':''}" data-sprio="" title="跟随主任务优先级">继承主任务</button>
          </div>`
        : `<span class="plain">${prioName(prioCurrent)}${s.priority==null?'（继承主任务）':''}</span>`}
      </div>
      <div class="dt-meta-label">重复</div>
      <div class="dt-meta-value">${canWrite ? `<select class="role-select" id="ds-rec">${recOpts(s.recurring||'')}</select>` : `<span class="plain">${s.recurring?REC_NAME[s.recurring]:'不重复'}</span>`}</div>
      <div class="dt-meta-label">关注人</div>
      <div class="dt-meta-value">${followerHTML()}</div>
    </div>

    <div class="dt-sec"><div class="dt-sec-title">标签</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${tagHTML()}</div>
    </div>

    <div class="dt-sec"><div class="dt-sec-title">描述</div>
      <textarea id="ds-desc" rows="4" placeholder="补充子任务描述、注意事项、验收标准…" ${canWrite?'':'readonly'}>${esc(s.desc||'')}</textarea>
    </div>

    <div class="dt-sec"><div class="dt-sec-title">评论 (${(s.comments||[]).length})</div>
      ${(s.comments||[]).map(cm=>{
        const u = DB.users.find(x=>x.id===cm.userId)||{name:'?',color:'#999'};
        const editable = canWrite && cm.userId===ME.id;
        const deletable = canWrite && (cm.userId===ME.id || P.isAdmin());
        return `<div class="comment-item" data-scm="${cm.id}">
          <span class="avatar" style="background:${safeColor(u.color)}">${esc(u.name.slice(0,1))}</span>
          <div style="flex:1"><div class="c-head"><span class="c-user">${esc(u.name)}</span><span class="c-time" title="评论于 ${timeTitle(cm.ts)}">${fmtTime(cm.ts)}${cm.editedAt?'<span class="edited-mark">（已编辑 '+timeTitle(cm.editedAt)+'）</span>':''}</span>${(editable||deletable)?`<span class="c-actions">${editable?`<button data-scm-edit="${cm.id}">编辑</button>`:''}${deletable?`<button data-scm-del="${cm.id}">删除</button>`:''}</span>`:''}</div>
          <div class="c-text">${esc(cm.text)}</div></div>
        </div>`;
      }).join('')}
      ${canWrite?`<div class="comment-box">
        <span class="avatar" style="background:${safeColor(ME.color)}">${esc(ME.name.slice(0,1))}</span>
        <textarea id="ds-comment" placeholder="针对该子任务发表评论…（Ctrl+Enter 发送）"></textarea>
      </div>
      <button class="btn btn-primary btn-sm" id="ds-comment-btn" style="margin-top:8px">发送评论</button>`:''}
    </div>

    <div class="dt-sec"><div class="dt-sec-title">活动记录</div>${activityListHTML(s.activities, t.id + '/' + s.id)}</div>

    ${canWrite?`<div class="dt-danger-zone">
      <button class="btn btn-danger btn-sm" id="ds-del">${icon('trash',13)} 删除此子任务</button>
    </div>`:''}
  `;

  const titleEl = $('#ds-title');
  const autoH = ()=>{ titleEl.style.height='auto'; titleEl.style.height = titleEl.scrollHeight+'px'; };
  autoH();

  if(canWrite){
    titleEl.addEventListener('input', autoH);
    titleEl.addEventListener('blur', ()=>{
      const v = titleEl.value.trim();
      if(v && v!==s.title){ s.title=v; s.activities.push({id:uid('a_'),userId:ME.id,text:'修改了标题',ts:Date.now()}); saveDB(); renderApp(); openSubDrawer(t.id, s.id); }
    });
    $('#ds-check').onclick = ()=>{
      toggleSubDone(t, s);
      s.activities.push({id:uid('a_'), userId:ME.id, text: s.done?'完成了子任务':'重新打开了子任务', ts:Date.now()});
      saveDB(); renderApp(); openSubDrawer(t.id, s.id);
      if(s.done && s.recurring) toast(`重复子任务已生成下一期：${REC_NAME[s.recurring]}`, 'ok');
    };
    bindStatusPills($('#drawer-body'), (st)=>{
      setSubStatus(t, s, st);
      s.activities.push({id:uid('a_'), userId:ME.id, text:`状态改为「${STATUS_NAME[st]}」`, ts:Date.now()});
      saveDB(); renderApp(); openSubDrawer(t.id, s.id);
    });
    $('#ds-assignee').onchange = (e)=>{
      const oldName = s.assigneeId ? (DB.users.find(u=>u.id===s.assigneeId)||{}).name : '未指派';
      s.assigneeId = e.target.value || null;
      const newName = s.assigneeId ? (DB.users.find(u=>u.id===s.assigneeId)||{}).name : '未指派';
      s.activities.push({id:uid('a_'), userId:ME.id, text:`负责人由「${oldName}」改为「${newName}」`, ts:Date.now()});
      saveDB();
      if(s.assigneeId) notify(s.assigneeId, 'subtask_assign', t.id, { subTitle: s.title });
      renderApp(); openSubDrawer(t.id, s.id);
    };
    $('#ds-start').onchange = (e)=>{ const r = applyDatePair(s, 'start', e.target.value);
      s.startDate = r.startDate; s.dueDate = r.dueDate;
      if(r.moved==='dueDate') toast('开始日期晚于原截止日期，截止日期已顺延到 ' + fmtDate(r.dueDate), 'err');
      s.activities.push({id:uid('a_'),userId:ME.id,text:'修改了开始日期',ts:Date.now()}); saveDB(); renderApp(); };
    $('#ds-due').onchange = (e)=>{ const r = applyDatePair(s, 'due', e.target.value);
      s.startDate = r.startDate; s.dueDate = r.dueDate;
      if(r.moved==='startDate') toast('截止日期早于原开始日期，开始日期已同步为 ' + fmtDate(r.startDate), 'err');
      s.activities.push({id:uid('a_'),userId:ME.id,text:'修改了截止日期',ts:Date.now()}); saveDB(); renderApp(); };
    bindDateFieldDisplay($('#drawer-body'));
    $$('#ds-prio .sec-preset').forEach(b=>b.onclick=()=>{
      s.priority = b.dataset.sprio || null;
      s.activities.push({id:uid('a_'), userId:ME.id, text: s.priority?`优先级改为「${prioName(s.priority)}」`:'优先级恢复为继承主任务', ts:Date.now()});
      saveDB(); openSubDrawer(t.id, s.id); renderApp();
    });
    $('#ds-rec').onchange = (e)=>{
      s.recurring = e.target.value || null;
      s.activities.push({id:uid('a_'), userId:ME.id, text: s.recurring?`设置为${REC_NAME[s.recurring]}重复`:'取消了重复', ts:Date.now()});
      saveDB(); toast(s.recurring?`已开启${REC_NAME[s.recurring]}重复：完成后自动生成下一期子任务`:'已取消重复');
    };
    $('#ds-desc').addEventListener('blur', ()=>{
      if($('#ds-desc').value !== (s.desc||'')){ s.desc = $('#ds-desc').value; saveDB(); toast('描述已保存'); }
    });
    const fadd = $('#ds-follower-add');
    if(fadd) fadd.onclick = ()=>{
      const cands = DB.users.filter(u=>u.active && !(s.followers||[]).includes(u.id) && u.id!==s.assigneeId);
      if(!cands.length) return toast('没有可添加的关注人', 'err');
      openPopover(fadd, cands.map(u=>
        `<div class="po-item" data-po="${u.id}"><span class="avatar" style="background:${safeColor(u.color)};width:20px;height:20px;font-size:9px">${esc(u.name.slice(0,1))}</span><b>${esc(u.name)}</b></div>`).join(''),
        (uid2)=>{
          s.followers = s.followers||[]; s.followers.push(uid2);
          const u = DB.users.find(x=>x.id===uid2);
          s.activities.push({id:uid('a_'), userId:ME.id, text:`添加 ${u?u.name:''} 为关注人`, ts:Date.now()});
          notify(uid2, 'subtask_follower', t.id, { subTitle: s.title });
          saveDB(); removePopover(); renderApp(); openSubDrawer(t.id, s.id);
        });
    };
    $$('#drawer-body [data-stag]').forEach(chip=>chip.onclick=()=>{
      const gid = chip.dataset.stag;
      s.tags = s.tags||[];
      const i = s.tags.indexOf(gid);
      if(i>=0) s.tags.splice(i,1); else s.tags.push(gid);
      const g = tagOf(gid);
      s.activities.push({id:uid('a_'), userId:ME.id, text:`${i>=0?'移除':'添加'}标签「${g?g.name:''}」`, ts:Date.now()});
      saveDB(); renderApp(); openSubDrawer(t.id, s.id);
    });
    const tadd = $('#ds-tag-add');
    if(tadd) tadd.onclick = async ()=>{
      const name = await openPromptModal({ title:'新建标签', label:'标签名称', placeholder:'例如：紧急', required:true, emptyTip:'标签名称不能为空', okText:'创建标签' });
      if(!name) return;
      DB.tags = DB.tags||[];
      const exist = findDupName(DB.tags, name);
      if(exist){
        s.tags = s.tags||[]; if(!s.tags.includes(exist.id)) s.tags.push(exist.id);
        saveDB(); renderApp(); openSubDrawer(t.id, s.id); toast('已有同名标签，直接用上了', 'ok'); return;
      }
      const g = { id:uid('g_'), name, color: PROJ_COLORS[Math.floor(Math.random()*PROJ_COLORS.length)] };
      DB.tags.push(g);
      s.tags = s.tags||[]; s.tags.push(g.id);
      saveDB(); renderApp(); openSubDrawer(t.id, s.id);
    };
    // 评论：发送（负责人/创建人/父任务负责人/关注人都会收到通知）
    const sendCmt = ()=>{
      const v = $('#ds-comment').value.trim(); if(!v) return;
      s.comments = s.comments||[];
      s.comments.push({id:uid('cm_'), userId:ME.id, text:v, ts:Date.now()});
      s.activities.push({id:uid('a_'), userId:ME.id, text:'添加了评论', ts:Date.now()});
      saveDB(); openSubDrawer(t.id, s.id); renderApp();
      const watchers = [s.assigneeId, s.createdBy, t.assigneeId, ...(s.followers||[])];
      [...new Set(watchers)].filter(x=>x && x!==ME.id).forEach(uid2 => notify(uid2, 'sub_comment', t.id, { subTitle: s.title, text: v }));
    };
    $('#ds-comment-btn').onclick = sendCmt;
    $('#ds-comment').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); sendCmt(); } });
    // 评论编辑（仅作者）
    $$('#drawer-body [data-scm-edit]').forEach(btn=>btn.onclick=()=>{
      const cm = s.comments.find(x=>x.id===btn.dataset.scmEdit);
      const item = btn.closest('.comment-item');
      if(!cm || !item) return;
      const textEl = $('.c-text', item);
      if(!textEl) return;
      const original = cm.text;
      item.classList.add('editing');
      const area = document.createElement('textarea');
      area.className = 'comment-edit-area';
      area.value = original;
      textEl.replaceWith(area);
      const actions = document.createElement('div');
      actions.className = 'comment-edit-actions';
      actions.innerHTML = `<button class="btn btn-primary btn-sm cm-save">保存</button><button class="btn btn-ghost btn-sm cm-cancel">取消</button>`;
      area.parentNode.insertBefore(actions, area.nextSibling);
      const ac = $('.c-actions', item); if(ac) ac.style.display='none';
      area.focus({preventScroll:true});
      let done = false;
      const finish = (saved)=>{
        if(done) return; done = true;
        const v = area.value.trim();
        if(saved && v && v!==original){
          cm.text = v; cm.editedAt = Date.now();
          s.activities.push({id:uid('a_'), userId:ME.id, text:'修改了评论', ts:Date.now()});
          saveDB();
        }
        openSubDrawer(t.id, s.id);
      };
      $('.cm-save', actions).onclick = ()=>finish(true);
      $('.cm-cancel', actions).onclick = ()=>finish(false);
      area.addEventListener('keydown', e=>{
        if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); finish(true); }
        if(e.key==='Escape'){ e.preventDefault(); finish(false); }
      });
    });
    // 子任务评论删除（作者本人或管理员；撤销可原位恢复）
    $$('#drawer-body [data-scm-del]').forEach(btn=>btn.onclick=()=>{
      const i = s.comments.findIndex(x=>x.id===btn.dataset.scmDel);
      if(i < 0) return;
      openConfirm({
        title:'删除这条评论？', okText:'删除评论', danger:true,
        onOk:()=>{
          const [item] = s.comments.splice(i, 1);
          s.activities.push({id:uid('a_'), userId:ME.id, text:'删除了评论', ts:Date.now()});
          saveDB(); openSubDrawer(t.id, s.id); renderApp();
          toast('评论已删除', 'ok', { label:'撤销', fn:()=>{
            s.comments.splice(Math.min(i, s.comments.length), 0, item);
            saveDB(); openSubDrawer(t.id, s.id); renderApp();
          }});
        }
      });
    });
    // 删除子任务（带撤销）
    $('#ds-del').onclick = ()=>{
      openConfirm({
        title:'删除子任务？',
        html:`删除子任务「${esc(s.title)}」？\n将连同其评论与活动记录一并删除（删除后 6 秒内可撤销）。`,
        okText:'删除子任务', danger:true,
        onOk:()=>{
          const idx = t.subtasks.findIndex(x=>x.id===s.id);
          const [item] = t.subtasks.splice(idx, 1);
          t.activities.push({id:uid('a_'), userId:ME.id, text:`删除子任务「${item.title}」`, ts:Date.now()});
          saveDB(); CURRENT_SUB = null; openDrawer(t.id); renderApp();
          toast('子任务已删除', 'ok', { label:'撤销', fn:()=>{
            t.subtasks.splice(Math.min(idx, t.subtasks.length), 0, item);
            saveDB(); renderApp(); openSubDrawer(t.id, item.id);
          }});
        }
      });
    };
  }
  /* v1.7.5：只有在重绘同一条任务时才保留滚动位置；
     切到另一条任务一律回到顶部，否则会停在上一条的阅读位置 */
  if(drawerBody) drawerBody.scrollTop = wasOpenForSame ? savedScroll : 0;
  _drawerRendered = { id: taskId, sub: subId, epoch: _dataEpoch };   // 渲染去重登记（v1.10）
  /* v1.6：键盘增强必须在 drawer-body 重绘【之后】执行——此前调用发生在
     innerHTML 赋值之前，增强的是上一次打开的旧节点，新抽屉里的控件
     全都没有 tabindex/role，Enter·Space 激活对它们整体失效 */
  /* v1.7.5：活动记录「显示全部 / 收起」开关（key 为 t.id 或 t.id/s.id） */
  $$('#drawer-body [data-act-fold]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const k = b.dataset.actFold;
    if(ACT_EXPANDED.has(k)) ACT_EXPANDED.delete(k); else ACT_EXPANDED.add(k);
    const parts = k.split('/');
    if(parts.length === 2) openSubDrawer(parts[0], parts[1]); else openDrawer(parts[0]);
  });
  enhanceA11y($('#drawer-body'));
}

    <div class="field"><label for="nu-password">初始口令（已随机生成，可改成你方便的）</label>

      </div>
      <div class="pref-hint">不再用「123456」这类共用弱口令：全组同一个初始口令等于没有口令。已排除易混字符 0/O/1/l。</div></div>
    <div class="field"><label for="nu-role">角色</label><select id="nu-role">

    }
    renderApp();
    const cp = await copyText(password);
    toast('已创建账户「' + r.name + '」，初始口令' + (cp ? '已复制到剪贴板，请私下发给本人' : '已在屏幕上，请抄给本人'), 'ok');

  const cp = $('#nu-copy');

  };

}

/* 删除账户：不可逆操作，确认框里必须交代清楚
   ① 他的个人库会被留底成什么文件名、放在哪；② 别人库里指向他的字段怎么办。
   答案是不动别人的数据（跨库改写风险更大），渲染层统一显示为「已注销用户」，
   所以这里只影响被删者本人能否再登录。默认推荐仍是「停用」。 */
function openDeleteUserModal(user){
  if(!P.isAdmin()) return toast('只有管理员可以删除账户', 'err');
  if(user.id === ME.id) return toast('不能删除自己当前登录的账户', 'err');
  const owned = DB.projects.filter(p => p.ownerId === user.id && !p.archived);
  const assigned = DB.tasks.filter(t => t.assigneeId === user.id && !t.completed).length;
  const lines = [
    `<b>${esc(user.name)}</b>（@${esc(user.username)}）将被删除，之后无法用该账号登录。`,
    `他的个人库不会直接删掉，会改名留底到 FlowTask 文件夹：`,
    `<b class="cf-file">deleted_flowtask_data_${esc(user.id)}_日期时间.json</b>`,
  ];
  if(assigned) lines.push(`名下还有 <b>${assigned}</b> 项未完成任务，删除后这些任务会显示为「已注销用户」负责，需要你另行改派。`);
  if(owned.length) lines.push(`他创建了 <b>${owned.length}</b> 个项目（${owned.slice(0,3).map(p=>esc(p.name)).join('、')}${owned.length>3?' 等':''}）；项目本身不会消失，但会失去创建人。`);
  lines.push('只是想临时不让他登录，请用「停用」——随时可以启用回来。');
  openConfirm({
    title:'删除这个账户？',
    html: lines.join('\n\n'),
    okText:'确认删除',
    danger: true,
    onOk: async ()=>{
      const err = await deleteUserAccount(user);
      if(err){ toast(err, 'err'); return false; }
      toast('账户已删除，个人库已留底在 FlowTask 文件夹', 'ok');
      renderApp();
      return true;
    },
    onCancel: ()=>{}
  });
}
async function deleteUserAccount(user){
  if(!SVC_MODE){
    /* 纯浏览器兜底模式：没有服务端可留底，退化成停用并说明原因，避免「删了但数据没了」 */
    user.active = false;
    AUTH.users = AUTH.users.filter(u=>u.id!==user.id);
    DB.users = AUTH.users; saveAuth(); return null;
  }
  try{
    const r = await fetch(STORE_SVC + '/api/delete-user', { method:'POST', cache:'no-store',
      headers: Object.assign({ 'Content-Type':'application/json' }, storeHeaders()),
      body: JSON.stringify({ uid: user.id }) });
    if(r.status === 403) return '只有管理员可以删除账户';
    if(r.status === 401){ expireSession(); return '登录状态已失效，请重新登录'; }
    if(!r.ok){ const j = await r.json().catch(()=>null); return '删除失败：' + ((j&&j.err) || ('存储服务回了 ' + r.status)); }
    await loadAccounts();
    if(ME) DB.users = AUTH.users;
    return null;

/* ============================================================
   v1.9 数据导出 · 界面层
   ------------------------------------------------------------
   三种用途分开走：表格(CSV) 给人看与二次分析、Markdown 贴钉钉/邮件、
   JSON 备份给系统还原用。把它们混成一个是必然选错的设计。
   取数一律走 P.visibleProjects()：成员看不到的项目，也不该被TA导出。
   ============================================================ */
const EXPORT_FMTS = [
  { k:'csv',  label:'表格 CSV（Excel 打开）' },
  { k:'md',   label:'Markdown 摘要（贴钉钉/邮件）' },
  { k:'json', label:'JSON 备份（用于还原）' }
];
const EXPORT_FMT_LABEL = { csv:'表格', md:'Markdown', json:'JSON 备份' };

function exportUserName(id){ if(!id) return ''; const u = DB.users.find(x=>x.id===id); return u ? u.name : '已注销用户'; }
function exportProjName(id){ const p = DB.projects.find(x=>x.id===id); return p ? p.name : '（项目已删除）'; }
function exportVisibleTasks(){ const ids = new Set(P.visibleProjects().map(p=>p.id)); return DB.tasks.filter(t=>ids.has(t.projectId)); }
function exportOnProject(){ return ROUTE.page === 'project' && !!ROUTE.pid && !!P.visibleProject(ROUTE.pid); }
/* 「当前筛选结果」复用列表页同一个 applyFilter —— 所见即所得，不另写一套筛选口径 */
function exportScopeTasks(scope){
  const all = exportVisibleTasks();
  if(scope === 'filtered'){
    const base = exportOnProject() ? all.filter(t=>t.projectId === ROUTE.pid) : all;
    return applyFilter(base);
  }
  if(scope === 'project') return exportOnProject() ? all.filter(t=>t.projectId === ROUTE.pid) : all;
  if(scope === 'mine')    return all.filter(t=>t.assigneeId === ME.id);
  return all;
}
function exportScopeLabel(scope){
  if(scope === 'filtered') return exportOnProject() ? '当前筛选结果' : '全部项目 · 当前筛选';
  if(scope === 'project')  return '项目「' + exportProjName(ROUTE.pid) + '」';
  if(scope === 'mine')     return '我负责的任务';
  return '全部可见项目';
}
function exportScopes(){
  const out = [{ k:'filtered' }];
  if(exportOnProject()) out.push({ k:'project' });
  out.push({ k:'mine' }, { k:'all' });
  return out.map(s => Object.assign(s, { label:exportScopeLabel(s.k), n:exportScopeTasks(s.k).length }));
}
/* 文件名里的项目名要洗掉 Windows/Excel 不接受的字符 */
function exportSafe(s){ return String(s||'').replace(/[\\/:*?"<>|\r\n]/g, '').replace(/\s+/g,' ').trim().slice(0,40); }
function exportFileName(scope, fmt){
  const ext = fmt === 'csv' ? 'csv' : (fmt === 'md' ? 'md' : 'json');
  const mid = scope === 'project' ? '-' + exportSafe(exportProjName(ROUTE.pid))
            : scope === 'mine'    ? '-我负责的'
            : scope === 'filtered'? '-筛选' : '';
  return 'FlowTask-' + todayStr().replace(/-/g,'') + mid + '.' + ext;
}
function exportCtx(){ return { today: todayStr(), projName: exportProjName, userName: exportUserName }; }

/* 把选中的范围/粒度/完成态收敛成一份行集合（CSV 与 Markdown 共用同一口径） */
function exportCollect(cfg){
  let tasks = exportScopeTasks(cfg.scope).slice();
  if(!cfg.includeDone) tasks = tasks.filter(t => !t.completed);
  tasks.sort((a,b) => String(a.dueDate || '9999-99-99').localeCompare(String(b.dueDate || '9999-99-99'))
                  || String(a.title).localeCompare(String(b.title), 'zh'));
  const units = cfg.withSub ? flattenWithSubtasks(tasks) : tasks.map(t => ({ task:t, kind:'任务', parentTitle:'' }));
  return { tasks, units };
}
function exportBuildMD(cfg){
  const ctx = exportCtx();
  const byP = new Map();
  for(const t of exportCollect(cfg).tasks){
    if(!byP.has(t.projectId)) byP.set(t.projectId, []);
    byP.get(t.projectId).push(t);
  }
  const groups = [];
  for(const [pid, list] of byP){
    groups.push({
      name: exportProjName(pid),
      count: list.length,
      overdue: list.filter(t => isTaskOverdue(t, ctx.today)).length,
      rows: list.map(t => mdTaskLine(t, ctx)).concat(cfg.withSub
        ? list.flatMap(t => (t.subtasks||[]).map(s => '    - ' + (s.done?'[x]':'[ ]') + ' ' + plainText(s.title)
            + (s.dueDate ? ' · 截止 ' + s.dueDate + (isTaskOverdue({dueDate:s.dueDate, completed:s.done}, ctx.today) ? '（已逾期）' : '') : '')))
        : [])
    });
  }
  const total = groups.reduce((s,g) => s + g.count, 0);
  return buildExportMarkdown(groups, {
    title:'任务清单 · ' + exportScopeLabel(cfg.scope),
    scopeLabel:'范围：' + exportScopeLabel(cfg.scope),
    by: ME ? ME.name : '', at: fmtStamp(Date.now()), total
  });
}

function downloadText(filename, text, mime){
  try{
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return true;
  }catch(e){ logSoft('下载失败', e); return false; }
}
function doExport(cfg, mask){
  const name = exportFileName(cfg.scope, cfg.fmt);
  if(cfg.fmt === 'json'){
    downloadText(name, JSON.stringify(DB, null, 2), 'application/json;charset=utf-8');
    toast('JSON 备份已导出：' + name, 'ok');
    return;
  }
  if(cfg.fmt === 'md'){
    const md = exportBuildMD(cfg);
    const ok = downloadText(name, md, 'text/markdown;charset=utf-8');
    if(ok) toast('Markdown 已导出，也可直接点「复制 Markdown」贴进钉钉', 'ok');
    else toast('导出失败：浏览器拒绝了文件下载', 'err');
    return ok ? undefined : false;
  }
  if(!cfg.cols.length){ toast('至少勾选一列', 'err'); return false; }
  const { units } = exportCollect(cfg);
  const built = buildExportRows(exportColumnsOf(cfg.cols), units, exportCtx());
  if(built.truncated){
    /* 静默截断是最坏结果：用户会拿着一份少行的表去汇报。宁可拒绝并说明 */
    toast(`这个范围下有 ${built.rows.length} 行，超过单次导出上限 ${EXPORT_MAX_ROWS} 行。请先按项目或状态缩小范围`, 'err');
    return false;
  }
  const ok = downloadText(name, rowsToCSV(built.head, built.rows), 'text/csv;charset=utf-8');
  if(ok) toast(`已导出 ${built.rows.length} 行 · ${exportColumnsOf(cfg.cols).length} 列`, 'ok');
  else toast('导出失败：浏览器拒绝了文件下载', 'err');
  return ok ? undefined : false;
}

    <div class="ex-hint">切到新位置后：本机数据会镜像过去；如果新位置已有比本机更新的数据，按版本号规则处理，
      真冲突时双方都会在共享盘 <b>conflict\\</b> 里留一份底，不会静默丢改动。</div>`;

  const msg = document.getElementById('sc-msg');
  const say = (t, bad) => { if(msg){ msg.innerHTML = esc(String(t)).replace(/\n/g,'<br>'); msg.style.color = bad ? 'var(--red)' : ''; } };
  const save = (patch, okText) => {
    const btn = document.getElementById('sc-save'); if(btn) btn.disabled = true;
    shareCfgPost(patch, (err, res) => {
      if(btn) btn.disabled = false;
      if(err && err.err === 'share unusable'){ say('这个文件夹用不了：' + (err.reason || '未知原因') + '\n（原设置未被改动）', true); return; }
      if(err){ say('保存失败' + (res && res.err ? '：' + res.err : '') + '，本机数据不受影响', true); return; }
      toast(okText, 'ok');
      refreshSyncStatus(); renderShareCard();
    });
  };
  const doSave = () => {
    const nextDir = (document.getElementById('sc-dir').value || '').trim();
    if(!nextDir){
      openConfirm({ title:'停用共享盘同步', html:'之后数据只存在本机，不再镜像到共享盘。', okText:'停用',
        onOk: ()=> save({ syncEnabled:false }, '已停用同步'),
        onCancel: ()=> say('已取消，未做改动') });
      return;
    }
    if(nextDir === (cfg.shareDir || '')){
      // 路径没变，只是想重新校验一次
      save({ shareDir: nextDir }, '已重新校验，同步正常'); return;
    }
    /* 先无副作用地探一次：路径不行就直接说，别让用户确认完才知道白填一场 */
    say('正在检查这个文件夹能不能用…');
    shareCfgPost({ shareDir: nextDir, validateOnly:true }, (err, res) => {
      if(err){
        say('这个文件夹用不了：' + ((res && res.reason) || '未知原因') + '\n（原设置未被改动）', true);
        return;
      }
      /* 探过可用后仍要确认：换路径是有后果的动作（新位置可能有别人的更新） */
      openConfirm({ title:'切换同步文件夹？',
        html:'本机数据将开始镜像到：\n' + esc(nextDir) +
          '\n\n新位置若已有比本机更新的数据，会按版本号规则拉回来；真冲突时双方都会在 conflict\\ 留底。',
        okText:'切换并开始同步',
        onOk: ()=> save({ shareDir: nextDir, syncEnabled:true }, '同步文件夹已更新，并已向新位置镜像一次本机数据'),
        onCancel: ()=> say('已取消，仍使用原文件夹') });
    });
  };
  const sb = document.getElementById('sc-save'); if(sb) sb.onclick = doSave;
  const on = document.getElementById('sc-on');
  if(on) on.onclick = () => save({ shareDir:(document.getElementById('sc-dir').value||'').trim(), syncEnabled:true }, '已启用同步');
  const off = document.getElementById('sc-off');
  if(off) off.onclick = () => openConfirm({ title:'停用共享盘同步？',
    html:'之后数据只存在本机，不再镜像到共享盘；文件夹路径会保留，随时可再启用。',
    okText:'停用', onOk: ()=> save({ syncEnabled:false }, '已停用同步（文件夹路径已保留）'),
    onCancel: ()=> say('已取消，未做改动') });
  const now = document.getElementById('sc-now');
  if(now) now.onclick = () => manualSync();
}

/* 导入数据校验：必备数组 / id 唯一 / 基本类型 */
const IMPORT_LABEL = { users:'成员清单', projects:'项目清单', tasks:'任务清单' };
function validateImportData(data){
  if(!data || typeof data !== 'object' || Array.isArray(data)) return '这个文件不是一份 FlowTask 备份（内容应是一份数据清单）';
  for(const k of ['users','projects','tasks']){
    if(!Array.isArray(data[k])) return `这份备份里缺少「${IMPORT_LABEL[k] || k}」，或它不是预期的列表格式`;
  }
  const seen = new Set();
  for(const label of ['users','projects','tasks']){
    for(const x of data[label]){
      if(!x || typeof x !== 'object') return `${IMPORT_LABEL[label]}里有一条记录内容不完整`;
      if(typeof x.id !== 'string' || !x.id) return `${IMPORT_LABEL[label]}里有一条记录缺少编号，无法安全导入`;
      /* D-5：编号取值域收口——只允许 [A-Za-z0-9_-] 且 ≤64，从源头堵住经导入把 id 撑破属性引号 */
      if(!/^[A-Za-z0-9_-]{1,64}$/.test(x.id)) return `${IMPORT_LABEL[label]}里有一条记录的编号含非法字符，无法安全导入`;
      if(seen.has(x.id)) return `${IMPORT_LABEL[label]}里有两条记录编号相同（${x.id}）`;
      seen.add(x.id);
    }
  }
  /* v1.6 结构深校验：字段缺失的备份以前会一路漏进渲染层把整站搞白屏，
     必须在导入前拦下并告诉用户哪类记录坏了（迁移兜底仍保留，双保险） */
  for(const p of data.projects){
    if(!Array.isArray(p.memberIds)) return `项目「${p.name || p.id}」缺少成员列表，无法安全导入`;
  }
  for(const t of data.tasks){
    for(const k of ['comments','activities','subtasks','tags']){
      if(t[k] !== undefined && !Array.isArray(t[k])) return `任务「${t.title || t.id}」的${k === 'subtasks' ? '子任务' : k === 'comments' ? '评论' : k === 'activities' ? '动态' : '标签'}数据不是列表，无法安全导入`;
    }
  }
  if(!Array.isArray(data.notifications)) data.notifications = [];
  if(!Array.isArray(data.tags)) delete data.tags;           // 交给 migrateData 重建
  /* P0-3 取值域校验：颜色只允许 #RGB / #RRGGBB，mood 走白名单。
     只加严、不改既有判定——字段缺失（undefined / 空串）仍按原样放行。 */
  const badColor = v => typeof v === 'string' && v !== '' && !(/^#[0-9a-fA-F]{3}$/.test(v) || /^#[0-9a-fA-F]{6}$/.test(v));
  for(const u of data.users){
    if(badColor(u.color)) return `成员「${u.name || u.id}」的颜色格式不合法（应为 #RGB 或 #RRGGBB），无法安全导入`;
  }
  for(const p of data.projects){
    if(badColor(p.color)) return `项目「${p.name || p.id}」的颜色格式不合法（应为 #RGB 或 #RRGGBB），无法安全导入`;
    for(const su of (Array.isArray(p.statusUpdates) ? p.statusUpdates : [])){
      if(su && su.mood !== undefined && MOOD_KEYS.indexOf(su.mood) < 0)
        return `项目「${p.name || p.id}」的项目播报心情不在允许范围内，无法安全导入`;
    }
  }
  for(const g of (Array.isArray(data.tags) ? data.tags : [])){
    if(g && badColor(g.color)) return `标签「${g.name || g.id}」的颜色格式不合法（应为 #RGB 或 #RRGGBB），无法安全导入`;
  }
  /* D-5：id / status / priority 取值域收口——从源头堵住「构造备份把数据值拼进属性」的注入面
     （如 data-task="${t.id}"、class="check-circle st-${t.status||'todo'}"、data-sub="${t.id}/${s.id}"）。
     仅当字段存在时校验，缺失/null 一律放行；只加严、不误拒正常备份。 */
  const ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
  const STATUS_OK = ['todo','doing','done'];
  const PRIO_OK = ['high','med','low'];
  const badStatus = v => v !== undefined && v !== null && STATUS_OK.indexOf(v) < 0;
  const badPrio = v => v !== undefined && v !== null && PRIO_OK.indexOf(v) < 0;
  for(const g of (Array.isArray(data.tags) ? data.tags : [])){
    if(g && typeof g.id === 'string' && !ID_RE.test(g.id)) return `标签「${g.name || g.id}」的编号含非法字符，无法安全导入`;
  }
  for(const t of data.tasks){
    if(badStatus(t.status)) return `任务「${t.title || t.id}」的状态不在允许范围内，无法安全导入`;
    if(badPrio(t.priority)) return `任务「${t.title || t.id}」的优先级不在允许范围内，无法安全导入`;
    for(const s of (Array.isArray(t.subtasks) ? t.subtasks : [])){
      if(!s || typeof s !== 'object') continue;
      if(typeof s.id === 'string' && !ID_RE.test(s.id)) return `任务「${t.title || t.id}」的子任务编号含非法字符，无法安全导入`;
      if(badStatus(s.status)) return `任务「${t.title || t.id}」的子任务状态不在允许范围内，无法安全导入`;
      if(badPrio(s.priority)) return `任务「${t.title || t.id}」的子任务优先级不在允许范围内，无法安全导入`;
    }
  }
  return null;
}

function renderTrash(c){
