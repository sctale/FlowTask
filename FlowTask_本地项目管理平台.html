/* ---- 令牌（服务端托管页面时注入；file:// 直开时从 /api/token 获取） ---- */
function svcTokenValid(t){ return !!t && t.length >= 16 && !/^__FLOWTASK/.test(t); }
async function ensureSvcToken(){
  if(svcTokenValid(_svcToken)) return _svcToken;
  if(typeof window.__FT_TOKEN__ === 'string' && svcTokenValid(window.__FT_TOKEN__)){ _svcToken = window.__FT_TOKEN__; return _svcToken; }
  try{
    const r = await fetch(STORE_SVC + '/api/token', { cache:'no-store' });
    if(r.ok){ const j = await r.json(); if(j && j.token){ _svcToken = j.token; return _svcToken; } }
  }catch(e){}
  return '';
}
/* ---- 会话令牌：服务端 HMAC 签发，7 天有效；关浏览器后仍可免登录，过期或被撤销则回到登录页 ---- */
const SESSION_KEY = 'flowtask_session_v2';
function loadSessionLocal(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    return (s && s.session && Number(s.exp) > Date.now()) ? s : null;
  }catch(e){ return null; }
}
function saveSessionLocal(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
function clearSessionLocal(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

function storeHeaders(rev){
  const h = { 'X-FlowTask-Token': _svcToken };
  const s = loadSessionLocal();
  if(s) h['X-FlowTask-Session'] = s.session;
  if(rev != null) h['X-FlowTask-Rev'] = String(rev);
  return h;
}
/* 统一的文件读写入口：file 参数决定读哪个物理文件 */
async function fetchStore(name, method, body, rev, pinned){
  const q = '?file=' + encodeURIComponent(name);
  /* pinned：钉住鉴权头，供"退出登录时冲队列"这类场景使用（见 pushStoreSvc 的说明）。
     不传就按当前会话现取。 */
  const h = pinned ? Object.assign({}, pinned) : storeHeaders(rev);
  if(pinned && rev != null) h['X-FlowTask-Rev'] = String(rev);
  if(body != null) h['Content-Type'] = 'application/json';
  const r = await fetch(STORE_SVC + '/api/db' + q, {
    method, cache:'no-store', headers: h, body: body != null ? body : undefined
  });
  if(r.status === 403 && body == null){          // 令牌过期：重取一次再试
    _svcToken = '';
    const tk = await ensureSvcToken();
    if(tk) return fetchStore(name, method, body, rev, pinned);
  }
  return r;
}
async function readStoreJSON(name){
  const r = await fetchStore(name, 'GET');
  if(r.status === 200){
    try{ return { ok:true, data: JSON.parse(await r.text()) }; }catch(e){ return { ok:false, status:r.status }; }
  }
  if(r.status === 204) return { ok:true, missing:true };
  try{ _svcQuarantined = r.headers.get('X-FlowTask-Quarantined') || _svcQuarantined; }catch(e){}
  return { ok:false, status:r.status };
}

/* 探测本地存储服务是否在线（/api/ping 免鉴权，不受登录状态影响） */
async function probeStoreSvc(){
  try{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 1500);
    const r = await fetch(STORE_SVC + '/api/ping', { signal: ctrl.signal, cache:'no-store' });
    clearTimeout(t);
    SVC_MODE = r.status === 200;
    if(SVC_MODE){ const pj = await r.json().catch(()=>null); if(pj){ _svcVersion = pj.version || '';
      /* null = 老服务没下发这个字段 → 保持可见（向后兼容）；false = 明确关闭 → 收起注册入口 */
      _openRegistration = (pj.openRegistration === true) ? true : (pj.openRegistration === false ? false : null);
    } }
    return SVC_MODE;
  }catch(e){ SVC_MODE = false; return false; }
}
let _svcVersion = '';
let _openRegistration = null;

/* 把两个库中"内容确实变了"的那部分推送到文件服务；409 时才走冲突处理。
   v1.6：把失败原因记到 _lastPushOutcome，调用方据此分因处置（401≠服务挂了） */
let _lastPushOutcome = 'ok';
async function pushStoreSvc(force){
  if(!SVC_MODE) return false;
  if(!ME || !DB) return true;        // 没东西可推 ≠ 服务坏了（例如登出后延迟推送才触发）
  const parts = splitStores();
  let allOk = true, sawConflict = false, sawUnauthorized = false;
  /* 先把两份待写内容与鉴权头**一次性快照**，之后就不再依赖 DB / 会话是否还在：
     防抖窗口内用户点「退出登录」时，logout() 会先 flushAllSaves()（同步进到这里）
     再把会话清掉、把 ME/DB 置空。旧写法在每次 await 之后用 `if(!DB) break` 收手，
     于是第 0 份（个人库）推出去了、第 1 份（团队共享库）整个被丢弃——
     表现就是"我刚改的东西，同事那边怎么也看不到"，而且界面上毫无异常。 */
  const snapHeaders = storeHeaders();
  const jobs = [
    { key:'personal', name: personalFileOf(), obj: parts.personal },
    { key:'shared',   name: SHARED_FILE,      obj: parts.shared   },
  ].map(j => ({ key: j.key, name: j.name, obj: j.obj, text: JSON.stringify(j.obj), headers: snapHeaders }));
  for(const job of jobs){
    const text = job.text;
    if(!force && _wrote[job.key] === text) continue;        // 没变化 → 不写，也就不会撞版本
    const rev = (Number(_revs[job.key]) || 0) + 1;
    job.obj.meta.rev = rev;
    const body = JSON.stringify(job.obj);
    let r;
    /* P1-7：403（令牌过期）重取令牌后重试一次；无论首次还是重试响应，
       都要再统一判 409/401——否则「令牌过期 + 恰逢冲突」会把冲突误记为 down、
       冲突弹窗不弹（重试拿到的响应此前从不复判状态码） */
    try{
      r = await fetchStore(job.name, 'POST', body, rev, job.headers);
      if(r.status === 403){
        _svcToken = '';
        const tk = await ensureSvcToken();
        if(tk){ r = await fetchStore(job.name, 'POST', body, rev, job.headers); }
      }
    }catch(e){ logSoft('pushStoreSvc 推送异常', e); allOk = false; continue; }
    if(r.status === 409){
      sawConflict = true; allOk = false;
      /* 冲突处理要读写 DB；已经退出登录（DB=null）时不硬闯，
         只记下结论——本次内容已按快照送出去了，下一次登录会重新读到最新版本 */
      if(DB) await resolveSvcConflict(job.key, job.name);
      continue;
    }
    if(r.status === 401){ sawUnauthorized = true; allOk = false; continue; }
    if(r && r.ok){
      const j = await r.json().catch(()=>null);
      _revs[job.key] = (j && Number(j.rev)) || rev;
      _wrote[job.key] = text;
      _svcFailNotified = false;
    }else{
      allOk = false;
    }
  }
  _lastPushOutcome = sawUnauthorized ? 'unauthorized' : (sawConflict ? 'conflict' : (allOk ? 'ok' : 'down'));
  if(DB && DB.meta) DB.meta.rev = _revs.personal;             // 兼容既有读法（登出竞态下 DB 可能已为 null）
  return allOk;
}
/* 账户表单独推送（注册/改密码/停用账户时调用）
   写之前先读回服务端最新账户表并按 id 合并：
   任何一个持旧内存快照的页面都不可能把别人的账户整体抹掉。 */
let _lastAuthPushErr = '';        // 最近一次账户表写入失败的服务端原因（给调用方如实回报）
function mergeAuth(fresh, mine){
  const out = { meta: { rev: 0 }, users: [] };
  const seen = new Set();
  (mine.users || []).forEach(u => { if(u && u.id){ out.users.push(u); seen.add(u.id); } });
  (fresh.users || []).forEach(u => { if(u && u.id && !seen.has(u.id)) out.users.push(u); });
  out.users.sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));
  return out;
}
async function pushAuthStore(){
  _lastAuthPushErr = '';
  if(!SVC_MODE || !AUTH){ _lastAuthPushErr = '未连接存储服务，账户变更只留在本机'; return false; }
  const rev = (Number(_revs.auth) || 0) + 1;
  AUTH.meta = AUTH.meta || {};
  AUTH.meta.rev = rev;
  const r = await fetchStore(AUTH_FILE, 'POST', JSON.stringify(AUTH), rev);
  if(r.ok){
    const j = await r.json().catch(()=>null);
    _revs.auth = (j && Number(j.rev)) || rev;
    _wrote.auth = JSON.stringify(AUTH);
    return true;
  }
  if(r.status === 409){
    // 版本落后：读回最新表、合并自己的改动后重试一次，绝不整体覆盖
    const fresh = await readStoreJSON(AUTH_FILE);
    if(fresh.ok && fresh.data){
      const merged = mergeAuth(fresh.data, AUTH);
      merged.meta.rev = (Number(fresh.data.meta && fresh.data.meta.rev) || 0) + 1;
      AUTH = merged;
      _revs.auth = merged.meta.rev - 1;
      const retry = await fetchStore(AUTH_FILE, 'POST', JSON.stringify(merged), merged.meta.rev);
      if(retry.ok){
        const j = await retry.json().catch(()=>null);
        _revs.auth = (j && Number(j.rev)) || merged.meta.rev;
        _wrote.auth = JSON.stringify(merged);
        toast('账户表已与其他页面的改动合并', 'ok');
        return true;
      }
      _lastAuthPushErr = await authErrOf(retry) || '账户表合并后仍未写入成功';
    } else _lastAuthPushErr = '账户表版本落后，且读最新版本失败';
    await loadAccounts();
    toast('账户表刚被其他页面改过，已重新载入最新一份', 'err');
    return false;
  }
  /* 其余失败（403 守卫拒绝 / 500 写盘失败 / 网络异常）必须把服务端给的原因带出来：
     否则调用方只能报「已创建账户」，把根本没落盘的事盖掉 */
  _lastAuthPushErr = await authErrOf(r);
  return false;
}
/* 从响应里取服务端写的失败原因（拿不到就给状态码，至少不是空白） */
async function authErrOf(r){
  if(!r) return '存储服务没有响应';
  const j = await r.json().catch(()=>null);
  return (j && (j.err || j.detail)) ? String(j.err || j.detail) : ('存储服务回了 ' + r.status);
}

function fmtClock(ts){

/* 差异摘要：数一数"我的版本"相对"服务端版本"有多少处不同 */
function summarizeDBDiff(local, remote){
  const lines = [];
  const rTasks = new Map((remote.tasks||[]).map(t=>[t.id, t]));
  const lTasks = new Map((local.tasks||[]).map(t=>[t.id, t]));
  let changed = 0;
  const FIELDS = ['title','status','assigneeId','dueDate','startDate','priority','desc'];
  lTasks.forEach((t, id)=>{
    const r = rTasks.get(id);
    if(!r){ changed++; lines.push(`我新建的任务「${t.title}」在对方版本里不存在`); return; }
    const diff = FIELDS.filter(k => String(t[k] == null ? '' : t[k]) !== String(r[k] == null ? '' : r[k]));
    if(diff.length){ changed++; lines.push(`「${t.title}」的 ${diff.join('、')} 与对方版本不同`); }
  });
  rTasks.forEach((t, id)=>{ if(!lTasks.has(id)) lines.push(`对方新增的任务「${t.title}」我这边没有`); });
  const rp = new Set((remote.projects||[]).map(p=>p.id));
  (local.projects||[]).forEach(p=>{ if(!rp.has(p.id)){ changed++; lines.push(`我新建的项目「${p.name}」在对方版本里不存在`); } });
  return { changed, lines: lines.slice(0, 4), more: Math.max(0, lines.length - 4) };
}

/* 版本冲突：先留底 → 采用服务端版本 → 登记副本 → 弹窗让用户决定是否改回自己的版本
 * key = 'personal' | 'shared'：只有出问题的那个库会被重读与合并，另一个库不受影响 */
async function resolveSvcConflict(key, fileName){
  key = key || 'personal';
  fileName = fileName || (key === 'shared' ? SHARED_FILE : personalFileOf());
  const label = key === 'shared' ? '团队共享库' : '你的个人库';
  const parts = splitStores();
  const local = parts[key];
  const localRev = Number(local.meta && local.meta.rev) || 0;
  let copyFile = '';
  try{
    const cr = await fetch(STORE_SVC + '/api/db-conflict?file=' + encodeURIComponent(fileName), {
      method:'POST', headers: storeHeaders(), body: JSON.stringify(local)
    });
    if(cr.ok){ const cj = await cr.json(); copyFile = (cj && cj.file) || ''; }
  }catch(e){ logSoft('冲突留底失败', e); }
  const r = await readStoreJSON(fileName);
  if(!r.ok || !r.data) return;
  const remote = r.data;
  const diff = summarizeDBDiff(local, remote);
  const remoteRev = Number(remote.meta && remote.meta.rev) || 0;
  parts[key] = remote;
  _bcSuppress = true;
  mergeStores(parts.personal, parts.shared);
  writeLocalDB();
  _bcSuppress = false;
  if(ME) renderApp();
  const info = { ts:Date.now(), file:copyFile, store:label, localRev, remoteRev, changed:diff.changed };
  registerConflictCopy(info);
  openConflictModal(key, fileName, local, info, diff);
}
/* 冲突对话框：说明发生了什么 + 差异摘要 + 三个可行动作（副本不再"失踪"） */
function openConflictModal(key, fileName, localSnapshot, info, diff){
  const label = info.store || '你的个人库';
  const mask = openModal('检测到数据冲突', `
    <p class="cf-lead"><b>${label}</b>出现了两个不同版本：就在刚才，另一个标签页或另一位同事保存了更新的数据。为避免互相覆盖，页面已<b>先显示对方的版本</b>；你刚才的改动没有丢，已完整留底。</p>
    <div class="cf-meta">
      <div><span>发生位置</span><b>${label}（${esc(fileName)}）</b></div>
      <div><span>当前显示</span><b>第 ${info.remoteRev} 版（对方）</b></div>
      <div><span>你的版本</span><b>第 ${info.localRev} 版 · ${info.changed || 0} 处不同</b></div>

function downloadJSON(filename, obj){
  try{
    const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }catch(e){ toast('下载失败，请在数据管理页重试', 'err'); }
}
/* 复制文本：Clipboard API 优先，失败回退 execCommand（file:// 直开与旧浏览器也可用） */
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove(); return !!ok;
  }catch(e){ return false; }
}

/* ---------- 合并视图 ⇄ 物理文件：按项目的 scope 归属 ---------- */
/*==TEST-BEGIN==*/
function projectScopeOf(p){ return (p && p.scope === SCOPE_SHARED) ? SCOPE_SHARED : 'personal'; }
function splitStores(){
  const ts = Number(DB.meta && DB.meta.lastSaved) || 0;   // 时间戳要随库落盘，否则服务端文件永远比本地"旧"
  const P = emptyStore({ tags: DB.tags || [], savedFilters: DB.savedFilters || [], meta:{ rev: Number(_revs.personal) || 0, lastSaved: ts } });
  const S = emptyStore({ meta:{ rev: Number(_revs.shared) || 0, lastSaved: ts } });
  (DB.projects || []).forEach(p => (projectScopeOf(p) === SCOPE_SHARED ? S : P).projects.push(p));
  /* 归属判断必须同时看 DB.projects 和回收站：项目被删后就不在 projects 里了，
     若只查 projects，回收站里共享项目的任务会被误判成个人任务，
     拆库时整批搬进删除者的个人库并从共享库消失（v1.6 修复） */
  const scopeOf = pid => {
    const p = (DB.projects || []).find(x => x.id === pid)
           || ((DB.trash && DB.trash.projects) || []).find(x => x.id === pid);
    return projectScopeOf(p);
  };
  const bucketOf = pid => scopeOf(pid) === SCOPE_SHARED ? S : P;
  (DB.tasks || []).forEach(t => bucketOf(t.projectId).tasks.push(t));
  (DB.notifications || []).forEach(n => (n && n.projectId ? bucketOf(n.projectId) : P).notifications.push(n));
  if(DB.trash){
    (DB.trash.tasks || []).forEach(t => bucketOf(t.projectId).trash.tasks.push(t));
    (DB.trash.projects || []).forEach(p => (projectScopeOf(p) === SCOPE_SHARED ? S : P).trash.projects.push(p));
  }
  return { personal: P, shared: S };
}
function mergeStores(P, S){
  const users = (AUTH && AUTH.users) || [];
  DB = {
    meta: { rev: Number(P && P.meta && P.meta.rev) || 0, lastSaved: Date.now() },
    users,
    projects: [].concat((P && P.projects) || [], (S && S.projects) || []),
    tasks: [].concat((P && P.tasks) || [], (S && S.tasks) || []),
    notifications: [].concat((P && P.notifications) || [], (S && S.notifications) || []),
    trash: {
      tasks: [].concat((P && P.trash && P.trash.tasks) || [], (S && S.trash && S.trash.tasks) || []),
      projects: [].concat((P && P.trash && P.trash.projects) || [], (S && S.trash && S.trash.projects) || []),
    },
    tags: (P && P.tags) || [],
    savedFilters: (P && P.savedFilters) || [],
  };
  _revs.personal = Number(P && P.meta && P.meta.rev) || 0;
  _revs.shared   = Number(S && S.meta && S.meta.rev) || 0;
  bumpDataEpoch();
  /* 以加载时的内容作为"已写盘基线"：之后只有真正改动的半个库才会被推送 */
  const base = splitStores();
  _wrote.personal = JSON.stringify(base.personal);
  _wrote.shared   = JSON.stringify(base.shared);
  return DB;
}
/*==TEST-END==*/
/* 登录后拉取本人的两个库（服务端按会话定位个人库文件，前端无法读别人的） */
async function loadMyStores(){
  const pf = personalFileOf();
  /* 两个库并行拉取：串行 await 会让登录后的加载窗口翻倍（v1.6 修复） */
  const [rp, rs] = await Promise.all([readStoreJSON(pf), readStoreJSON(SHARED_FILE)]);
  if(rp.status === 401 || rs.status === 401){
    clearSessionLocal();
    toast('登录状态已失效，请重新登录', 'err');
    ME = null; DB = null;
    _syncInfo = null; _syncSavedAt = 0; updateSyncStatus();    // 离开应用就收掉顶栏的同步指示
    $('#app').classList.remove('on');
    showAuthPage();
    return { personalMissing: true, sharedMissing: true, authExpired: true };
  }
  /* v1.6：读取失败（5xx：文件被占用/无权限）≠ 文件不存在。
     静默换空库正是「数据凭空消失」的来源——此时应保持现状并中止加载 */
  if(rp.ok === false || rs.ok === false){
    const bad = rp.ok === false ? '个人库' : '共享库';
    toast(bad + '暂时读不到（可能被其它程序占用）。已中止加载以保护数据，请稍后刷新重试', 'err');
    return { loadFailed: true };
  }
  const P = (rp.ok && rp.data) ? rp.data : emptyStore();
  const S = (rs.ok && rs.data) ? rs.data : emptyStore();
  if(rp.ok && !rp.data) P.meta.rev = 0;
  _loadingStores = true;
  try{
    migrateData(P); migrateData(S);
    mergeStores(P, S);
  }finally{
    _loadingStores = false;
  }
  if(_storesDirty){ _storesDirty = false; saveDB(); }   // 迁移改过数据 → 合并后再推送一次
  return { personalMissing: !!(rp.ok && rp.missing), sharedMissing: !!(rs.ok && rs.missing) };
}

/* 拉取某个库（仅当服务端版本更新时采用）——多标签页同步与恢复共用 */
async function pullStore(key, notifyOk){
  const name = key === 'shared' ? SHARED_FILE : personalFileOf();
  const r = await readStoreJSON(name);
  if(!r.ok || !r.data) return false;
  const remoteRev = Number(r.data.meta && r.data.meta.rev) || 0;
  if(remoteRev <= (Number(_revs[key]) || 0)) return false;
  const parts = splitStores();
  parts[key] = r.data;
  _bcSuppress = true;
  mergeStores(parts.personal, parts.shared);
  // mergeStores 会把基线重置为"刚拉下来的内容"，避免立刻又推一遍
  writeLocalDB();
  _bcSuppress = false;
  if(ME) renderApp();
  if(notifyOk) toast(key === 'shared' ? '团队共享库已在别处更新，本页已同步' : '你的数据已在另一个标签页更新，本页已同步', 'ok');
  return true;
}
/* 服务掉线标记与 30 秒健康探测（修复指示失真：失败立即转"浏览器存储"） */
function svcMarkDown(){
  if(SVC_MODE){
    SVC_MODE = false;
    if(!_svcFailNotified){ _svcFailNotified = true; toast('文件存储服务未响应，数据已暂存浏览器缓存，将自动尝试重连', 'err'); }
  }
  updateStoreStatus();
  startSvcHealthCheck();
}
function startSvcHealthCheck(){
  if(_svcHealthTimer) return;
  _svcHealthTimer = setInterval(async ()=>{
    const online = await probeStoreSvc();
    if(!online) return;                          // 还没恢复，继续等下一轮
    clearInterval(_svcHealthTimer); _svcHealthTimer = null;
    _svcFailNotified = false;
    _svcToken = '';
    await ensureSvcToken();
    await loadAccounts();
    if(ME && DB){
      /* v1.6：远端版本更新时不再静默整片替换——掉线期间的本地编辑
         必须走「留底 + 冲突弹窗 + 用户决策」，与 409 路径同一套处理 */
      for(const key of ['personal', 'shared']){
        const name = key === 'shared' ? SHARED_FILE : personalFileOf();
        const r = await readStoreJSON(name);
        if(!r.ok) continue;                      // 服务半恢复：读不到就先不动本地数据
        const rev = r.data ? (Number(r.data.meta && r.data.meta.rev) || 0) : 0;
        if(rev > (Number(_revs[key]) || 0)) await resolveSvcConflict(key, name);
      }
      await pushStoreSvc();
      if(ME) renderApp();
    }
    updateStoreStatus();
    toast('文件存储服务已恢复，数据已同步', 'ok');
  }, 30000);
}

/* ---------- v1.9 共享盘同步：顶栏状态、立即同步、远端更新自动采纳 ---------- */
let _syncInfo = null;              // 最近一次 /api/sync 回报；null = 还没问到
let _syncWatchTimer = null;
let _syncSavedAt = 0;              // 本机最近一次保存成功的时刻（用于「同步中」的过渡态）
const SYNC_WATCH_MS = 30000;
const SYNC_SETTLE_MS = 9000;       // 服务端去抖 3s + 共享盘往返余量

/* 纯函数：把服务端同步状态翻译成顶栏那一小段文字 + 提示 + 配色（单测直接打这里）
   awaiting = 本机刚保存过、服务端还没回报这之后的同步完成 —— PowerShell 版不回报排队数，
   只靠 info.pending 会让用户在最多 30 秒里看不到任何反应，误以为必须手动点。 */
/*==TEST-BEGIN==*/
function syncStatusView(info, awaiting){
  if(!info || info.enabled !== true) return null;                 // 没配共享盘 → 顶栏不出现这个按钮
  const when = (info.lastSyncAt && typeof fmtClock === 'function') ? fmtClock(info.lastSyncAt) : '';
  /* 配置本身有问题（路径打不开 / 没有写权限）与「共享盘临时掉线」是两回事：
     前者重连不会好，必须让人去改配置，所以文案要分开说 */
  if(info.blockReason){
    return { txt:'共享盘打不开', cls:'err',
      tip:'共享盘同步已配置但用不了，本机数据仍在正常保存。\n原因：' + info.blockReason + '\n请检查路径（需先在资源管理器里能打开该共享）与写入权限，改完重启服务。点击可重新探测' };
  }
  if(info.reachable === false){
    return { txt:'共享盘断开', cls:'err',
      tip:'本机数据仍在正常保存，只是暂时同步不到共享盘。' + (info.lastError ? '\n最近一次原因：' + info.lastError : '') + '\n点击可立即重试' };
  }
  if(awaiting || info.pending){
    return { txt:'同步中' + (info.pending ? ' ' + info.pending + ' 项' : '…'), cls:'saving',
      tip:'本机刚保存的数据正在镜像到共享盘，不用点它——点一下也可以立刻催一次' };
  }
  return { txt:'☁ 已同步' + (when ? ' ' + when : ''), cls:'ok',
    tip:'本机数据已镜像到共享盘。换任何电脑用同一账号登录，资料都会跟着回来。\n点击可立即同步' };
}
/*==TEST-END==*/
/* 本机是否还在「等这次保存被镜像出去」的窗口里：
   服务端回报的 lastSyncAt 已经晚于本次保存，就说明同步完成了，过渡态该收 */
function syncAwaiting(){
  if(!_syncSavedAt) return false;
  if((_syncInfo && _syncInfo.lastSyncAt || 0) >= _syncSavedAt) return false;
  return Date.now() < _syncSavedAt + SYNC_SETTLE_MS;
}
/* 共享盘配置卡的状态文案（纯函数，单测覆盖）。
   「未启用 / 打不开 / 已连通」三种必须分得开：未启用是用户的选择，
   打不开是配置有问题，混在一起人就不知道该不该去找 IT */
/*==TEST-BEGIN==*/
function shareConfigView(cfg, status){
  if(!cfg || cfg.syncEnabled !== true){
    return { txt:'未启用', cls:'', tip:'数据只存在本机。填一个你有权读写的共享目录并保存，就会开始镜像。' };
  }
  if(cfg.envOverride){
    return { txt:'由环境变量指定', cls:'saving',
      tip:'当前同步路径来自环境变量 FLOWTASK_SHARE_DIR，它的优先级高于配置文件：这里改完立即生效，但重启后会被环境变量顶回。要长期改请清掉那个环境变量。' };
  }
  if(status && status.blockReason){
    return { txt:'打不开', cls:'err', tip:'本机数据仍在正常保存，只是同步不出去。\n' + status.blockReason };
  }
  if(status && status.reachable === false){
    return { txt:'暂时连不上', cls:'err', tip:'共享盘这会儿连不上（网络或权限）。本机数据不受影响，恢复后会自动续传。' };
  }
  return { txt:'● 已连通', cls:'ok', tip:(status && status.lastSyncAt) ? '最近一次同步 ' + new Date(status.lastSyncAt).toLocaleString('zh-CN') : '已连通，等待第一次同步' };
}
/* 初始口令生成：不用字典词、不带易混字符（0/O、1/l），管理员建号时用，避免全组共用「123456」 */
function genInitialPassword(){
  const sets = ['ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnopqrstuvwxyz', '23456789', '!@#$%-_=+'];
  const pick = s => s.charAt(Math.floor(Math.random() * s.length));
  const out = sets.map(pick);
  const all = sets.join('');
  while(out.length < 10) out.push(pick(all));
  for(let i = out.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = out[i]; out[i] = out[j]; out[j] = t; }
  return out.join('');
}
/* 新建任务的落位：排到「同项目 + 同状态」组的末尾。
   原来直接取 Date.now()，同一毫秒建的两条任务 order 完全相同，
   于是键盘排序交换相等值 = 什么都没发生（用户只会觉得功能坏了）。 */
function nextTaskOrder(tasks, projectId, status, fallback){
  const peers = (tasks || []).filter(t => t.projectId === projectId && t.status === status);
  if(!peers.length) return fallback;
  return Math.max(fallback, ...peers.map(t => Number(t.order) || 0)) + 1;
}
/*==TEST-END==*/
function updateSyncStatus(){
  const el = document.getElementById('sync-status');
  if(!el) return;
  const v = syncStatusView(_syncInfo, syncAwaiting());
  if(!v){ el.hidden = true; return; }
  el.hidden = false;
  el.textContent = v.txt;
  el.title = v.tip;
  el.classList.toggle('ok', v.cls === 'ok');
  el.classList.toggle('saving', v.cls === 'saving');
  el.classList.toggle('err', v.cls === 'err');
}
/* 保存成功后调用：立刻转「同步中」，并在服务端去抖窗口过后自动刷新，
   不再让用户等 30 秒的轮询、也不再让他以为「必须点一下才同步」 */
function markLocalSavedForSync(){
  if(!_syncInfo || _syncInfo.enabled !== true) return;
  _syncSavedAt = Date.now();
  updateSyncStatus();
  setTimeout(refreshSyncStatus, 3600);
  setTimeout(refreshSyncStatus, SYNC_SETTLE_MS + 600);
}
async function refreshSyncStatus(){
  if(!SVC_MODE || !ME){ _syncInfo = null; _syncSavedAt = 0; updateSyncStatus(); return; }
  try{
    const r = await fetch(STORE_SVC + '/api/sync', { cache:'no-store', headers: storeHeaders() });
    if(r.status === 401){ _syncInfo = null; _syncSavedAt = 0; updateSyncStatus(); return; }      // 未登录/会话过期：不显示
    if(!r.ok){ return; }                                                        // 读不到就保留上一次显示，别乱跳
    const j = await r.json().catch(()=>null);
    _syncInfo = (j && j.status) ? Object.assign({ enabled: j.enabled === true }, j.status) : null;
    /* 服务端确认这次保存已经镜像出去 → 过渡态立刻收掉，不用干等到下一个刷新点 */
    if(_syncInfo && _syncInfo.enabled === true && _syncSavedAt && (_syncInfo.lastSyncAt || 0) >= _syncSavedAt) _syncSavedAt = 0;
    updateSyncStatus();
  }catch(e){ logSoft('查询同步状态失败', e); }
}
/* 服务端在登录后可能已经把共享盘的更新覆盖到本机文件上：
   版本号比本页已知的高，就把这份重新读进来，别让页面继续显示旧数据。 */
async function adoptRemoteIfNewer(){
  for(const key of ['personal', 'shared']){
    const name = key === 'shared' ? SHARED_FILE : personalFileOf();
    const r = await readStoreJSON(name);
    if(!r.ok || !r.data) continue;
    const rev = Number(r.data.meta && r.data.meta.rev) || 0;
    if(rev > (Number(_revs[key]) || 0)) await pullStore(key, true);
  }
}
async function manualSync(){
  if(!SVC_MODE || !ME){ toast('请先登录后再同步', 'err'); return; }
  const el = document.getElementById('sync-status');
  const old = el ? el.textContent : '';
  if(el){ el.textContent = '同步中…'; el.classList.add('saving'); }
  let res = null;
  try{
    const r = await fetch(STORE_SVC + '/api/sync', {
      method:'POST', headers: Object.assign({ 'Content-Type':'application/json' }, storeHeaders()),
      body: JSON.stringify({ mode:'auto' })
    });
    if(!r.ok){ toast('同步请求失败（' + r.status + '）', 'err'); }
    else res = await r.json().catch(()=>null);
  }catch(e){ toast('共享盘同步未响应，本机数据不受影响', 'err'); }
  if(res && res.ok){
    const acts = (res.results || []).map(x => x.action);
    const nPull  = acts.filter(a => a === 'pull').length;
    const nPush  = acts.filter(a => a === 'push').length;
    const nCf    = acts.filter(a => /conflict|invalid/.test(a)).length;
    if(Array.isArray(res.changedLocal) && res.changedLocal.length) await adoptRemoteIfNewer();
    await refreshSyncStatus();
    if(nCf) toast('有 ' + nCf + ' 份数据出现版本冲突：双方都已留底，页面显示时间更晚的那一份', 'err');
    else if(nPull || nPush) toast('共享盘同步完成：推上去 ' + nPush + ' 项，拉回来 ' + nPull + ' 项', 'ok');
    else toast('已是最新，无需同步', 'ok');
  }else{
    await refreshSyncStatus();
    if(el) el.textContent = old;
  }
}
function startSyncWatch(){
  if(_syncWatchTimer) return;
  _syncWatchTimer = setInterval(async ()=>{
    if(!ME || !SVC_MODE) return;
    await refreshSyncStatus();
    if(_syncInfo && _syncInfo.enabled === true) await adoptRemoteIfNewer();   // 别的电脑推上来的更新，这里跟进
  }, SYNC_WATCH_MS);
}

/* 多标签页同步：任何一页保存后广播两个库的版本号，其余页面按需拉新 */
try{
  if('BroadcastChannel' in window){
    _bc = new BroadcastChannel('flowtask_sync');
    _bc.onmessage = (ev)=>{
      const d = ev && ev.data;
      if(!d || !DB || !SVC_MODE || !ME) return;
      if(d.uid && d.uid !== ME.id) return;                   // 别的账户的广播与本页无关
      if(Number(d.personal) > (Number(_revs.personal) || 0)) pullStore('personal', true);
      if(Number(d.shared)   > (Number(_revs.shared)   || 0)) pullStore('shared', true);
    };
  }
}catch(e){ logSoft('多标签页同步通道初始化失败', e); }
function broadcastRev(){
  if(_bc && !_bcSuppress){
    try{ _bc.postMessage({ uid: ME ? ME.id : null, personal: Number(_revs.personal) || 0, shared: Number(_revs.shared) || 0 }); }catch(e){ logSoft('广播版本号失败', e); }
  }
}
/* 页面回到前台时轻量核对版本号 */

/* 本地写盘：连续改动合并为一次序列化；页面隐藏/关闭前强制落盘，避免丢数据 */
let _localSaveTimer = null;
function writeLocalDB(){
  if(!DB) return false;
  try{ localStorage.setItem(DB_KEY, JSON.stringify({ uid: ME ? ME.id : null, db: DB })); return true; }
  catch(e){ toast('数据保存失败：本地存储空间不足', 'err'); return false; }
}
function flushLocalDB(){ if(_localSaveTimer){ clearTimeout(_localSaveTimer); _localSaveTimer = null; } return writeLocalDB(); }
function scheduleLocalSave(){
  if(_localSaveTimer) return;
  _localSaveTimer = setTimeout(()=>{ _localSaveTimer = null; writeLocalDB(); }, 250);
}
/* 关页/切后台：本地与待推送都要冲掉，否则 400ms 防抖窗口内的最后一次编辑会丢 */
function flushAllSaves(){
  flushLocalDB();
  if(_svcSaveTimer){ clearTimeout(_svcSaveTimer); _svcSaveTimer = null; pushStoreSvc(); }
}
window.addEventListener('pagehide', flushAllSaves);
window.addEventListener('beforeunload', flushAllSaves);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') flushAllSaves(); });

/* 浏览器兜底模式（未启动存储服务）：按账户各自留一份本地缓存 */
function loadLocalFor(uidVal){
  try{
    const raw = JSON.parse(localStorage.getItem(DB_KEY) || 'null');
    if(raw && raw.uid === uidVal && raw.db){ DB = raw.db; return true; }
  }catch(e){ console.warn('本地数据解析失败', e); }
  return false;
}
function loadDB(){
  try{
    const raw = JSON.parse(localStorage.getItem(DB_KEY) || 'null');
    if(raw && raw.db) return raw;            // {uid, db}
    if(raw && raw.tasks) return { uid:null, db: raw };   // 旧格式（v1.4 之前直接存 DB）
  }catch(e){ console.warn('DB 解析失败', e); }
  return null;
}
let _loadingStores = false, _storesDirty = false;
function saveDB(){
  if(!DB) return;
  if(_loadingStores){ _storesDirty = true; return; }   // 加载期间只记脏，等合并完再统一落盘
  try{
    DB.meta = DB.meta || {};
    DB.meta.lastSaved = Date.now();
    DB.meta.rev = Number(_revs.personal) || 0;      // 对外仍暴露个人库版本号
    bumpDataEpoch();                                 // 让渲染索引失效（v1.5 起 rev 不再自增）
    if(Array.isArray(DB.tasks)){   // 活动记录截断：每任务最多保留最近 200 条
      DB.tasks.forEach(t=>{ if(t.activities && t.activities.length > 200) t.activities = t.activities.slice(-200); });
    }
    /* 通知截断（v1.10）：通知页只显示最近 80 条，存储端却无上限累积——
       团队共享库场景下评论/指派通知全员增长，最终撑爆 localStorage 配额、
       让所有保存都失败。与 activities 同一策略：只保留最近 500 条。 */
    if(Array.isArray(DB.notifications) && DB.notifications.length > 500){
      DB.notifications = DB.notifications.slice(-500);
    }
    scheduleLocalSave();   // 始终写本地缓存兜底（合并 250ms 内的连续改动）
  }catch(e){ toast('数据保存失败：本地存储空间不足', 'err'); }
  broadcastRev();
  if(SVC_MODE){
    _saveState = 'saving'; updateStoreStatus();
    clearTimeout(_svcSaveTimer);
    _svcSaveTimer = setTimeout(async ()=>{
      _svcSaveTimer = null;
      if(!ME || !DB) return;                       // 已登出：这次推送作废，不据此判定服务状态
      const ok = await pushStoreSvc();
      /* v1.6：失败要分因处置。401=会话过期（该重新登录）；409=真冲突（冲突弹窗已介入，
         不能当成服务挂了）；只有网络层失败/其它错误才降级为浏览器缓存模式 */
      if(_lastPushOutcome === 'unauthorized'){ expireSession(); return; }
      if(!ok){
        if(_lastPushOutcome === 'conflict'){ setSaveState('error'); return; }
        svcMarkDown();
      }else{ setSaveState('saved'); markLocalSavedForSync(); }
    }, 400);
  }else{
    _saveState = 'local'; updateStoreStatus();
  }
}
/* 账户表改动（注册 / 改密码 / 停用）：与数据库分开记账。
   v1.6：接入顶栏保存状态（此前账户写盘成功失败都无声）；账户表读取失败时拒绝写回，
   防止一张空表以更高版本号顶掉真实账户。
   v1.10：返回 Promise<{ok,err}>——建号/删号这类「说了要成功」的动作必须等写入确认，
   拿不到确认就把服务端给的原因回给调用方，不能再让界面自己宣布成功。 */
function saveAuth(){
  if(!AUTH) return Promise.resolve({ ok:false, err:'账户表还没就绪，请稍后重试' });
  if(SVC_MODE && !_authHealthy){
    console.warn('账户表不可读，本次变更不写回');
    return Promise.resolve({ ok:false, err:'账户表暂时读不到，本次改动没有写入（防止把真实账户表顶掉），请刷新页面后重试' });
  }
  AUTH.meta = AUTH.meta || {};
  AUTH.meta.lastSaved = Date.now();
  try{ localStorage.setItem(AUTH_KEY, JSON.stringify(AUTH)); }catch(e){}
  if(!SVC_MODE) return Promise.resolve({ ok:true, local:true });   // 纯浏览器模式：本机缓存就是最终结果
  setSaveState('saving');
  return pushAuthStore().then(ok => {
    if(ok){ _lastSavedAt = Date.now(); setSaveState('saved'); markLocalSavedForSync(); return { ok:true }; }   // 账户表变更同样要镜像
    const err = _lastAuthPushErr || '账户变更没有保存成功（存储服务未确认写入）';
    if(SVC_MODE){ toast(err, 'err'); setSaveState('error'); }
    return { ok:false, err };
  });
}
/* 账户表改动的统一收尾（改角色 / 停用 / 启用）：写入确认了才宣布成功，
   没确认就把这一处改动回滚掉并如实报错——界面上不能出现「已停用」其实没存盘。 */
async function commitAuthChange(undo, okMsg){
  const w = await saveAuth();
  if(!w.ok && undo){ try{ undo(); }catch(e){} }
  renderApp();
  toast(w.ok ? okMsg : ('没有改成：' + (w.err || '存储服务未确认写入')), w.ok ? 'ok' : 'err');
  return w.ok;
}
/* 顶栏存储状态指示（四态：保存中 / 已保存·时间 / 文件存储 / 仅浏览器缓存） */
function updateStoreStatus(){
  const el = document.getElementById('store-status');
  if(el){
    let txt, tip, cls = '';
    if(!SVC_MODE){
      txt = _svcFailNotified ? '保存失败 · 重连中' : '仅浏览器缓存';
      tip = '未检测到本地文件存储服务（或保存失败已自动切换），数据暂存浏览器缓存，启动服务后点这里可迁移到文件。请双击「启动存储服务.bat」（点击重新检测）';
      cls = '';
    }else if(_saveState === 'saving'){
      txt = '保存中…'; tip = '正在把最新数据写入本机的个人库 / 共享库文件'; cls = 'saving';
    }else if(_saveState === 'saved'){
      txt = '已保存 ' + fmtClock(_lastSavedAt);
      tip = '数据已写入你的个人库文件（账户表 / 个人库 / 共享库分开存，带冲突保护与每 10 分钟自动备份；点击可重新检测）'; cls = 'ok';
    }else if(_saveState === 'error'){
      txt = '保存失败 · 点此重试';
      tip = '最近一次写入没有得到存储服务确认（磁盘被占用或服务异常）。数据仍在页面上，点击这里重新检测并重试'; cls = '';
    }else{
      txt = '文件存储';
      tip = '数据实时保存到本机的个人库与共享库文件（带冲突保护与自动备份，点击可重新检测）'; cls = 'ok';
    }
    el.textContent = txt;
    el.title = tip;
    el.classList.toggle('ok', cls === 'ok');
    el.classList.toggle('saving', cls === 'saving');
  }
  const foot = document.getElementById('side-foot');
  if(foot){
    foot.innerHTML = SVC_MODE
      ? '数据保存到本机 JSON 文件' + (_lastSavedAt ? `<br>最近保存 ${fmtClock(_lastSavedAt)}` : '')
      : '数据仅存于浏览器缓存<br>请双击「启动存储服务.bat」开启文件存储';
  }
}
/* 手动重试：重新探测；服务可用时按版本号决定采用方向 */
async function retryStoreSvc(){
  const prev = SVC_MODE;
  await probeStoreSvc();
  if(SVC_MODE && !prev){
    await ensureSvcToken();
    await loadAccounts();
    if(ME){
      const localSnapshot = DB ? JSON.parse(JSON.stringify(DB)) : null;   // 浏览器阶段建的数据
      const loaded = await loadMyStores();
      if(loaded.loadFailed) return;                        // 文件读不到：保持现状，不覆盖不重绘
      if(loaded.personalMissing && localSnapshot && (localSnapshot.projects || []).length){
        DB.projects = localSnapshot.projects; DB.tasks = localSnapshot.tasks;
        DB.notifications = localSnapshot.notifications || [];
        DB.tags = localSnapshot.tags || DB.tags;
        DB.trash = localSnapshot.trash || DB.trash;
        DB.savedFilters = localSnapshot.savedFilters || DB.savedFilters;
        saveDB();
        toast('已连接文件存储，浏览器里的数据已存入你的个人库文件', 'ok');
      }else{
        toast('已连接文件存储，已载入文件中的数据', 'ok');
      }
      renderApp();
    }else{
      toast('已连接文件存储，请在左侧登录后开始使用', 'ok');
    }
    if(_svcQuarantined) toast('检测到损坏文件已自动隔离：' + _svcQuarantined, 'err');
  }else if(SVC_MODE && prev){
    toast('文件存储服务正常', 'ok');
  }else{
    toast('未检测到存储服务：请先双击 FlowTask 文件夹中的「启动存储服务.bat」', 'err');
  }
  updateStoreStatus();
}

/* ---------- 任务状态 / 标签 / 数据迁移 ---------- */
/* STATUS_NAME / STATUS_CLS 由文件上方的 STATUS_DEF 唯一真相源派生，勿在此重复定义 */
function DEFAULT_TAGS(){
  return [
    { id:uid('g_'), name:'紧急', color:'#dc2626' },
    { id:uid('g_'), name:'设计', color:'#8b5cf6' },
    { id:uid('g_'), name:'文档', color:'#3b82f6' },
    { id:uid('g_'), name:'外部依赖', color:'#e8850c' },
    { id:uid('g_'), name:'可延后', color:'#9aa1ac' },
  ];
}
function migrateData(store){
  if(!store) return migrateDataInner();
  const saved = DB; DB = store;               // 对传入的库（个人库/共享库）单独迁移
  try{ return migrateDataInner(); } finally { DB = saved; }
}
function migrateDataInner(){
  let changed = false;
  if(!DB.tags){ DB.tags = DEFAULT_TAGS(); changed = true; }
  // 回收站结构与 30 天自动清理
  if(!DB.trash || !Array.isArray(DB.trash.tasks) || !Array.isArray(DB.trash.projects)){
    DB.trash = { tasks: [], projects: [] }; changed = true;
  }
  const TRASH_CUT = Date.now() - 30 * 86400000;
  const beforeTrash = DB.trash.tasks.length + DB.trash.projects.length;
  DB.trash.tasks = DB.trash.tasks.filter(x => (x.deletedAt || 0) > TRASH_CUT);
  DB.trash.projects = DB.trash.projects.filter(p => {
    if((p.deletedAt || 0) > TRASH_CUT) return true;
    DB.tasks = DB.tasks.filter(t => t.projectId !== p.id);   // 过期项目：连同其任务一起物理清除
    return false;
  });
  if(DB.trash.tasks.length + DB.trash.projects.length !== beforeTrash) changed = true;
  DB.projects.forEach(p=>{
    if(!p.statusUpdates){ p.statusUpdates = []; changed = true; }
    if(p.sections !== undefined){ delete p.sections; changed = true; }   // v1.3：分区概念移除，任务分组统一由状态决定
    /* v1.6 结构兜底：外部导入 / 别人共享来的坏数据不能让渲染链崩掉（此前
       p.memberIds 缺失会在 visibleProjects 处直接 TypeError → 全站白屏且已落盘） */
    if(!Array.isArray(p.memberIds)){
      /* P1-3：ME 未就绪（加载期）且项目没有 ownerId 时，绝不能落成空成员数组——
         否则项目「可见但不可写」。回退顺序：项目创建人 → 当前登录用户 →
         账户表里第一个活跃用户（DB.users 合并时来自账户表，迁移单个库时退回 AUTH） */
      let mid = p.ownerId || (ME && ME.id) || null;
      if(!mid){
        const pool = (DB.users && DB.users.length) ? DB.users : ((AUTH && AUTH.users) || []);
        const first = pool.find(u => u && u.active !== false) || pool[0];
        mid = (first && first.id) || null;
      }
      p.memberIds = [mid].filter(Boolean); changed = true;
    }
    if(!p.ownerId && p.memberIds.length){ p.ownerId = p.memberIds[0]; changed = true; }
    /* scope 缺失（单文件时代迁移过来的项目基本都是）显式补成 'personal'：
       projectScopeOf 本来就把非 'shared' 一律当个人库处理，不补不影响落盘，
       但成员弹窗、侧栏标记、项目设置都读这个字段——留空就让"这项目共没共享"在界面上说不清 */
    if(p.scope !== SCOPE_SHARED && p.scope !== 'personal'){ p.scope = 'personal'; changed = true; }
    if(p.archived === undefined){ p.archived = false; changed = true; }
    if(!p.createdAt){ p.createdAt = Date.now(); changed = true; }
  });
  DB.tasks.forEach(t=>{
    if(!t || typeof t !== 'object' || !t.id) return;
    if(!t.projectId){ t.projectId = null; changed = true; }
    if(typeof t.title !== 'string'){ t.title = String(t.title == null ? '' : t.title); changed = true; }
    if(!Array.isArray(t.comments)){ t.comments = []; changed = true; }
    if(!Array.isArray(t.activities)){ t.activities = []; changed = true; }
    if(t.sectionId !== undefined){ delete t.sectionId; changed = true; } // v1.3：所属分区字段移除
    if(t.status === undefined){ t.status = t.completed ? 'done' : 'todo'; changed = true; }
    if(t.completed !== (t.status==='done')){ t.completed = (t.status==='done'); changed = true; }   // 单一真相源：completed 始终派生自 status
    /* 状态必须落在 STATUS_DEF 里：不认识的取值会让这条任务在看板与列表的任何分组都不出现
       （静默消失）。导入、别人共享来的库、以及将来再加状态时都靠这一道兜底。 */
    if(!STATUS_NAME[t.status]){ t.status = t.completed ? 'done' : 'todo'; changed = true; }
    if(!PRIO[t.priority]){ t.priority = 'low'; changed = true; }
    if(t.startDate === undefined){ t.startDate = null; changed = true; }
    if(t.tags === undefined){ t.tags = []; changed = true; }
    if(t.followers === undefined){ t.followers = []; changed = true; }
    if(t.recurring === undefined){ t.recurring = null; changed = true; }
    if(!Array.isArray(t.subtasks)) t.subtasks = [];
    t.subtasks = t.subtasks.map(s=>{
      if(typeof s === 'string'){ changed = true; s = { id:uid('st_'), title:s }; }
      if(s.assigneeId === undefined){ s.assigneeId = null; changed = true; }
      if(s.dueDate === undefined){ s.dueDate = null; changed = true; }
      if(s.note !== undefined){                                  // 旧"备注"字段迁移为描述后移除
        if(s.note && !s.desc) s.desc = s.note;
        delete s.note; changed = true;
      }
      /* 子任务与主任务字段对齐（唯一的区别：不能再嵌套子任务） */
      if(s.status === undefined){ s.status = s.done ? 'done' : 'todo'; changed = true; }
      if(s.done !== (s.status === 'done')){ s.done = (s.status === 'done'); changed = true; }
      if(s.startDate === undefined){ s.startDate = null; changed = true; }
      if(s.priority === undefined){ s.priority = null; changed = true; }   // null = 继承主任务优先级
      if(s.desc === undefined){ s.desc = ''; changed = true; }
      if(!Array.isArray(s.tags)){ s.tags = []; changed = true; }
      if(!Array.isArray(s.followers)){ s.followers = []; changed = true; }
      if(!Array.isArray(s.comments)){ s.comments = []; changed = true; }
      if(!Array.isArray(s.activities) || !s.activities.length){
        s.activities = [{id:uid('a_'), userId:s.createdBy || t.createdBy || ME.id, text:'创建了子任务', ts:s.createdAt || t.createdAt || Date.now()}];
        changed = true;
      }
      if(s.recurring === undefined){ s.recurring = null; changed = true; }
      if(s.createdBy === undefined){ s.createdBy = null; changed = true; }
      if(s.createdAt === undefined){ s.createdAt = t.createdAt || Date.now(); changed = true; }
      return s;
    });
  });
  if(changed) saveDB();
}

/* ---------- 认证（账户表独立于数据库；会话由服务端签发，7 天有效） ----------
   v1.6：服务端不再下发 salt/passHash（脱敏表），登录改为
   「GET /api/auth-challenge 拿盐 → 本地算 PBKDF2 证明 → POST /api/session 换会话」，
   只凭 uid 就能换会话的口子已封死。file:// 兜底模式（无服务）维持本地校验。 */
let _legacyData = null;      // 旧版单文件内容，首次登录时迁进个人库
let _authHealthy = true;     // 账户表最近一次读取是否成功；失败时禁止注册/写回，防瞬时错误顶掉真实账户
async function loadAccounts(){
  if(!SVC_MODE){
    try{
      const raw = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
      if(raw && Array.isArray(raw.users)){ AUTH = raw; _revs.auth = Number(raw.meta && raw.meta.rev) || 0; _authHealthy = true; return true; }
    }catch(e){}
    AUTH = { meta:{ rev:0 }, users: [] };
    _authHealthy = true;
    return true;
  }
  const r = await readStoreJSON(AUTH_FILE);
  if(r.ok && r.data && Array.isArray(r.data.users)){
    AUTH = r.data; _revs.auth = Number(r.data.meta && r.data.meta.rev) || 0;
    _wrote.auth = JSON.stringify(AUTH);
    _authHealthy = true;
    return true;
  }
  if(!r.ok){
    /* 读取失败 ≠ 没有账户表。绝不能在这里建演示账户，也绝不能让本次会话再写账户表：
       _revs.auth 若沿用上次成功读取的版本号，空表会以更高 rev 顶掉整个账户表（v1.6 修复） */
    AUTH = { meta:{ rev:0 }, users: [] };
    _authHealthy = false;
    _revs.auth = 0; _wrote.auth = '__unreadable__';
    console.warn('账户表读取失败，本次不写入', r.status);
    toast('账户表暂时读不到（存储服务可能正忙），请刷新页面重试', 'err');
    return false;
  }
  // 到这里才是"文件确实不存在"：先试着从旧版单文件里把账户拆出来
  const legacy = await readStoreJSON(LEGACY_FILE);
  if(legacy.ok && legacy.data && Array.isArray(legacy.data.users) && legacy.data.users.length){
    AUTH = { meta:{ rev:0 }, users: legacy.data.users };
    _legacyData = legacy.data;
    _authHealthy = true;
    saveAuth();
    return true;
  }
  if(legacy.ok){ _authHealthy = true; await ensureDemoAccounts(); return true; }   // 旧库也读不到时同样不覆盖
  AUTH = { meta:{ rev:0 }, users: [] };
  _authHealthy = false;
  return false;
}
async function register(username, name, password, extra){
  username = String(username||'').trim().toLowerCase();
  name = String(name||'').trim() || username;
  if(!/^[a-z0-9_\-\u4e00-\u9fa5]{2,20}$/.test(username)) return '用户名需为 2-20 位字母/数字/中文';
  if(String(password||'').length < 6) return '密码至少 6 位';
  if(!AUTH || !_authHealthy) return '账户表还没就绪，请稍后重试';
  if(AUTH.users.some(u=>u.username === username)) return '该用户名已被使用';
  const isFirst = AUTH.users.filter(u=>u.active).length === 0;
  const salt = uid('s_');
  const user = { id: uid('u_'), username, name, role: isFirst?'admin':'member',
    salt, passHash: await hashPassword(password, salt), color: colorFor(username), active:true, createdAt:Date.now() };
  /* 管理员建号会带着角色 / 首登改密标记一起进来：一次写入，不分两段（第二段失败会留下半成品账户） */
  if(extra && typeof extra === 'object') Object.assign(user, extra);
  AUTH.users.push(user);
  const w = await saveAuth();
  if(!w.ok){
    /* 没落盘的账户不能留在界面上假装存在：回滚内存与本机缓存，把原因回给调用方 */
    AUTH.users = (AUTH.users || []).filter(u => u && u.id !== user.id);
    try{ localStorage.setItem(AUTH_KEY, JSON.stringify(AUTH)); }catch(e){}
    if(ME && DB){ DB.users = AUTH.users; renderApp(); }
    return w.err || '账户写入存储服务失败，请重试';
  }
  return user;
}
async function login(username, password){
  username = String(username||'').trim().toLowerCase();
  if(SVC_MODE){
    /* 挑战 → 证明 → 会话。密码校验在服务端完成；页面不再需要、也拿不到任何人的哈希 */
    if(!username || !password) return '请输入用户名和密码';
    let ch;
    try{
      ch = await fetch(STORE_SVC + '/api/auth-challenge?username=' + encodeURIComponent(username), { cache:'no-store', headers: storeHeaders() });
    }catch(e){ return '存储服务未响应，请确认服务已启动'; }
    if(ch.status === 404) return '用户名或密码错误';
    if(!ch.ok) return '登录失败：存储服务异常（' + ch.status + '）';
    const cj = await ch.json().catch(()=>null);
    if(!cj || !cj.uid) return '登录失败：存储服务返回异常';
    if(cj.algo !== 'p1' && cj.algo !== 'legacy') return '登录失败：存储服务返回异常';
    const verifier = cj.algo === 'p1' ? await hashPassword(password, cj.salt) : await legacyHash(password, cj.salt);
    let r;
    try{
      r = await fetch(STORE_SVC + '/api/session', {
        method:'POST', headers: storeHeaders(), body: JSON.stringify({ uid: cj.uid, verifier })
      });
    }catch(e){ return '存储服务未响应，请确认服务已启动'; }
    if(r.status === 401) return '用户名或密码错误';
    if(!r.ok) return '登录失败：存储服务异常（' + r.status + '）';
    const j = await r.json().catch(()=>null);
    if(!j || !j.session) return '登录失败：存储服务返回异常';
    saveSessionLocal({ session: j.session, exp: Number(j.exp) || (Date.now() + 7*86400000), uid: cj.uid });
    if(!AUTH || !AUTH.users.some(u=>u.id===cj.uid)) await loadAccounts();
    const me = AUTH && AUTH.users.find(u=>u.id===cj.uid && u.active !== false);
    if(!me) return '登录成功，但账户列表暂时读不到，请刷新页面';
    if(cj.algo === 'legacy'){
      /* 透明升级：旧格式哈希 → PBKDF2（本人会话在场，服务端允许本人改自己的哈希） */
      me.salt = uid('s_');
      me.passHash = await hashPassword(password, me.salt);
      saveAuth();
    }
    return me;
  }
  if(!AUTH) return '账户数据还没就绪，请刷新重试';
  const user = AUTH.users.find(u=>u.username===username);
  if(!user) return '用户名或密码错误';
  if(!user.active) return '该账户已被停用，请联系管理员';
  if(!(await verifyPassword(user, password))) return '用户名或密码错误';
  return user;
}
/* 向服务端换取签名会话（v1.6：SVC 模式下登录流程已在 login() 里完成签发；
   这里只兜底补签。file:// 直开的兜底模式用本地标记，仅影响本机） */
async function establishSession(user){
  if(SVC_MODE){
    const cur = loadSessionLocal();
    if(cur && cur.uid === user.id) return true;      // login() 已签发
    try{
      const r = await fetch(STORE_SVC + '/api/session', {
        method:'POST', headers:{ 'Content-Type':'application/json', 'X-FlowTask-Token': _svcToken },
        body: JSON.stringify({ uid: user.id })
      });
      if(r.ok){ const j = await r.json(); if(j && j.session){ saveSessionLocal({ session:j.session, exp:Number(j.exp), uid:user.id }); return true; } }
    }catch(e){}
    return false;
  }
  saveSessionLocal({ session:'local$' + user.id, exp: Date.now() + 7*86400000, uid:user.id });
  return true;
}
function sessionUid(){
  const s = loadSessionLocal();
  if(!s) return null;
  return s.uid || (String(s.session).indexOf('local$') === 0 ? String(s.session).slice(6) : null);
}
function currentSessionUser(){
  const id = sessionUid();
  if(!id || !AUTH) return null;
  const u = AUTH.users.find(x=>x.id===id);
  return (u && u.active) ? u : null;
}
/* 服务端验签：本地没过期不代表服务端认（比如密钥换过） */
async function verifySessionWithServer(){
  const s = loadSessionLocal();
  if(!s) return false;
  if(!SVC_MODE) return true;
  try{
    const r = await fetch(STORE_SVC + '/api/session', { cache:'no-store', headers: storeHeaders() });
    return r.ok;
  }catch(e){ return false; }
}
/* 会话在操作中途过期（推送返回 401）：与 loadMyStores 的 401 同一待遇——
   提示重新登录，而不是把「服务挂了」的假象留给用户 */
function expireSession(){
  /* P1-8：与 logout 一致，先把待写盘队列冲掉再置空 DB/ME——
     否则 401 恰好落在 saveDB 的防抖窗口内时，最后一次编辑会静默丢失 */
  try{ flushAllSaves(); }catch(e){ logSoft('会话过期前冲写盘失败', e); }
  clearSessionLocal();
  toast('登录状态已失效，请重新登录', 'err');
  ME = null; DB = null;
  _syncInfo = null; _syncSavedAt = 0; updateSyncStatus();      // 离开应用就收掉顶栏的同步指示
  maskRemoveAll(); closeDrawer();
  $('#app').classList.remove('on');
  showAuthPage();
}
function logout(){
  /* v1.6：登出前必须冲掉待写盘队列——防抖窗口内的最后一次编辑此前会随
     DB/ME 置空一起作废，既不进文件也不留缓存（静默丢数据） */
  try{ flushAllSaves(); }catch(e){}
  clearSessionLocal();
  try{ localStorage.removeItem(OLD_SESSION_KEY); }catch(e){}
  location.hash = '';
  ME = null; DB = null;
  _syncInfo = null; _syncSavedAt = 0; updateSyncStatus();      // 离开应用就收掉顶栏的同步指示
  maskRemoveAll(); closeDrawer();
  $('#app').classList.remove('on');
  $('#auth-page').style.display = 'flex';
  renderAuthMode();
}

/* 渲染后统一给 div/span 型可点元素补键盘可达性（避免逐个改 20+ 处模板） */
const A11Y_CLICKABLE = '[data-nav],[data-task],[data-st-open],[data-fstatus],[data-fassignee],[data-fprio],[data-ftag],'
  + '.task-row,.board-card,.mini-task,.search-item,.notif-item,.proj-item,.view-tab,.f-chip,.tag-chip,'
  + '.check-circle,.mood-btn,.help-tab,.st-del,.sec-preset,.member-chip,.avatar-btn,.follower-add,'

  + '.add-task-row,.board-add-card,[data-addcard],.cal-more,[data-more],.f-sum,[data-fsum],.po-item,.user-chip,.link-more';
function enhanceA11y(root){
  if(!root || !root.querySelectorAll) return;
  Array.prototype.forEach.call(root.querySelectorAll(A11Y_CLICKABLE), el=>{
    const tag = el.tagName;
    if(tag==='BUTTON'||tag==='A'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
    const t = el.getAttribute('title');
    if(t && !el.hasAttribute('aria-label')) el.setAttribute('aria-label', t);
  });
}
/* Enter / Space 激活当前聚焦的可点元素 */
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const el = document.activeElement;
  if(!el || el===document.body) return;
  const tag = el.tagName;
  if(tag==='BUTTON'||tag==='A'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;
  if(!el.matches || !el.matches(A11Y_CLICKABLE)) return;
  e.preventDefault();
  el.click();
});

/* 侧栏项目拖拽排序：只改本机 UI 顺序，不动数据文件 */
function bindSidebarProjectDrag(){
  const list = $('#sb-proj-list');
  if(!list) return;
  $$('.proj-item', list).forEach(el=>{
    el.draggable = true;
    el.title = (el.title ? el.title + ' · ' : '') + '上下拖动可调整项目顺序';
    el.addEventListener('dragstart', e=>{
      DRAG_PID = el.dataset.pid;
      e.dataTransfer.setData('text/plain', DRAG_PID);
      e.dataTransfer.effectAllowed = 'move';
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', ()=>{
      DRAG_PID = null;
      $$('.proj-item', list).forEach(x=>x.classList.remove('dragging','drop-before','drop-after'));
    });
    el.addEventListener('dragover', e=>{
      if(!DRAG_PID || el.dataset.pid === DRAG_PID) return;
      e.preventDefault(); e.stopPropagation();
      const r = el.getBoundingClientRect();
      const before = e.clientY < r.top + r.height / 2;
      el.classList.toggle('drop-before', before);
      el.classList.toggle('drop-after', !before);
    });
    el.addEventListener('dragleave', ()=> el.classList.remove('drop-before','drop-after'));
    el.addEventListener('drop', e=>{
      e.preventDefault(); e.stopPropagation();
      const targetId = el.dataset.pid;
      const pid = DRAG_PID || e.dataTransfer.getData('text/plain');
      const before = el.classList.contains('drop-before');
      $$('.proj-item', list).forEach(x=>x.classList.remove('dragging','drop-before','drop-after'));
      if(!pid || pid === targetId) return;
      const visible = DB.projects.filter(p => P.canSeeProject(p));
      const seq = visible.slice().sort((a,b)=> projOrderOf(a.id) - projOrderOf(b.id));
      const anchorIdx = seq.findIndex(p=>p.id === targetId);
      const beforeId = before ? (seq[anchorIdx] || {}).id : (seq[anchorIdx + 1] || {}).id;
      const snapshot = Object.assign({}, UI.projOrder);          // 撤销要能精确还原拖之前的顺序
      moveProjectOrder(visible, pid, beforeId || null);
      renderSidebar();
      toast('项目顺序已调整', 'ok', { label:'撤销', fn:()=>{ UI.projOrder = snapshot; saveUI(); renderSidebar(); } });
    });
  });
  // 拖到列表末尾的空白处 = 放到最后
  list.addEventListener('dragover', e=>{ if(DRAG_PID) e.preventDefault(); });
  list.addEventListener('drop', e=>{
    if(!DRAG_PID || e.target !== list) return;
    e.preventDefault();
    const visible = DB.projects.filter(p => P.canSeeProject(p));
    const snapshot = Object.assign({}, UI.projOrder);
    moveProjectOrder(visible, DRAG_PID, null);
    renderSidebar();
    toast('项目顺序已调整', 'ok', { label:'撤销', fn:()=>{ UI.projOrder = snapshot; saveUI(); renderSidebar(); } });
  });
}

function renderContent(){

     「删除」等动作在首页/回收站里仍可对不可见的选中集生效 */
  if(ROUTE.page !== 'project' && (MULTI.on || MULTI.ids.size)){
    MULTI = { on:false, ids:new Set() };
    removeBatchBar();
  }
  try{
    switch(ROUTE.page){
      case 'home':      return renderHome(c);
      case 'my-tasks':  return renderMyTasks(c);
      case 'inbox':     return renderInbox(c);
      case 'project':   return renderProject(c);
      case 'members':   return renderMembers(c);
      case 'settings':  return renderSettings(c);
      case 'data':      return renderData(c);
      case 'trash':     return renderTrash(c);
      default:          return renderHome(c);

  }catch(e){
    /* v1.6 渲染兜底：任何一条脏数据都不该把整站变白屏（导入过坏备份后连刷新都无法恢复的那种死局） */
    console.error('renderContent 失败：', e);

      这个页面渲染出错了：数据里可能有一条不完整的记录。<br>

function dueClass(due, completed, paused){
  if(!due || completed) return '';
  if(paused) return '';                       /* 已暂停不标红：搁置的任务不该顶着「逾期」的脸 */
  if(due < todayStr()) return 'overdue';
  if(due === todayStr()) return 'today';
  if(due <= dateOffset(3)) return 'soon';
  return '';
}
function bindTaskClicks(scope){
  /* P1-1：主任务行与子任务行必须是两次平级遍历。此前子任务绑定嵌在主任务遍历内部：
     ① 外层 0 次命中（当天卡片只有子任务、没有主任务）时，子任务绑定整体被跳过 →
     完成圆圈点了没反应；② 内层随外层重复执行，复杂度 O(n×m)。 */
  $$('.mini-task[data-task]', scope).forEach(el => {
    el.onclick = (e) => {
      if(e.target.closest('.check-circle')) return;
      openDrawer(el.dataset.task);
    };
    const chk = $('.check-circle', el);
    if(chk) chk.onclick = (e) => { e.stopPropagation(); toggleTaskDone(el.dataset.task); };
  });
  /* v1.8.0：首页卡片里的子任务行 → 打开子任务详情；
     v1.8.1：行首的完成圆圈 → 切换子任务完成状态（点圆圈不打开详情） */
  $$('.mini-task[data-sub]', scope).forEach(el => {
    const parts = (el.dataset.sub || '').split('/');
    if(parts.length !== 2) return;
    const host = DB.tasks.find(x=>x.id===parts[0]);
    const sub = host && host.subtasks.find(x=>x.id===parts[1]);
    el.onclick = (e) => {
      if(e.target.closest('.check-circle')) return;
      openSubDrawer(parts[0], parts[1]);
    };
    const chk = el.querySelector('.check-circle');
    /* toggleSubDone 只改状态（含重复任务生成下一期），落盘与重绘由调用方负责 */
    if(chk && host && sub) chk.onclick = (e) => { e.stopPropagation(); toggleSubDone(host, sub); saveDB(); renderApp(); };
  });
}

const REC_NAME = { daily:'每天', weekly:'每周', monthly:'每月' };
const REC_SVG = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="vertical-align:-1px"><path d="M17 2v4h-4" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11v-1a4 4 0 0 1 4-4h10" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 22v-4h4" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 13v1a4 4 0 0 1-4 4H7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
/*==TEST-BEGIN==*/
function nextDueDate(ds, mode){
  if(!ds) return null;
  const d = new Date(ds + 'T00:00:00');
  if(mode==='daily') d.setDate(d.getDate()+1);
  else if(mode==='weekly') d.setDate(d.getDate()+7);
  else if(mode==='monthly') d.setMonth(d.getMonth()+1);
  return localDateStr(d);
}
/*==TEST-END==*/
function toggleTaskDone(taskId){
  const t = DB.tasks.find(x=>x.id===taskId);
  if(!t || !P.canWriteTask(t)) return toast(denyWriteTaskMsg(t), 'err');
  if(!t.completed){
    t._prevStatus = (t.status && t.status!=='done') ? t.status : 'todo';   // 快照原状态，取消完成时恢复
    t.completed = true; t.status = 'done'; t.completedAt = Date.now();
  }else{
    t.completed = false; t.completedAt = null;
    t.status = (t._prevStatus && t._prevStatus!=='done') ? t._prevStatus : 'todo';
  }
  t.activities.push({id:uid('a_'), userId:ME.id, text: t.completed?'完成了任务':'重新打开了任务', ts:Date.now()});
  let spawned = null;
  if(t.completed && t.recurring){
    spawned = spawnRecurringNext(t);
  }
  saveDB(); renderApp();
  if(spawned) toast(`重复任务已生成下一期：${REC_NAME[t.recurring]}`, 'ok');
  if(ROUTE.page==='project' && ROUTE.tid===taskId) openDrawer(taskId);
}
function spawnRecurringNext(t){
  const clone = JSON.parse(JSON.stringify({
    id:t.id, projectId:t.projectId, title:t.title, desc:t.desc,
    assigneeId:t.assigneeId, priority:t.priority, tags:t.tags, subtasks:t.subtasks
  }));
  clone.id = uid('t_');
  clone.dueDate = nextDueDate(t.dueDate, t.recurring);
  clone.startDate = t.startDate ? nextDueDate(t.startDate, t.recurring) : null;
  clone.status = 'todo'; clone.completed = false; clone.completedAt = null;
  clone.order = Date.now(); clone.comments = []; clone.followers = t.followers || [];
  clone.recurring = t.recurring;
  clone.subtasks = (clone.subtasks||[]).map(s=>({ ...s, id:uid('st_'), done:false, status:'todo', _prevStatus:'todo',
    comments:[], activities:[{id:uid('a_'), userId:ME.id, text:'由重复任务自动生成', ts:Date.now()}],
    createdAt:Date.now(), createdBy:ME.id }));
  clone.activities = [{id:uid('a_'), userId:ME.id, text:`由重复任务自动生成（上一期：${fmtDate(t.dueDate)||'无日期'}）`, ts:Date.now()}];
  clone.createdAt = Date.now(); clone.createdBy = ME.id;
  DB.tasks.push(clone);
  if(clone.assigneeId && clone.assigneeId !== ME.id)
    notify(clone.assigneeId, 'assign', clone.id, { title: clone.title, due: clone.dueDate, recurring: true });
  return clone;
}
function createTask(pid, status, title, extra={}){
  const proj = P.visibleProject(pid);
  if(!proj || !P.canWriteProject(proj)) return toast('无权在此项目创建任务', 'err');
  const st = (['todo','doing','done'].includes(status)) ? status : (extra.status||'todo');
  const done = st==='done';
  const t = { id:uid('t_'), projectId:pid, title, desc:'', assigneeId:extra.assigneeId||null,
    dueDate:extra.dueDate||null, startDate:extra.startDate||null,
    priority:extra.priority||'low', status:st, completed:done, completedAt:done?Date.now():null,
    order: nextTaskOrder(DB.tasks, pid, st, Date.now()), subtasks:[], comments:[], tags:extra.tags||[], followers:extra.followers||[], recurring:extra.recurring||null,
    activities:[{id:uid('a_'), userId:ME.id, text:'创建了任务', ts:Date.now()}],
    createdAt:Date.now(), createdBy:ME.id };
  DB.tasks.push(t); saveDB(); renderApp();
  if(extra.assigneeId) notify(extra.assigneeId, 'assign', t.id, { title });
  return t;
}
/* v1.7：把任务移动到其他项目。子任务/评论/关注人/动态随任务一起走；
   落位到目标项目同状态分组的末尾；跨个人库 ⇄ 共享库由 splitStores 按 scope 自动搬文件 */
function moveTaskToProject(taskId, targetPid){
  const t = DB.tasks.find(x=>x.id===taskId);
  const to = DB.projects.find(p=>p.id===targetPid && !p.archived);
  if(!t || !to || t.projectId===targetPid) return false;
  if(!P.canWriteTask(t)){ toast(denyWriteTaskMsg(t), 'err'); return false; }
  if(!P.canWriteProject(to)){ toast('你还不是「'+to.name+'」的项目成员，无法把任务移进去；请联系项目创建人', 'err'); return false; }
  const from = DB.projects.find(p=>p.id===t.projectId);
  const prev = { projectId: t.projectId, order: t.order };
  const peers = DB.tasks.filter(x=>x.projectId===targetPid && x.status===t.status && x.id!==t.id);
  t.projectId = targetPid;
  t.order = peers.length ? Math.max(...peers.map(x=>Number(x.order)||0)) + 1 : Date.now();
  t.activities.push({id:uid('a_'), userId:ME.id, text:`从「${from?from.name:'未知项目'}」移动到「${to.name}」`, ts:Date.now()});
  saveDB();
  toast('已移动到「'+to.name+'」', 'ok', { label:'撤销', fn:()=>{
    const back = DB.tasks.find(x=>x.id===taskId); if(!back) return;
    back.projectId = prev.projectId; back.order = prev.order;
    const f = DB.projects.find(p=>p.id===prev.projectId);
    if(f) back.activities.push({id:uid('a_'), userId:ME.id, text:'移回「'+f.name+'」', ts:Date.now()});
    saveDB(); renderApp();
  }});
  return true;
}

/* ---------- 子任务状态（与主任务一致，仅不能再嵌套子任务） ---------- */
/*==TEST-BEGIN==*/
function setSubStatus(t, s, st){
  const wasDone = s.done;
  s.status = st;
  s.done = (st === 'done');
  if(s.done && !wasDone && s.recurring) spawnSubNext(t, s);
  if(!s.done) s._prevStatus = st;
}
function toggleSubDone(t, s){
  if(!s.done){
    s._prevStatus = (s.status && s.status!=='done') ? s.status : 'todo';
    setSubStatus(t, s, 'done');
  }else{
    setSubStatus(t, s, (s._prevStatus && s._prevStatus!=='done') ? s._prevStatus : 'todo');
  }
}
function spawnSubNext(t, s){
  const clone = JSON.parse(JSON.stringify({
    title:s.title, desc:s.desc, assigneeId:s.assigneeId,
    priority:s.priority, tags:s.tags||[], followers:s.followers||[], recurring:s.recurring
  }));
  clone.id = uid('st_');
  clone.dueDate = nextDueDate(s.dueDate, s.recurring);
  clone.startDate = s.startDate ? nextDueDate(s.startDate, s.recurring) : null;
  clone.status = 'todo'; clone.done = false;
  clone.comments = [];
  clone.activities = [{id:uid('a_'), userId:ME.id, text:`由重复子任务自动生成（上一期：${fmtDate(s.dueDate)||'无日期'}）`, ts:Date.now()}];
  clone.createdAt = Date.now(); clone.createdBy = ME.id;
  const i = t.subtasks.findIndex(x=>x.id===s.id);
  t.subtasks.splice(i < 0 ? t.subtasks.length : i + 1, 0, clone);
  if(clone.assigneeId && clone.assigneeId !== ME.id)
    notify(clone.assigneeId, 'subtask_assign', t.id, { subTitle: clone.title });
  return clone;
}
/*==TEST-END==*/

/* ---------- 回收站（软删除：30 天内可恢复） ---------- */
function trashTaskIds(ids){
  const list = Array.isArray(ids) ? ids : [ids];
  if(!list.length) return [];
  DB.trash = DB.trash || { tasks:[], projects:[] };
  const idSet = new Set(list);
  const moved = DB.tasks.filter(t=>idSet.has(t.id)).map(t=>{
    const c = JSON.parse(JSON.stringify(t));
    c.deletedAt = Date.now();
    return c;
  });
  DB.trash.tasks.push(...moved);
  DB.tasks = DB.tasks.filter(t=>!idSet.has(t.id));
  DB.notifications = DB.notifications.filter(n=>!n.taskId || !idSet.has(n.taskId));
  return moved;
}
function trashProjectById(pid){
  const p = DB.projects.find(x=>x.id===pid);
  if(!p) return null;
  DB.trash = DB.trash || { tasks:[], projects:[] };
  const c = JSON.parse(JSON.stringify(p));
  c.deletedAt = Date.now();
  DB.trash.projects.push(c);
  DB.projects = DB.projects.filter(x=>x.id!==pid);
  return c;
}
function restoreTrashedTask(item){
  const proj = DB.projects.find(p=>p.id===item.projectId);
  if(!proj) return false;   // 所属项目不在（可能也在回收站），需先恢复项目
  const c = JSON.parse(JSON.stringify(item)); delete c.deletedAt;
  DB.tasks.push(c);
  DB.trash.tasks = DB.trash.tasks.filter(x=>x.id!==item.id);
  return true;
}
function restoreTrashedProject(item){
  if(DB.projects.some(p=>p.id===item.id)) return false;
  const c = JSON.parse(JSON.stringify(item)); delete c.deletedAt;
  DB.projects.push(c);
  DB.trash.projects = DB.trash.projects.filter(x=>x.id!==item.id);
  return true;
}

/* ---- 过滤 / 多选 全局状态 ---- */
let FILTER = { status:'all', assignee:'all', prio:'all', tag:'all' };
let MULTI = { on:false, ids:new Set() };
function applyFilter(tasks){
  return tasks.filter(t=>{
    if(FILTER.status!=='all'){
      if(FILTER.status==='open' && t.completed) return false;
      if(FILTER.status!=='open' && t.status!==FILTER.status) return false;
    }
    if(FILTER.assignee!=='all'){
      if(FILTER.assignee==='none' && t.assigneeId) return false;
      if(FILTER.assignee!=='none' && t.assigneeId!==FILTER.assignee) return false;
    }
    if(FILTER.prio!=='all' && t.priority!==FILTER.prio) return false;
    if(FILTER.tag!=='all' && !(t.tags||[]).includes(FILTER.tag)) return false;
    return true;
  });
}
let FILTER_PANEL_OPEN = false;
function activeFilterCount(){
  let n = 0;
  if(FILTER.status!=='all') n++;
  if(FILTER.assignee!=='all') n++;
  if(FILTER.prio!=='all') n++;
  if(FILTER.tag!=='all') n++;
  return n;
}
function filterSummaryHTML(){
  const parts = [];
  const SNAME = Object.assign({ open:'未完成' }, STATUS_NAME);
  if(FILTER.status!=='all') parts.push({k:'status', label:SNAME[FILTER.status]||FILTER.status});
  if(FILTER.assignee!=='all'){
    const u = DB.users.find(x=>x.id===FILTER.assignee);
    parts.push({k:'assignee', label: FILTER.assignee==='none' ? '未指派' : (u?u.name:'—')});
  }
  if(FILTER.prio!=='all') parts.push({k:'prio', label:'优先级 '+prioName(FILTER.prio)});
  if(FILTER.tag!=='all'){ const g=tagOf(FILTER.tag); parts.push({k:'tag', label:g?g.name:'—'}); }
  return parts.map(p=>`<span class="f-sum" data-fsum="${p.k}" title="点击移除该筛选">${esc(p.label)} <b>✕</b></span>`).join('');
}

function filterOutside(e){
  if(!e.target.closest('.filter-bar')){
    if(FILTER_PANEL_OPEN){
      /* v1.10：收起筛选面板只是切一个显示类，不必整页重建（renderApp 会拆建数百个监听器） */
      FILTER_PANEL_OPEN = false;
      const p = $('#filter-panel');
      if(p) p.classList.remove('on');
      else renderApp();
    }

function bindFilterBar(scope, rerender){
  const tgl = $('#filter-toggle', scope);
  if(tgl) tgl.onclick = (e)=>{ e.stopPropagation(); FILTER_PANEL_OPEN = !FILTER_PANEL_OPEN; rerender(); };
  const panel = $('#filter-panel', scope);
  if(panel) panel.onclick = (e)=> e.stopPropagation();
  $$('.f-chip[data-fstatus]', scope).forEach(el=>el.onclick=()=>{ FILTER.status=el.dataset.fstatus; rerender(); });
  $$('.f-chip[data-fassignee]', scope).forEach(el=>el.onclick=()=>{ FILTER.assignee=el.dataset.fassignee; rerender(); });
  $$('.f-chip[data-fprio]', scope).forEach(el=>el.onclick=()=>{ FILTER.prio=el.dataset.fprio; rerender(); });
  $$('.f-chip[data-ftag]', scope).forEach(el=>el.onclick=()=>{ FILTER.tag=el.dataset.ftag; rerender(); });
  $$('.f-chip[data-fclear]', scope).forEach(el=>el.onclick=()=>{ FILTER={status:'all',assignee:'all',prio:'all',tag:'all'}; rerender(); });
  $$('[data-fsum]', scope).forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); FILTER[el.dataset.fsum]='all'; rerender(); });
  $$('[data-sf]', scope).forEach(el=>el.onclick=(e)=>{
    if(e.target.closest('[data-sf-del]')) return;
    const f = (DB.savedFilters||[]).find(x=>x.id===el.dataset.sf); if(f) applySavedFilter(f);
  });
  $$('[data-sf-del]', scope).forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const id = el.dataset.sfDel;
    const removed = (DB.savedFilters||[]).find(x=>x.id===id);
    DB.savedFilters = (DB.savedFilters||[]).filter(x=>x.id!==id);
    saveDB(); renderApp();
    if(removed) toast('筛选视图已删除', 'ok', { label:'撤销', fn:()=>{ DB.savedFilters.push(removed); saveDB(); renderApp(); } });
  });
  $$('[data-fsave]', scope).forEach(el=>el.onclick=async (e)=>{
    e.stopPropagation();
    if(!activeFilterCount()){ toast('先选几个筛选条件，再存为视图', 'err'); return; }
    const name = await openPromptModal({ title:'存为筛选视图', label:'视图名称', placeholder:'例如：我的高优待办', required:true, emptyTip:'给这个视图起个名字', okText:'保存视图' });
    if(!name) return;
    saveCurrentFilter(P.visibleProject(ROUTE.pid), ROUTE.view, name);
  });
  setTimeout(()=>document.addEventListener('click', filterOutside), 0);
}

/* ---- 列表视图（状态三分组 + 过滤 + 多选 + 拖拽排序/改状态） ---- */
/* 列表与看板的分组顺序同样由 STATUS_DEF 派生。
   以前这里把三态名字又抄了一遍（第二处真相源）——加状态时必然漏改，README 的
   「状态单源于 STATUS_DEF」约定正是被它违背的 */
const LIST_STATUSES = STATUS_DEF.map(s => ({ st: s.st, name: s.name }));
function renderListView(proj, canWrite){
  const wrap = $('#proj-body');
  wrap.innerHTML = LIST_STATUSES.map(g => {
    const items = applyFilter(tasksOfProject(proj.id).filter(t=>t.status===g.st))
      .sort((a,b)=> (g.st==='done' ? (b.completed ? a.completedAt-b.completedAt : 0) : b.order-a.order));
    const isDone = g.st==='done';
    return `<div class="section-block ${isDone?'done-section':''}" data-st="${g.st}">
      <div class="section-head">
        <span class="sec-title">${g.name}</span><span class="sec-count">${items.length}</span>
        ${canWrite && !MULTI.on ? `<span class="sec-actions">
          <button class="btn-icon" data-st-add="${g.st}" title="添加任务" style="padding:3px 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg></button>
        </span>`:''}
      </div>
      ${items.length ? items.map(t=>taskRowHTML(t)).join('') : groupEmptyHTML(proj, g.st, canWrite)}
      ${canWrite && !MULTI.on && !isDone ? `<div class="add-task-row" data-pid="${proj.id}" data-st="${g.st}"><span class="plus">＋</span>添加任务</div>`:''}
    </div>`;
  }).join('') + (canWrite ? `<div style="margin-top:4px;display:flex;gap:10px">
      ${MULTI.on ? '<button class="btn btn-ghost btn-sm" data-multi-exit>✕ 退出多选</button>' : '<button class="btn btn-ghost btn-sm" id="multi-btn">多选批量</button>'}
    </div>`:'');

  bindTaskRows(wrap);
  $$('#proj-body [data-st-add]').forEach(b=>b.onclick=()=>{
    openQuickAddModal(proj.id, b.dataset.stAdd);
  });

  // ---- 多选批量 ----
  const multiBtn = $('#multi-btn');
  if(multiBtn) multiBtn.onclick = ()=>{ MULTI.on = true; MULTI.ids.clear(); renderListView(proj, canWrite); };
  $$('[data-multi-exit]', wrap).forEach(b=>b.onclick=()=>{ MULTI.on=false; MULTI.ids.clear(); removeBatchBar(); renderListView(proj, canWrite); });
  if(MULTI.on && canWrite){
    $$('.task-row', wrap).forEach(row=>{
      row.classList.add('multi-on');
      if(MULTI.ids.has(row.dataset.task)) row.classList.add('selected');
      row.onclick = (e)=>{
        if(e.target.closest('.check-circle')) return;
        const id = row.dataset.task;
        if(MULTI.ids.has(id)) MULTI.ids.delete(id); else MULTI.ids.add(id);
        row.classList.toggle('selected');
        showBatchBar(proj);
      };
      const chk = $('.check-circle', row);
      if(chk) chk.onclick = (e)=>{ e.stopPropagation(); toggleTaskDone(row.dataset.task); };
    });
    showBatchBar(proj);
  } else {
    removeBatchBar();
    // ---- 拖拽：行 → 组（跨状态移动 + 组内排序，带落点指示） ----
    if(canWrite){
      $$('.task-row', wrap).forEach(row=>{
        row.draggable = true;
        row.addEventListener('dragstart', e=>{
          e.dataTransfer.setData('text/plain', row.dataset.task);
          e.dataTransfer.effectAllowed = 'move';
          row.classList.add('dragging');
        });
        row.addEventListener('dragend', ()=>{ row.classList.remove('dragging');
          $$('.task-row').forEach(r=>r.classList.remove('drop-above','drop-below')); });
        row.addEventListener('dragover', e=>{
          e.preventDefault();
          const rect = row.getBoundingClientRect();
          const above = e.clientY < rect.top + rect.height/2;
          row.classList.toggle('drop-above', above);
          row.classList.toggle('drop-below', !above);
        });
        row.addEventListener('dragleave', ()=>row.classList.remove('drop-above','drop-below'));
      });
      $$('.section-block', wrap).forEach(block=>{
        block.addEventListener('dragover', e=>{ e.preventDefault(); });
        block.addEventListener('drop', e=>{
          e.preventDefault();
          const taskId = e.dataTransfer.getData('text/plain');
          const t = DB.tasks.find(x=>x.id===taskId);
          const rowEl = e.target.closest('.task-row');
          if(!t) return;
          if(!P.canWriteTask(t)){ toast(denyWriteTaskMsg(t) + '，任务已放回原位', 'err'); renderProject($('#content')); return; }
          const targetSt = block.dataset.st;
          const others = DB.tasks.filter(x=>x.projectId===proj.id && x.status===targetSt && x.id!==taskId);
          if(rowEl && rowEl.dataset.task!==taskId){
            const anchor = DB.tasks.find(x=>x.id===rowEl.dataset.task);
            if(anchor){
              const above = rowEl.classList.contains('drop-above');
              t.order = above ? anchor.order + 0.5 : anchor.order - 0.5;
            }
          }else{
            t.order = others.length ? Math.min(...others.map(x=>x.order)) - 1 : Date.now();
          }
          if(t.status !== targetSt){
            t.status = targetSt;
            t.completed = (targetSt==='done');
            t.completedAt = (targetSt==='done') ? Date.now() : null;
            t.activities.push({id:uid('a_'), userId:ME.id, text:`状态改为「${STATUS_NAME[targetSt]}」`, ts:Date.now()});
          }
          saveDB(); renderProject($('#content'));
        });
      });
    }
  }
}
/* 批量动作统一收尾：toast 反馈 + 6 秒撤销（此前只有批量删除有反馈） */
function batchWithUndo(label, ids, mutate){
  const tasks = ids.map(id=>DB.tasks.find(x=>x.id===id)).filter(Boolean);
  if(!tasks.length) return false;
  const snapshot = tasks.map(t=>JSON.parse(JSON.stringify(t)));

  toast(label, 'ok', { label:'撤销', fn:()=>{
    snapshot.forEach(s=>{ const i = DB.tasks.findIndex(x=>x.id===s.id); if(i>=0) DB.tasks[i] = s; });

}
/* 切换筛选：只剔除被筛选隐藏的选择项并说明，而不是静默清空整份选择 */

/* UI 偏好存独立 key：视图状态不该把数据版本号顶高（多人协作时会产生无谓冲突） */
const UI_KEY = 'flowtask_ui';

const PREF_DEFAULTS = { projView:'overview', startPage:'last', tagLimit:2, newTaskStatus:'todo', seeAllProjects:false };

function loadUI(){

           projOrder: (v && v.projOrder) || {}, prefs: Object.assign({}, PREF_DEFAULTS, (v && v.prefs) || {}) };
  }catch(e){ UI = { filters:{}, lastRoute:'', lastAddPid:'', projOrder:{}, prefs: Object.assign({}, PREF_DEFAULTS) }; }

/* 侧栏项目顺序：个人偏好，只存在本机，不写进任何数据文件
   （否则拖一下共享项目就要重写团队共享库，白白制造冲突机会） */
function projOrderOf(id){
  const v = UI.projOrder && UI.projOrder[id];
  return Number.isFinite(v) ? v : 9e15;
}
function ensureProjectOrder(projects){
  if(!UI.projOrder) UI.projOrder = {};
  let max = 0, dirty = false;
  Object.values(UI.projOrder).forEach(v => { if(Number.isFinite(v) && v > max) max = v; });
  projects.forEach(p => {
    if(!Number.isFinite(UI.projOrder[p.id])){ UI.projOrder[p.id] = ++max; dirty = true; }
  });
  if(dirty) saveUI();
}
/* 把 pid 放到 beforeId 之前（beforeId 为空表示放到末尾），随后重排成连续整数 */
function moveProjectOrder(projects, pid, beforeId){
  const seq = projects.slice().sort((a,b)=> projOrderOf(a.id) - projOrderOf(b.id)).map(p=>p.id).filter(id=>id!==pid);
  const at = beforeId ? seq.indexOf(beforeId) : -1;
  if(at < 0) seq.push(pid); else seq.splice(at, 0, pid);
  seq.forEach((id, i) => { UI.projOrder[id] = i; });
  saveUI();
}
const filterKey = (pid, view)=> (pid||'-') + '|' + (view||'list');
function restoreFilter(pid, view){ FILTER = Object.assign({}, FILTER_DEFAULT, UI.filters[filterKey(pid, view)] || {}); }
function rememberFilter(pid, view){ UI.filters[filterKey(pid, view)] = Object.assign({}, FILTER); saveUI(); }

function showBatchBar(proj){

    <button data-ba="due" title="统一设置选中任务的截止日期">改日期…</button>

    /* v1.6：先清空选中再执行。此前 batchWithUndo 内部的 renderApp 先于
       MULTI.ids.clear() 跑，批量条会一直挂着旧的「N 项已选」而实际选中已是 0，
       用户被卡在一个计数为假的多选态里 */
    MULTI.ids.clear();

        if(!t.completed){
          /* P1-2：与单任务路径一致，完成前快照原状态，供「取消完成」还原 */

        t.completed=false; t.completedAt=null;

      openPopover(b, DB.users.filter(u=>u.active && memberIds.has(u.id)).map(u=>
        `<div class="po-item" data-po="${u.id}"><span class="avatar" style="background:${safeColor(u.color)};width:20px;height:20px;font-size:9px">${esc(u.name.slice(0,1))}</span><b>${esc(u.name)}</b><span class="sub">${ROLE_NAME[u.role]}</span></div>`).join('')
        + `<div class="po-sep"></div><div class="po-item" data-po=""><b>未指派</b></div>`,
        (uid2)=>{
          const who = uid2 ? (DB.users.find(u=>u.id===uid2)||{}).name : null;
          removePopover();
          batchWithUndo(who ? `已把 ${tasks.length} 项指派给 ${who}` : `已取消 ${tasks.length} 项的指派`, ids, ts=>{
            ts.forEach(t=>{ t.assigneeId = uid2||null; });

        });
      removeBatchBar();
    }else if(act==='due'){
      removeBatchBar();
      openPromptModal({ title:'批量设置截止日期', label:'截止日期（留空清除）', type:'date', okText:'设置日期' }).then(d=>{
        if(d===null) return;
        const val = d || null;
        batchWithUndo(val ? `已把 ${tasks.length} 项截止日期设为 ${fmtDate(val)}` : `已清除 ${tasks.length} 项的截止日期`, ids, ts=>{
          ts.forEach(t=>{ t.dueDate = val; if(val && t.startDate && t.startDate > val) t.startDate = val; });
        });
      });
    }else if(act==='move'){
      /* v1.7 新增：批量移动到其他项目（v1.7.1 改用可搜索选择器）。
         只移动「我对两边都有写权限」的任务，其余跳过并说明 */
      const targets = P.visibleProjects().filter(p=>!p.archived && p.id!==proj.id && P.canWriteProject(p));
      if(!targets.length){ toast('没有可移动的目标项目（你需要同时是源项目与目标项目的成员）', 'err'); return; }
      openProjectPicker(b, proj.id, (pid2)=>{
        const to = DB.projects.find(x=>x.id===pid2);
        if(!to) return;
        const movable = tasks.filter(t=>t.projectId!==pid2 && P.canWriteTask(t));
        if(!movable.length){ toast('没有可移动的任务（你对源任务没有写权限）', 'err'); return; }
        const skipped = tasks.length - movable.length;
        batchWithUndo(`已把 ${movable.length} 项移动到「${to.name}」${skipped?`（${skipped} 项无写权限已跳过）`:''}`, movable.map(t=>t.id), ts=>{
          ts.forEach(t=>{
            const from = DB.projects.find(p=>p.id===t.projectId);
            const peers = DB.tasks.filter(x=>x.projectId===pid2 && x.status===t.status && x.id!==t.id);
            t.projectId = pid2;
            t.order = peers.length ? Math.max(...peers.map(x=>x.order||0)) + 1 : Date.now();

          });

      removeBatchBar();
    }else if(act==='del'){
      openConfirm({
        title: '删除选中任务？',
        html: `确定删除选中的 ${tasks.length} 项任务？\n将移入回收站，30 天内可恢复。`,
        okText: '删除任务', danger: true,

        },
        onCancel: ()=>{ MULTI.ids = new Set([...ids]); renderListView(proj, true); }   // 取消：保留选中集
      });
    }else if(act==='exit'){
      MULTI.on=false; removeBatchBar(); renderApp();
    }
  };
}
