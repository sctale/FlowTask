  /* v1.6 权限修正：回收站是「我的个人库 ⊕ 共享库」的合并视图，此前整页无门槛——
     只读访客也能恢复/清空别人的共享数据，一次「清空」会物理删除全团队的回收站。
     v1.7.2：清空改为按管理权分范围——管理员清空全部；其他用户只彻底删除
     「自己能管理的条目」（个人库条目 / 自己创建的共享项目条目），其余保留。
     恢复按钮沿用同一管理权判据。 */
  const trashProjOf = pid => (DB.trash.projects || []).find(p=>p.id===pid);
  const canRestoreItem = (item, isProj) => {
    if(isProj) return P.isAdmin() || item.ownerId === ME.id;
    const live = DB.projects.find(p=>p.id===item.projectId);
    if(live) return P.canWriteProject(live);
    const trashed = trashProjOf(item.projectId);
    if(trashed) return P.isAdmin() || trashed.ownerId === ME.id;
    return P.isAdmin();
  };
  const clearableProjects = trash.projects.filter(p=>canRestoreItem(p, true));
  const clearableProjectIds = new Set(clearableProjects.map(p=>p.id));
  const clearableTasks = trash.tasks.filter(t=>canRestoreItem(t, false) || clearableProjectIds.has(t.projectId));
  const clearableCount = clearableProjects.length + clearableTasks.length;
  const lockedCount = total - clearableCount;
  c.innerHTML = `<div class="content-inner">
    <div class="page-head"><div class="head-row">
      <div><h1>回收站</h1>
        <div class="desc">删除的项目与任务保留 30 天，可随时恢复；到期后自动永久清除。当前共 ${total} 项。</div></div>
      ${total ? `<div class="head-actions"><button class="btn btn-danger btn-sm" id="trash-empty" title="${P.isAdmin()?'清空全部回收站（含共享库）':'清空你有管理权的条目；共享库中他人的条目仅管理员可清空'}">清空回收站</button></div>` : ''}
    </div></div>
    ${trash.projects.length ? `<div class="dt-sec-title" style="margin-top:4px">项目（${trash.projects.length}）</div>
      ${trash.projects.map(p=>`<div class="notif-item" style="cursor:default">
        <span style="width:10px;height:10px;border-radius:50%;background:${safeColor(p.color)};margin-top:6px;flex-shrink:0"></span>
        <div class="n-text"><b>${esc(p.name)}</b><br>
          <span style="font-size:11.5px;color:var(--text-faint)" title="删除于 ${timeTitle(p.deletedAt)}">删除于 ${fmtTime(p.deletedAt)} · 剩余 ${daysLeft(p.deletedAt)} 天 · 其任务仍保留，恢复项目后重新可见</span></div>
        ${canRestoreItem(p, true) ? `<button class="btn btn-outline btn-sm" data-rp="${p.id}">恢复</button>` : ''}
      </div>`).join('')}` : ''}
    ${trash.tasks.length ? `<div class="dt-sec-title" style="margin-top:14px">任务（${trash.tasks.length}）</div>
      ${trash.tasks.map(t=>`<div class="notif-item" style="cursor:default">
        <span style="margin-top:1px;color:var(--text-faint)">○</span>
        <div class="n-text"><b>${esc(t.title)}</b><br>
          <span style="font-size:11.5px;color:var(--text-faint)" title="删除于 ${timeTitle(t.deletedAt)}">所属项目：${esc(projName(t.projectId))} · 删除于 ${fmtTime(t.deletedAt)} · 剩余 ${daysLeft(t.deletedAt)} 天</span></div>
        ${canRestoreItem(t, false) ? `<button class="btn btn-outline btn-sm" data-rt="${t.id}">恢复</button>` : ''}
      </div>`).join('')}` : ''}
    ${!total ? '<div class="empty-state"><div class="icon-circle">' + icon('trash',20) + '</div>回收站是空的</div>' : ''}
  </div>`;
  $$('#content [data-rp]').forEach(b=>b.onclick=()=>{
    const item = trash.projects.find(x=>x.id===b.dataset.rp);
    if(!item || !canRestoreItem(item, true)) return toast('只有管理员或项目创建人可以恢复该项目', 'err');
    if(item && restoreTrashedProject(item)){ saveDB(); renderApp(); toast('项目已恢复', 'ok'); }
  });
  $$('#content [data-rt]').forEach(b=>b.onclick=()=>{
    const item = trash.tasks.find(x=>x.id===b.dataset.rt);
    if(!item) return;
    if(!canRestoreItem(item, false)) return toast(denyWriteTaskMsg(item), 'err');
    if(restoreTrashedTask(item)){ saveDB(); renderApp(); toast('任务已恢复', 'ok'); }
    else toast('所属项目不在项目列表：请先恢复其所属项目', 'err');
  });
  const eb = $('#trash-empty');
  if(eb) eb.onclick = ()=>{
    const leftover = trash.tasks.filter(t=>clearableProjectIds.has(t.projectId)).length;
    openConfirm({
      title: '清空回收站？',
      html: P.isAdmin()
        ? `将彻底删除全部 ${total} 项内容（含共享库），此操作不可恢复。\n近期自动备份仍保留在 backups/ 目录，出问题可找管理员找回。`
        : `将彻底删除其中你有管理权的 ${clearableCount} 项：项目 ${clearableProjects.length} 个、任务 ${clearableTasks.length - leftover} 条${leftover?`（另有 ${leftover} 条属于被清空的项目，将一并删除）`:''}，此操作不可恢复。\n${lockedCount ? `其余 ${lockedCount} 项属于共享库或他人，仅管理员可清空，本次会保留。\n` : ''}近期自动备份仍保留在 backups/ 目录。`,
      okText: P.isAdmin() ? `彻底删除全部 ${total} 项` : `彻底删除 ${clearableCount} 项`, danger: true,
      onOk: ()=>{
        if(P.isAdmin()){
          const delProjIds = new Set(trash.projects.map(p=>p.id));
          DB.tasks = DB.tasks.filter(t=>!delProjIds.has(t.projectId));   // 物理清除已删项目的遗留任务
          DB.trash = { tasks:[], projects:[] };
        }else{
          const goneIds = clearableProjectIds;
          DB.trash.projects = trash.projects.filter(p=>!clearableProjects.includes(p));
          DB.trash.tasks = trash.tasks.filter(t=>!clearableTasks.includes(t));
          DB.tasks = DB.tasks.filter(t=>!goneIds.has(t.projectId));      // 物理清除已清空项目的遗留任务
        }
        saveDB(); renderApp();
        toast(P.isAdmin() ? '回收站已清空' : `已清空 ${clearableCount} 项你有管理权的条目`, 'ok');
      }
    });
  };
}

/* ============ 模态框基础层（层叠栈 / 焦点管理 / 未保存守卫 / 防连点） ============ */
const MODAL_STACK = [];
const FOCUSABLE = 'button, [href], input, [select], textarea, [tabindex]:not([tabindex="-1"])';
function _modalVal(el){ return el.type==='checkbox' ? el.checked : el.value; }
/* 快照初始值：之后任一字段被改动即视为"脏"，关闭前需要确认 */
function snapshotDirty(mask, sel='.modal-body input, .modal-body textarea, .modal-body select'){
  const els = $$(sel, mask);
  const init = els.map(_modalVal);
  mask._dirtyCheck = ()=> els.some((el,i)=> _modalVal(el) !== init[i]);
}
function removeModal(mask){
  const i = MODAL_STACK.indexOf(mask);
  if(i >= 0) MODAL_STACK.splice(i, 1);
  if(mask.isConnected) mask.remove();
  if(mask._onCancel && !mask._settled){ mask._settled = true; try{ mask._onCancel(); }catch(e){} }
  const back = mask._trigger;
  if(back && back.isConnected && typeof back.focus === 'function') setTimeout(()=>back.focus({preventScroll:true}), 0);
}
function maskRemoveAll(){ while(MODAL_STACK.length) removeModal(MODAL_STACK[MODAL_STACK.length-1]); }
/* 只关最顶一层；有未提交输入时先挽留（audit-13 / audit-14） */
function closeTopModal(force){
  const mask = MODAL_STACK[MODAL_STACK.length-1];
  if(!mask) return false;
  if(!force && mask._dirtyCheck && mask._dirtyCheck()){
    openConfirm({
      title:'放弃已输入的内容？',
      html:'这个窗口里还有没有提交的输入，关闭后内容会丢失。',
      okText:'放弃并关闭', danger:true,
      // 必须显式关掉"原来那个"弹窗：确认框自己也在栈顶，
      // 再调 closeTopModal(true) 只会关掉确认框，原弹窗留下——就是"点了没反应"
      onOk:()=> forceCloseModal(mask)
    });
    return true;
  }
  removeModal(mask);
  return true;
}
/* 强制关闭指定弹窗（跳过未保存守卫），并顺带清掉它上面的确认框 */
function forceCloseModal(mask){
  if(!mask || !MODAL_STACK.includes(mask)) return false;
  mask._settled = true;
  const i = MODAL_STACK.indexOf(mask);
  MODAL_STACK.splice(i, 1);
  if(mask.isConnected) mask.remove();
  if(mask._onCancel){ try{ mask._onCancel(); }catch(e){} }
  // 确认框还压在它上面时一并收掉，避免留下空遮罩
  while(MODAL_STACK.length > i && MODAL_STACK[i]._isConfirm) removeModal(MODAL_STACK[i]);
  const back = mask._trigger;
  if(back && back.isConnected && typeof back.focus === 'function') setTimeout(()=>back.focus({preventScroll:true}), 0);
  return true;
}
function openModal(title, bodyHTML, onOk, okText='确定', extraFooter='', onCancel){
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(String(title).replace(/<[^>]*>/g,''))}">
    <div class="modal-head"><h3>${title}</h3>
      <button class="btn-icon modal-x" title="关闭（Esc）"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12" stroke-linecap="round"/></svg></button>
    </div>
    <div class="modal-body">${bodyHTML}</div>
    <div class="modal-foot ${extraFooter?'left':''}">${extraFooter}
      <button class="btn btn-outline modal-cancel">取消</button>
      <button class="btn btn-primary modal-ok">${okText}</button>
    </div>
  </div>`;
  mask._trigger = document.activeElement;
  mask._onCancel = onCancel;
  document.body.appendChild(mask);
  MODAL_STACK.push(mask);
  snapshotDirty(mask);
  const dismiss = ()=> closeTopModal(false);
  $('.modal-x', mask).onclick = dismiss;
  $('.modal-cancel', mask).onclick = dismiss;
  mask.addEventListener('click', e=>{ if(e.target===mask) dismiss(); });
  // 焦点在弹窗内循环，不逃到底层页面
  mask.addEventListener('keydown', e=>{
    if(e.key !== 'Tab') return;
    const f = $$(FOCUSABLE, mask).filter(el=> !el.disabled && el.offsetParent !== null);
    if(!f.length) return;
    const first = f[0], last = f[f.length-1];
    if(!mask.contains(document.activeElement)){ e.preventDefault(); first.focus(); return; }
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });
  const okBtn = $('.modal-ok', mask);
  okBtn.onclick = async ()=>{
    if(mask._busy) return;                       // 防连点：一次提交未完成前忽略后续点击
    mask._busy = true; okBtn.disabled = true;
    const label = okBtn.textContent; okBtn.textContent = '处理中…';
    try{
      const r = await onOk();
      if(r === false){ mask._busy = false; okBtn.disabled = false; okBtn.textContent = label; return; }
      mask._settled = true; removeModal(mask);
    }catch(err){
      console.error('弹窗提交异常', err);
      toast('操作未完成，请重试或查看页面数据', 'err');
      mask._busy = false; okBtn.disabled = false; okBtn.textContent = label;
    }
  };
  enhanceA11y(mask);
  const firstInput = $('.modal-body input, .modal-body textarea, .modal-body select', mask);
  if(firstInput) setTimeout(()=>firstInput.focus({preventScroll:true}), 50);
  return mask;
}
/* 自定义确认框（逐步替代原生 confirm，保持文案与视觉一致） */
function openConfirm(o){
  const mask = openModal(o.title || '确定？',
    `<p style="font-size:13.5px;line-height:1.7;color:var(--text-sub);margin:0;white-space:pre-line">${o.html || ''}</p>`,
    ()=>{ if(o.onOk) o.onOk(); },
    o.okText || '确定',
    '',
    ()=>{ if(o.onCancel) o.onCancel(); });
  if(o.danger) $('.modal-ok', mask).className = 'btn btn-danger modal-ok';
  mask._isConfirm = true;
  return mask;
}

function openAddSubtaskModal(t, proj){
  const memberIds = proj.memberIds;
  const userOpts = DB.users.filter(u=>u.active && (P.isAdmin() || memberIds.includes(u.id)))
    .map(u=>`<option value="${u.id}" ${u.id===ME.id?'data-me="1"':''}>${esc(u.name)}${u.id===ME.id?'（我）':''} · ${ROLE_NAME[u.role]}</option>`).join('');

    <div class="field"><label for="as-title">子任务标题</label>
      <input id="as-title" placeholder="例：核对模具图纸 @李四 周五" autocomplete="off"
        title="支持 @负责人、日期词（今天/明天/周五/3天后）">
      <div class="qa-parse" id="as-parse"></div>
    </div>
    <div class="field"><label for="as-assignee">负责人（可选）</label><select id="as-assignee" class="role-select"><option value="">未指派</option>${userOpts}</select></div>

    <div class="qa-hint">「添加子任务」创建后关闭弹窗；点「＋ 添加并继续」可连着录多条</div>
  `, ()=>commitSub(false), '添加子任务',

  /* v1.7.4：与快速添加一致——主按钮创建即关闭，连续录入是显式第二条路径 */
  const commitSub = (keepOpen)=>{
    const rawTitle = $('#as-title').value.trim();
    const pr = parseQuickText(rawTitle, { users: DB.users.filter(u=>u.active && (P.isAdmin() || memberIds.includes(u.id))), tags: [], today: todayStr() });

    if(!title){ showFieldError($('#as-title'), '给子任务起个名字'); return false; }
    const st = { id:uid('st_'), title, done:false, status:'todo', _prevStatus:'todo',
      assigneeId: $('#as-assignee').value || pr.assigneeId || null,
      dueDate: $('#as-due').value || pr.dueDate || null, startDate:null,
      priority:null, tags:[], followers:[], desc:'', comments:[], recurring:null,
      activities:[{id:uid('a_'), userId:ME.id, text:'创建了子任务', ts:Date.now()}],
      createdAt:Date.now(), createdBy:ME.id };
    t.subtasks.push(st);
    t.activities.push({id:uid('a_'), userId:ME.id, text:`添加了子任务「${title}」`, ts:Date.now()});
    saveDB(); openDrawer(t.id);
    if(st.assigneeId) notify(st.assigneeId, 'subtask_assign', t.id, { subTitle: title });
    if(!keepOpen){ toast('子任务已添加', 'ok'); return true; }

    const inp = $('#as-title'); inp.value = '';
    inp.dispatchEvent(new Event('input', {bubbles:true}));
    inp.focus({preventScroll:true});
    return false;
  };
  /* v1.7.2：默认指派给自己（我是项目成员时）；手选后不回改 */
  {
    const sel = $('#as-assignee'), meOpt = sel && sel.querySelector('option[data-me="1"]');
    if(meOpt) sel.value = meOpt.value;
    if(sel) sel.addEventListener('change', function(){ this.dataset.userPicked = '1'; });
  }
  const asAgain = $('#as-again');
  if(asAgain) asAgain.onclick = ()=>{ commitSub(true); };
  bindDateFieldDisplay(mask);
  $('#as-title').addEventListener('keydown', e=>{
    if(e.key!=='Enter') return;
    e.preventDefault();
    if(e.shiftKey){ commitSub(true); return; }
    const top = MODAL_STACK[MODAL_STACK.length-1];
    const okBtn = top && $('.modal-ok', top);
    if(okBtn) okBtn.click();
  });
  $('#as-title').addEventListener('input', ()=>{
    const r = parseQuickText($('#as-title').value, { users: DB.users.filter(u=>u.active && (P.isAdmin() || memberIds.includes(u.id))), tags: [], today: todayStr() });
    const sel = $('#as-assignee'), due = $('#as-due');
    if(r.assigneeId && !sel.dataset.userPicked && Array.prototype.some.call(sel.options, o=>o.value===r.assigneeId)) sel.value = r.assigneeId;
    if(r.dueDate && due && !due.value){ due.value = r.dueDate; due.dispatchEvent(new Event('input', {bubbles:true})); }
    const bits = [];
    if(r.matched.assignee) bits.push('负责人 ' + esc(r.matched.assignee));
    if(r.matched.date) bits.push('截止 ' + esc(r.dueDate));
    $('#as-parse').innerHTML = bits.length ? '✓ 已识别：' + bits.join(' · ') : '';
  });
}

/*==TEST-BEGIN==*/
/* 归属切换：判定与副作用分开，方便分别设防。
   decideAutoShare 是纯判定（参数化）：
     solo = 名单里只有创建人，不用动 / already = 本来就在共享库
     archived = 归档项目不许搬库 / noperm = 权限不够 / share = 应搬进团队共享库
   背景：个人项目的数据在操作者自己的个人库文件里，服务端只把那份文件发给他本人，
   所以"把同事加进 memberIds"过去会静默失效——同事登录后什么都看不到。
   applyProjectScope / shareProjectIfCollaborating 依赖 saveDB / renderApp / P / ME，
   单测里以桩替换，真实搬库效果另由浏览器 E2E M23 端到端证明。 */
function decideAutoShare(proj, meId, isAdmin){
  if(!proj) return 'solo';
  if(projectScopeOf(proj) === SCOPE_SHARED) return 'already';
  if(!(proj.memberIds || []).some(id => id !== proj.ownerId)) return 'solo';
  if(proj.archived) return 'archived';
  if(!(isAdmin || proj.ownerId === meId)) return 'noperm';
  return 'share';
}
/* 真正执行归属切换：改 scope 后 saveDB() → splitStores 会把项目连同它的任务与通知
   整体搬到另一个物理文件，所以"共享出去"和"收回来自"都是一次原子写盘（两个文件各自加版本）。
   返回切换前的 scope（null = 没变，调用方可据此决定要不要提示/撤销）。 */
function applyProjectScope(proj, scope){
  scope = scope === SCOPE_SHARED ? SCOPE_SHARED : 'personal';
  const prev = projectScopeOf(proj);
  if(prev === scope) return null;
  proj.scope = scope;
  if(!Array.isArray(proj.memberIds)) proj.memberIds = [];
  if(proj.ownerId && !proj.memberIds.includes(proj.ownerId)) proj.memberIds.push(proj.ownerId);
  if(ME && !proj.memberIds.includes(ME.id)) proj.memberIds.push(ME.id);
  saveDB(); renderApp();
  return prev;
}
/* 名单里出现了同事 = 这是个协作项目 → 自动共享给团队（用户选定：不再二次确认）。
   返回状态字符串，调用方据此给不同提示。 */
function shareProjectIfCollaborating(proj){
  const st = decideAutoShare(proj, ME && ME.id, P.isAdmin());
  if(st !== 'share') return st;
  return applyProjectScope(proj, SCOPE_SHARED) !== null ? 'shared' : 'already';
}
/*==TEST-END==*/
/* 带确认框与权限判定的归属切换入口（项目设置里那个按钮走这里） */
function setProjectScope(proj, scope){
  if(!proj) return false;
  /* v1.6 权限修正：收回 = 把项目从共享库搬进「创建者」的个人库文件。此前管理员
     也能收回别人的项目，结果整项目连任务划进管理员自己的个人库，原创建人从此
     任何库里都看不到它（数据跟随了操作者而不是账户）。因此：
     - 收回 → 仅项目创建人本人
     - 共享 → 项目创建人或管理员 */
  const ownerName = (DB.users.find(u=>u.id===proj.ownerId)||{}).name || '项目创建人';
  if(scope !== SCOPE_SHARED){
    if(proj.ownerId !== ME.id){
      return toast('收回会把这个项目搬回「' + ownerName + '」的个人库，只有 TA 本人能执行；管理员请通过成员管理调整协作范围', 'err');
    }
  }else{
    if(!(P.isAdmin() || proj.ownerId === ME.id)) return toast('只有项目创建人或管理员能把项目共享给团队', 'err');
  }
  if(proj.archived) return toast('请先取消归档，再调整项目归属', 'err');
  scope = scope === SCOPE_SHARED ? SCOPE_SHARED : 'personal';
  if(projectScopeOf(proj) === scope) return false;
  const taskCount = tasksOfProject(proj.id).length;
  const going = scope === SCOPE_SHARED
    ? '共享后，项目成员（当前 ' + proj.memberIds.length + ' 人）都能看到并编辑这 ' + taskCount + ' 个任务；项目会进入团队共享库，全员可见。'
    : '收回后，这 ' + taskCount + ' 个任务将只有你能看到——其他成员的项目列表里会消失；项目会写回你的个人库文件。';
  openConfirm({
    title: scope === SCOPE_SHARED ? '共享给团队？' : '收回为个人项目？',
    html: '「' + esc(proj.name) + '」' + (scope === SCOPE_SHARED ? '将变为团队共享项目。' : '将收回为个人项目。') + '\n' + going,
    okText: scope === SCOPE_SHARED ? '共享给团队' : '收回为个人',
    danger: scope !== SCOPE_SHARED,
    onOk: ()=>{
      const prev = applyProjectScope(proj, scope);
      if(prev === null) return;
      toast(scope === SCOPE_SHARED ? '项目已共享给团队' : '项目已收回为个人项目', 'ok',
        { label:'撤销', fn:()=>{ applyProjectScope(proj, prev); } });
    }
  });
  return true;
}

/* 任务级复制：同项目同状态，剥离评论/活动/完成态（任务级复制） */
function duplicateTask(taskId){
  const src = DB.tasks.find(x=>x.id===taskId);
  if(!src) return toast('任务不存在', 'err');
  if(!P.canWriteTask(src)) return toast('只读访客不能复制任务', 'err');
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid('t_');
  copy.title = src.title + '（副本）';
  copy.comments = [];
  copy.subtasks = (src.subtasks||[]).map(st=>Object.assign({}, st, { id:uid('st_'), comments:[], done:false, status:'todo',
    activities:[{id:uid('a_'), userId:ME.id, text:'随主任务复制', ts:Date.now()}] }));
  copy.completed = false; copy.completedAt = null;
  if(copy.status === 'done') copy.status = 'todo';
  copy.followers = (src.followers||[]).slice();
  copy.activities = [{ id:uid('a_'), userId:ME.id, text:`复制自「${src.title}」`, ts:Date.now() }];
  copy.createdAt = Date.now(); copy.createdBy = ME.id;
  copy.order = (Number(src.order) || Date.now()) - 0.5;
  DB.tasks.push(copy);
  saveDB(); renderApp(); openDrawer(copy.id);
  toast('任务已复制，可直接改标题', 'ok', { label:'撤销', fn:()=>{
    DB.tasks = DB.tasks.filter(x=>x.id!==copy.id); saveDB(); closeDrawer(); renderApp();
  }});
  return copy.id;
}

/* ---- 复制项目（轻量模板：连任务带子任务一起复制） ---- */
function duplicateProject(proj){
  const copy = JSON.parse(JSON.stringify(proj));
  copy.id = uid('p_');
  copy.name = proj.name + '（副本）';
  copy.createdAt = Date.now();
  copy.archived = false;
  copy.statusUpdates = [];
  DB.projects.push(copy);
  tasksOfProject(proj.id).forEach(t=>{
    const ct = JSON.parse(JSON.stringify(t));
    ct.id = uid('t_');
    ct.projectId = copy.id;   // v1.3：无分区字段，任务状态随深拷贝原样保留
    ct.comments = [];
    ct.followers = [];
    ct.subtasks = (ct.subtasks||[]).map(s=>({ ...s, id:uid('st_'), comments:[],
      activities:[{id:uid('a_'), userId:ME.id, text:'由项目复制生成', ts:Date.now()}],
      createdAt:Date.now(), createdBy:ME.id }));
    ct.activities = [{id:uid('a_'), userId:ME.id, text:'由项目复制生成', ts:Date.now()}];
    ct.createdAt = Date.now(); ct.createdBy = ME.id;
    DB.tasks.push(ct);
  });
  saveDB();
  nav(`#/project/${copy.id}`);
  /* v1.7：与「复制任务」对齐——复制项目也提供撤销（删除刚生成的副本及其任务） */
  const copiedIds = DB.tasks.filter(t=>t.projectId===copy.id).map(t=>t.id);
  toast('项目已复制（含任务与子任务，评论与项目播报不保留）', 'ok', { label:'撤销', fn:()=>{
    DB.projects = DB.projects.filter(p=>p.id!==copy.id);
    DB.tasks = DB.tasks.filter(t=>!copiedIds.includes(t.id));
    saveDB();
    if(ROUTE.page==='project' && ROUTE.pid===copy.id) nav('#/');
    renderApp(); toast('已撤销项目复制', 'ok');
  }});
}

/* ---- 键盘快捷键：Ctrl+K 命令面板 / Esc 逐层关闭 / / 聚焦搜索 / n 新建项目 / ? 帮助 ---- */
/* 快捷键文案单一来源：帮助面板与首次引导都从这里取，改键只改这里 + 下面的处理函数 */

  { keys:['Shift','Enter'],   desc:'在快速添加/添加子任务里「创建并继续录入下一条」（普通 Enter 是创建并关闭）' },

function keymapRow(k){ return `<tr><td>${k.keys.map(x=>`<kbd>${x}</kbd>`).join(' + ')}</td><td>${k.desc}</td></tr>`; }

/* ---- 命令面板（Ctrl+K）：搜索 + 新建 + 跳转的统一入口，FlowTask 自己的键盘招牌 ---- */
const CMDK = { open:false, sel:0, items:[] };
function cmdkBuild(q){
  const query = (q||'').trim().toLowerCase();
  const items = [];
  const hit = (...keys)=> !query || keys.some(k=>String(k).toLowerCase().includes(query));
  if(hit('添加任务','新建任务','add task','t')) items.push({g:'命令', label:'＋ 添加任务', sub:'快速创建', fn:()=>openQuickAddModal()});
  if(P.canCreateProject() && hit('新建项目','创建项目','new project','p')) items.push({g:'命令', label:'＋ 新建项目', sub:'或按 n', fn:()=>openProjectModal()});
  if(hit('帮助','快捷键','help')) items.push({g:'命令', label:'打开帮助', sub:'或按 ?', fn:()=>openHelpModal()});
  const pages = [['#/','今天'],['#/my-tasks','我的任务'],['#/inbox','通知']];
  if(P.canManageMembers()) pages.push(['#/members','成员管理'],['#/data','数据管理']);
  pages.push(['#/settings','个人设置'],['#/trash','回收站']);
  pages.forEach(([h,name])=>{ if(hit(name)) items.push({g:'跳转', label:name, sub:'', fn:()=>nav(h)}); });
  P.visibleProjects().forEach(p=>{
    if(hit(p.name)) items.push({g:'项目', label:p.name, sub:p.archived?'已归档':'', fn:()=>nav(projectHash(p.id))});
  });
  if(ROUTE.page==='project'){
    const pid = ROUTE.pid;
    [['详情','overview'],['列表','list'],['看板','board'],['日历','calendar'],['排期','gantt']].forEach(([nm,v])=>{
      if(hit('视图',nm)) items.push({g:'当前项目', label:'切换到「'+nm+'」视图', sub:'', fn:()=>nav(`#/project/${pid}/${v}`)});
    });
  }
  if(query){
    DB.tasks.filter(t=>{
      const p = P.visibleProject(t.projectId);
      return p && (t.title.toLowerCase().includes(query) || (t.desc||'').toLowerCase().includes(query));
    }).slice(0,8).forEach(t=>{
      items.push({g:'任务', label:t.title, sub:(projectOf(t)||{}).name||'', fn:()=>openDrawer(t.id)});
    });
  }
  return items.slice(0,40);
}
function cmdkPaint(q){
  CMDK.items = cmdkBuild(q);
  CMDK.sel = 0;
  const list = $('#cmdk-list');
  if(!CMDK.items.length){ list.innerHTML = '<div class="empty-hint" style="padding:18px 14px">没有匹配的命令、项目或任务</div>'; return; }
  let lastG = '';
  list.innerHTML = CMDK.items.map((it,i)=>
    (it.g !== lastG ? (lastG = it.g, `<div class="search-group">${esc(it.g)}</div>`) : '') +
    `<div class="search-item ${i===0?'kb-on':''}" data-cmdk="${i}"><span>${esc(it.label)}</span>${it.sub?`<span class="sub">${esc(it.sub)}</span>`:''}</div>`
  ).join('');
  $$('#cmdk-list [data-cmdk]').forEach(el=>{ el.onclick = ()=> cmdkRun(+el.dataset.cmdk); });
}
function cmdkHighlight(){
  $$('#cmdk-list .search-item').forEach((el,i)=> el.classList.toggle('kb-on', i===CMDK.sel));
  const el = $(`#cmdk-list [data-cmdk="${CMDK.sel}"]`);
  if(el) el.scrollIntoView({block:'nearest'});
}
function cmdkRun(i){
  const it = CMDK.items[i];
  if(!it) return;
  closeCmdk();
  it.fn();
}
function openCmdk(){
  CMDK.open = true;
  $('#cmdk-mask').classList.add('on');

}
function closeCmdk(){

}
$('#cmdk-mask').onclick = closeCmdk;
$('#cmdk-input').addEventListener('input', e=> cmdkPaint(e.target.value));
$('#cmdk-input').addEventListener('keydown', e=>{
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){
    e.preventDefault();
    CMDK.sel = Math.min(Math.max(CMDK.sel + (e.key==='ArrowDown'?1:-1), 0), CMDK.items.length-1);
    cmdkHighlight();
  } else if(e.key==='Enter'){
    e.preventDefault(); cmdkRun(CMDK.sel);
  } else if(e.key==='Escape'){
    e.preventDefault(); e.stopPropagation(); closeCmdk();
  }
});
/* v1.7：拖拽排序的键盘等价路径（F406）——聚焦任务行或侧栏项目后 Alt+↑/↓ 移动 */
function keyboardMoveTask(taskId, dir){
  const t = DB.tasks.find(x=>x.id===taskId);
  const proj = t ? P.visibleProject(t.projectId) : null;
  if(!t || !proj) return;
  if(!P.canWriteTask(t)){ toast(denyWriteTaskMsg(t), 'err'); return; }
  const peers = DB.tasks.filter(x=>x.projectId===proj.id && x.status===t.status)
    .sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0));
  const i = peers.findIndex(x=>x.id===taskId), j = i + dir;
  if(i < 0 || j < 0 || j >= peers.length) return;
  /* 同毫秒创建的两条任务 order 会完全相同，直接交换等于什么都没发生
     （用户按 Alt+↓ 毫无反应，只会认为功能坏了）——相等时强制拉开一个名次 */
  if(peers[i].order === peers[j].order){
    peers[i].order = Number(peers[i].order) + (dir > 0 ? 1 : -1);
  }else{
    const tmp = peers[i].order; peers[i].order = peers[j].order; peers[j].order = tmp;
  }
  saveDB(); renderApp();
  setTimeout(()=>{ const row = document.querySelector('.task-row[data-task="'+taskId+'"]'); if(row) row.focus(); }, 0);
}
function keyboardMoveProject(pid, dir){
  const seq = DB.projects.slice().sort((a,b)=> projOrderOf(a.id) - projOrderOf(b.id)).map(p=>p.id);
  const i = seq.indexOf(pid), j = i + dir;
  if(i < 0 || j < 0 || j >= seq.length) return;
  moveProjectOrder(DB.projects, pid, seq[j]);   // 放到邻居之前：向上=原邻居前，向下=下方邻居前
  renderApp();
  setTimeout(()=>{ const el = document.querySelector('.proj-item[data-pid="'+pid+'"]'); if(el) el.focus(); }, 0);
}
document.addEventListener('keydown', (e)=>{
  if(!ME) return;
  const tag = (e.target.tagName||'').toLowerCase();
  const typing = tag==='input' || tag==='textarea' || tag==='select' || e.target.isContentEditable;
  // Ctrl+K / Cmd+K：任何状态下呼出命令面板（含输入中）；已打开时再按一次收起
  if((e.ctrlKey||e.metaKey) && (e.key==='k'||e.key==='K')){
    e.preventDefault();
    if(CMDK.open) closeCmdk(); else openCmdk();
    return;
  }
  // Esc：逐层关闭 命令面板 → popover → 栈顶弹窗（含未保存守卫）→ 抽屉 → 退出多选
  if(e.key==='Escape'){
    if(CMDK.open){ closeCmdk(); return; }
    if($('#popover')){ removePopover(); return; }
    if(MODAL_STACK.length){ closeTopModal(false); return; }
    if($('#drawer').classList.contains('on')){ closeDrawer(); return; }
    /* v1.6：批量条承诺「退出多选（Esc）」但处理链里没有这一层——补上 */
    if(MULTI && MULTI.on){
      MULTI = { on:false, ids:new Set() };
      removeBatchBar();
      if(ROUTE.page==='project') renderApp();
      return;
    }
    return;
  }
  if(typing) return;
  /* v1.7：Alt+↑/↓ 键盘排序（拖拽的键盘等价路径） */
  if(e.altKey && (e.key==='ArrowUp' || e.key==='ArrowDown')){
    const el = document.activeElement;
    if(el && el.classList){
      if(el.classList.contains('task-row') && el.dataset.task){
        e.preventDefault(); keyboardMoveTask(el.dataset.task, e.key==='ArrowUp' ? -1 : 1); return;
      }
      if(el.classList.contains('proj-item') && el.dataset.pid){
        e.preventDefault(); keyboardMoveProject(el.dataset.pid, e.key==='ArrowUp' ? -1 : 1); return;
      }
    }
    return;
  }
  // /：聚焦搜索
  if(e.key==='/'){ e.preventDefault(); $('#search-input').focus({preventScroll:true}); }
  // n：新建项目
  if(e.key==='n' && P.canCreateProject()){ openProjectModal(); }
  // ?：打开应用内帮助（快捷键 / 数据与备份 / 权限 / 分享）
  if(e.key==='?'){ e.preventDefault(); openHelpModal(); }
});

/* ============ 顶部搜索（防抖 + 深度匹配 + 键盘导航） ============ */
function initSearch(){
  const input = $('#search-input'), dd = $('#search-dropdown');
  let _deb = null, _kbIdx = -1;

  const bindItems = ()=>{
    $$('#search-dropdown .search-item[data-nav], #search-dropdown .search-item[data-task]').forEach(el=>{
      el.onclick = ()=>{
        if(el.dataset.nav) nav(el.dataset.nav);
        if(el.dataset.task) openDrawer(el.dataset.task);
        dd.classList.remove('on'); input.value='';
      };
    });
  };
  const kbItems = ()=> $$('#search-dropdown .search-item[data-nav], #search-dropdown .search-item[data-task]');
  const kbSet = (i)=>{
    const items = kbItems();
    if(!items.length) return;
    _kbIdx = (i + items.length) % items.length;
    items.forEach((el,k)=>el.classList.toggle('kb-on', k===_kbIdx));
    items[_kbIdx].scrollIntoView({block:'nearest'});
  };

  const runSearch = ()=>{
    _kbIdx = -1;
    const q = input.value.trim().toLowerCase();
    if(!q){ dd.classList.remove('on'); dd.innerHTML=''; return; }
    const projAll = P.visibleProjects().filter(p=>p.name.toLowerCase().includes(q));
    const projs = projAll.slice(0,4);
    const taskAll = DB.tasks.filter(t=>{
      const p = projectOf(t);
      if(!p || !(P.canSeeProject(p))) return false;
      if(t.title.toLowerCase().includes(q)) return true;
      if(String(t.desc||'').toLowerCase().includes(q)) return true;
      return (t.subtasks||[]).some(s=>String(s.title||'').toLowerCase().includes(q) || String(s.desc||'').toLowerCase().includes(q));
    });
    const tasks = taskAll.slice(0,8);
    const more = (projAll.length - projs.length) + (taskAll.length - tasks.length);
    if(!projs.length && !tasks.length){
      dd.innerHTML = '<div class="search-item search-none">没有匹配的任务或项目<button class="link-btn" data-search-clear>清除关键词</button></div>';
    }else{
      dd.innerHTML = (projs.length?`<div class="search-group">项目</div>` + projs.map(p=>`
        <div class="search-item" data-nav="${projectHash(p.id)}"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:${safeColor(p.color)}"></span>${esc(p.name)}
        <span class="sub">${DB.tasks.filter(t=>t.projectId===p.id&&!t.completed).length} 项未完成</span></div>`).join(''):'')
      + (tasks.length?`<div class="search-group">任务</div>` + tasks.map(t=>{
        const p = projectOf(t);
        const asg = DB.users.find(u=>u.id===t.assigneeId);
        return `<div class="search-item" data-task="${t.id}" title="${t.completed?'已完成':'当前：'+statusName(t.status)}">${t.completed?'✓':'○'} ${esc(t.title)}
          <span class="sub">${esc(p?p.name:'')} ${asg?'· '+esc(asg.name):''}</span></div>`;
      }).join(''):'')
      + (more ? `<div class="search-more">另有 ${more} 条未列出，可继续输入缩小范围</div>` : '');
    }
    const clr = $('[data-search-clear]', dd);
    if(clr) clr.onclick = ()=>{ input.value=''; dd.classList.remove('on'); dd.innerHTML=''; input.focus(); };
    dd.classList.add('on');
    bindItems();
  };

  input.addEventListener('input', ()=>{ clearTimeout(_deb); _deb = setTimeout(runSearch, 200); });
  input.addEventListener('keydown', e=>{
    if(!dd.classList.contains('on')) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); kbSet(_kbIdx+1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); kbSet(_kbIdx-1); }
    else if(e.key==='Enter'){
      e.preventDefault();
      const items = kbItems();
      const el = items[_kbIdx] || items[0];
      if(el) el.click();
    }
    else if(e.key==='Escape'){ dd.classList.remove('on'); input.blur(); }
  });
  document.addEventListener('click', e=>{
    if(!e.target.closest('#global-search')) dd.classList.remove('on');
  });
}

      <button class="menu-item" data-nav="#/settings">⚙ 个人设置</button>
      ${P.isAdmin()?`<button class="menu-item" data-nav="#/members">👥 成员管理</button>
      <button class="menu-item" data-nav="#/data">🗄 数据管理</button>`:''}
      <div class="menu-sep"></div>
      <button class="menu-item danger" id="logout-btn">⏏ 退出登录</button>`;
    menu.classList.add('on');
    const r = chip.getBoundingClientRect();
    menu.style.top = (r.bottom + 8) + 'px';
    menu.style.left = Math.max(8, r.right - menu.offsetWidth) + 'px';
    $$('#user-menu [data-nav]').forEach(b=>b.onclick=()=>{ menu.classList.remove('on'); nav(b.dataset.nav); });
    $('#logout-btn').onclick = ()=>{ menu.classList.remove('on'); logout(); };
  };
  chip.onclick = (e)=>{ e.stopPropagation(); menu.classList.contains('on') ? menu.classList.remove('on') : open(); };
  $('#notif-btn').onclick = ()=>nav('#/inbox');
  $('#help-btn').onclick = ()=>openHelpModal();
  $('#side-toggle').onclick = ()=>document.body.classList.toggle('side-open');
  const qaBtn = $('#quick-add-btn');
  if(qaBtn) qaBtn.onclick = ()=>openQuickAddModal(ROUTE.page==='project' ? ROUTE.pid : null);
  document.addEventListener('click', e=>{ if(!e.target.closest('#user-menu')) menu.classList.remove('on'); });
}

/* ============================================================
   v1.9 账号管理 · 改密与重置一律走服务端
   ------------------------------------------------------------
   自 v1.6 起账户表读取脱敏（页面拿不到 salt/passHash），所以「在页面里比对
   passHash」这条老路在存储服务模式下必然返回「当前密码错误」——改密只能由
   服务端做：challenge 拿盐 → 算旧证明 → /api/changepw 写新哈希。
   管理员重置同理，且重置后强制对方首登改密。
   ============================================================ */
async function authChallenge(username){
  try{
    const r = await fetch(STORE_SVC + '/api/auth-challenge?username=' + encodeURIComponent(username),
      { cache:'no-store', headers: storeHeaders() });
    if(!r.ok) return null;
    const j = await r.json().catch(()=>null);
    return (j && j.salt) ? j : null;
  }catch(e){ logSoft('登录挑战失败', e); return null; }
}
async function computeVerifier(algo, password, salt){
  return algo === 'legacy' ? await legacyHash(password, salt) : await hashPassword(password, salt);
}
/* 本人改密：返回 null 表示成功，字符串是给人看的失败原因 */
async function changeOwnPassword(oldPw, newPw){
  if(!SVC_MODE){
    if(!(await verifyPassword(ME, oldPw))) return '当前密码错误';
    ME.salt = uid('s_'); ME.passHash = await hashPassword(newPw, ME.salt);
    ME.pwMustChange = false; saveAuth(); return null;
  }
  const ch = await authChallenge(ME.username);
  if(!ch) return '服务没有认出这个账户，请刷新后重试';
  const oldVerifier = await computeVerifier(ch.algo, oldPw, ch.salt);
  const newSalt = uid('s_');
  const newHash = await hashPassword(newPw, newSalt);
  let r;
  try{
    r = await fetch(STORE_SVC + '/api/changepw', {
      method:'POST', cache:'no-store',
      headers: Object.assign({ 'Content-Type':'application/json' }, storeHeaders()),
      body: JSON.stringify({ oldVerifier, newSalt, newHash })
    });
  }catch(e){ return '存储服务没有响应，密码未修改'; }
  if(r.status === 401) return '当前密码不正确';
  if(r.status === 403){ expireSession(); return '登录状态已失效，请重新登录'; }
  if(!r.ok) return '修改失败（存储服务回了 ' + r.status + '），密码未改动';
  await loadAccounts();                       // 服务端已改表并重开 rev，本地必须重取
  const me2 = AUTH && AUTH.users.find(u => u.id === ME.id);
  if(me2){ me2.pwMustChange = false; ME = me2; }
  return null;
}
/* 管理员重置他人密码：重置后对方下次登录被要求改密 */
async function adminResetPassword(user, newPw){
  if(!P.isAdmin()) return '只有管理员可以重置他人密码';
  const newSalt = uid('s_');
  const newHash = await hashPassword(newPw, newSalt);
  if(!SVC_MODE){
    user.salt = newSalt; user.passHash = newHash; user.pwMustChange = true; saveAuth(); return null;
  }
  let r;
  try{
    r = await fetch(STORE_SVC + '/api/resetpw', {
      method:'POST', cache:'no-store',
      headers: Object.assign({ 'Content-Type':'application/json' }, storeHeaders()),
      body: JSON.stringify({ uid: user.id, newSalt, newHash })
    });
  }catch(e){ return '存储服务没有响应，密码未重置'; }
  if(r.status === 403) return '只有管理员可以重置他人密码';
  if(r.status === 404) return '这个账户已经不存在了';
  if(!r.ok) return '重置失败（存储服务回了 ' + r.status + '），密码未改动';
  await loadAccounts();
  return null;
}
/* 首登改密引导：可取消（不许把人锁在门外），但提示常驻，改完才消失 */
function openMustChangePwModal(){
  if(!ME || !ME.pwMustChange) return;
  openModal('先改一下密码', `
    <p class="cf-lead">这个账号还在用管理员给的初始口令。初始口令容易被猜到，
      请先换成只有你知道的密码（至少 6 位）。现在不改也能用，但这条提示会一直在。</p>
    <div class="field"><label for="mc-pw0">当前初始密码</label><input id="mc-pw0" type="password" autocomplete="current-password"></div>
    <div class="field"><label for="mc-pw1">新密码（至少6位）</label><input id="mc-pw1" type="password" autocomplete="new-password"></div>
    <div class="field"><label for="mc-pw2">确认新密码</label><input id="mc-pw2" type="password" autocomplete="new-password"></div>`,
    async ()=>{
      const o = $('#mc-pw0').value, n1 = $('#mc-pw1').value, n2 = $('#mc-pw2').value;
      if(!o) return showFieldError($('#mc-pw0'), '请输入管理员给你的初始密码'), false;
      if(n1.length < 6) return showFieldError($('#mc-pw1'), '新密码至少 6 位'), false;
      if(n1 !== n2) return showFieldError($('#mc-pw2'), '两次输入的密码不一致'), false;
      const err = await changeOwnPassword(o, n1);
      if(err) return showFieldError($('#mc-pw0'), err), false;
      toast('密码已修改，只有你知道了', 'ok');
      renderApp();
      return true;
    }, '修改密码');
}

/* ============ 登录/注册 UI ============ */
let AUTH_MODE = 'login';
function renderAuthMode(){
  /* 账号由管理员开通时不露注册入口——服务端同样会拒，露出来只是给人一条必然失败的路 */
  const regClosed = (_openRegistration === false);
  if(regClosed && AUTH_MODE === 'register'){ AUTH_MODE = 'login'; }
  $('#login-form').style.display = AUTH_MODE==='login'?'block':'none';
  $('#register-form').style.display = (AUTH_MODE==='register' && !regClosed)?'block':'none';
  $('#auth-sub').textContent = AUTH_MODE==='login'
    ? '本地团队项目管理 · 数据按账户存在本机 JSON 文件' + (SVC_MODE ? '' : '（未启动存储服务，暂存浏览器）')
    : '注册首个账户将成为管理员；后续注册默认为成员';
  const sw = $('#auth-switch');
  if(sw) sw.innerHTML = regClosed
    ? '<span style="color:var(--text-faint)">账号由管理员开通；忘记密码请找管理员重置</span>'
    : (AUTH_MODE==='login'
        ? '还没有账户？<a href="javascript:void 0" id="go-register">注册新用户</a>'
        : '已有账户？<a href="javascript:void 0" id="go-login">返回登录</a>');
  const g = $('#go-register'), l = $('#go-login');
  if(g) g.onclick = ()=>{ AUTH_MODE='register'; renderAuthMode(); };
  if(l) l.onclick = ()=>{ AUTH_MODE='login'; renderAuthMode(); };
}
function startEmptyStore(){
  DB = emptyStore({ tags: [], savedFilters: [], meta:{ rev:0 } });
  DB.users = (AUTH && AUTH.users) || [];
  _revs.personal = 0; _revs.shared = 0;
  _wrote.personal = ''; _wrote.shared = '';
  migrateData();
}
/* 账户表可能已经存在（比如从旧版升级），但旧版单文件里的任务数据还没搬进任何个人库：
   此时必须惰性地把它读出来，否则用户会觉得"升级后项目没了"。 */
async function ensureLegacyDataLoaded(){
  if(_legacyData) return true;
  if(!SVC_MODE) return false;
  const legacy = await readStoreJSON(LEGACY_FILE);
  if(legacy.ok && legacy.data && Array.isArray(legacy.data.tasks) &&
     ((legacy.data.projects || []).length || (legacy.data.tasks || []).length)){
    _legacyData = legacy.data;
    return true;
  }
  return false;
}

/* 旧版单文件 → 个人库的迁移按"项目创建人"分配：
   谁的项目进谁的个人库，先登录的人不会把别人的数据整体认领走。
   原文件始终不改，因此每个账户首次登录时都能各自认领自己那一份。 */
function adoptLegacyData(user){
  const L = _legacyData;
  if(!L) return false;
  const alive = new Set(((AUTH && AUTH.users) || []).map(u => u.id));
  const mine = (L.projects || []).filter(p => p.ownerId === user.id ||
    (P.isAdmin() && !alive.has(p.ownerId)));          // 创建人已不存在的孤儿项目归管理员
  if(!mine.length) return false;
  const ids = new Set(mine.map(p => p.id));
  DB.users = (AUTH && AUTH.users) || [];
  if(!(DB.tags || []).length) DB.tags = L.tags || DEFAULT_TAGS();
  mine.forEach(p => { p.scope = 'personal'; DB.projects.push(p); });
  (L.tasks || []).filter(t => ids.has(t.projectId)).forEach(t => DB.tasks.push(t));
  (L.notifications || []).filter(n => !n.projectId || ids.has(n.projectId)).forEach(n => DB.notifications.push(n));
  if(L.trash){
    L.trash.tasks.forEach(t => { if(ids.has(t.projectId)) DB.trash.tasks.push(t); });
    L.trash.projects.forEach(p => { if(ids.has(p.id)) DB.trash.projects.push(p); });
  }
  if(!DB.meta) DB.meta = {};
  DB.meta.migratedFrom = LEGACY_FILE; DB.meta.migratedAt = Date.now();
  saveDB();
  const left = (L.projects || []).length - mine.length;
  toast('已把旧版数据中属于你的 ' + mine.length + ' 个项目迁入个人库'
    + (left ? '；另有 ' + left + ' 个项目属于其他账户，他们首次登录时会各自认领' : '')
    + '。原文件保持不动，可随时删', 'ok');
  return true;
}
async function showAuthPage(){
  $('#app').classList.remove('on');
  $('#auth-page').style.display = 'flex';
  renderAuthMode();
  /* v1.6：file:// 兜底模式的「演示账户（首次打开自动创建）」此前自相矛盾——
     没账户就登不进去，登不进去就不会走到创建账户的代码。现在展示登录页前补种 */
  if(!SVC_MODE && AUTH && !AUTH.users.length){
    await ensureDemoAccounts();
    renderAuthMode();
  }
}
async function enterApp(user){
  ME = user;
  const ok = await establishSession(user);
  if(!ok){
    ME = null;
    toast('登录状态建立失败：存储服务没有接受本次会话，请重试', 'err');
    showAuthPage();
    return false;
  }
  if(SVC_MODE){
    const loaded = await loadMyStores();
    if(loaded.loadFailed){ ME = null; showAuthPage(); return false; }   // 数据没读到就绝不进入空应用
    if(loaded.authExpired) return false;
    if(loaded.personalMissing){                           // 判据是"个人库文件还不存在"，
      await ensureLegacyDataLoaded();                     // 而不是"一个项目都看不到"
      if(_legacyData){
        adoptLegacyData(user);                            // 只认领属于自己的那一份
      } else if(user.username === 'admin' && !DB.projects.length){
        await seedDemoContent();                          // 全新安装：演示账户自带演示内容
      }
    }
  }else{
    if(!loadLocalFor(user.id)) startEmptyStore();
    DB.users = (AUTH && AUTH.users) || [];
    if(!AUTH.users.length) await ensureDemoAccounts();
  }
  migrateData();
  $('#auth-page').style.display = 'none';
  $('#app').classList.add('on');
  if(!location.hash) location.hash = startHash();
  ROUTE = parseRoute();
  renderApp();
  maybeShowWelcome();
  refreshSyncStatus(); startSyncWatch();     // 没配共享盘时顶栏不会出现这个按钮
  /* 初始口令还没换掉的人：每次进入都引导一次，改完就不再出现。
     不做强阻塞——把人锁在门外会让 TA 直接绕开这套系统去用Excel */
  if(ME.pwMustChange) setTimeout(()=>{ try{ openMustChangePwModal(); }catch(e){ logSoft('首登改密引导未弹出', e); } }, 500);
  return true;
}
/* 首次进入给一次引导，之后不再打扰（随时可用顶栏「?」或按 ? 打开帮助） */
function maybeShowWelcome(){
  let seen = true;
  try{ seen = !!localStorage.getItem('flowtask_welcomed'); }catch(e){ seen = true; }
  if(seen) return;
  try{ localStorage.setItem('flowtask_welcomed', String(Date.now())); }catch(e){}
  openModal('欢迎用 FlowTask 管任务', `
    <ol class="help-ul" style="padding-left:20px;margin-bottom:12px">
      <li>先在左侧 <b>项目 → ＋</b> 建一个项目（或按 <kbd>n</kbd>）。</li>
      <li>按 <kbd>Ctrl</kbd>+<kbd>K</kbd> 呼出命令面板：建任务、找项目、切视图都从这里走；点开任务可以指派、加子任务和评论。</li>
      <li>数据${SVC_MODE ? '按账户实时写入本机的 JSON 文件，并每 10 分钟自动备份' : '目前只存在这台电脑的浏览器里；双击 <code>FlowTask</code> 快捷方式（或 <code>启动存储服务.bat</code>）就能改存成本地文件'}。</li>
    </ol>
    <p class="help-note">快捷键、权限差异、回收站与冲突副本的说明都在「?」帮助里。</p>
  `, ()=>true, '开始使用', '', null);
}
async function initAuth(){
  renderAuthMode();
  $('#login-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    if(btn && btn.disabled) return;                       // 哈希计算期间忽略重复提交
    if(btn){ btn.disabled = true; btn.textContent = '登录中…'; }
    $('#login-err').textContent = '';
    let r;
    try{ r = await login($('#li-username').value, $('#li-password').value); }
    finally{ if(btn){ btn.disabled = false; btn.textContent = '登 录'; } }
    if(typeof r === 'string'){ $('#login-err').textContent = r; return; }
    enterApp(r);
  });
  $('#register-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    if(btn && btn.disabled) return;
    $('#register-err').textContent = '';
    if($('#rg-password').value !== $('#rg-password2').value){
      $('#register-err').textContent = '两次输入的密码不一致'; return;
    }
    if(btn){ btn.disabled = true; btn.textContent = '注册中…'; }
    let r;
    try{ r = await register($('#rg-username').value, $('#rg-name').value, $('#rg-password').value); }
    finally{ if(btn){ btn.disabled = false; btn.textContent = '注 册'; } }
    if(typeof r === 'string'){ $('#register-err').textContent = r; return; }
    toast('注册成功，已自动登录' + (r.role==='admin'?'（管理员）':''));
    enterApp(r);
  });
}

/* ============ 启动 ============ */
(async function boot(){
  loadConflictCopies();
  loadUI();
  try{ localStorage.removeItem(OLD_SESSION_KEY); }catch(e){}        // v1.4 的裸 uid 会话不再有效

  // 1) 探测存储服务（最多 ~1.5s），再取页面令牌
  await probeStoreSvc();
  if(SVC_MODE) await ensureSvcToken();

  // 2) 账户表（未登录也只能拿到账户表，拿不到任何人的数据）
  const authReady = await loadAccounts();

  initSearch(); initUserMenu(); initAuth();

  // 3) 有有效会话就自动进入，否则停在登录页
  document.body.classList.remove('booting');
  const user = authReady ? currentSessionUser() : null;
  if(user && await verifySessionWithServer()){
    await enterApp(user);
  }else{
    clearSessionLocal();
    showAuthPage();
    updateStoreStatus();
  }

  console.log('%c FlowTask 已就绪 ', 'background:#0F766E;color:#fff;border-radius:4px;padding:2px 6px',
    SVC_MODE ? ('存储服务在线（账户表 + 个人库 + 共享库，服务版本 ' + (_svcVersion || '?') + '）')
             : '未检测到存储服务：数据仅存于浏览器缓存，双击「启动存储服务.bat」可改存本地文件');
})();</script>
