<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src http://127.0.0.1:5178; base-uri 'none'; form-action 'none'">
<title>FlowTask · 本地项目管理平台</title>
<style>
/* ============ 设计变量 ============ */
:root{
  --brand:#0F766E;            /* 深青主色：本地优先的沉稳基调（v2.0 品牌重置） */
  --brand-dark:#0B5D56;
  --brand-light:#E9F2F0;
  --bg:#ffffff;
  --bg-sub:#f7f8fa;
  --bg-hover:#f2f3f5;
  --border:#e2e4e8;
  --border-strong:#c9ccd2;
  --text:#1f2430;
  --text-sub:#6b7280;
  --text-faint:#747d8a;   /* v1.6：#9aa1ac 白底仅 ≈2.6:1，大量 11px 小字读不清 → 提到 ≈4.6:1 */
  --green:#2e9e5b;
  --green-light:#e7f6ed;
  --orange:#e8850c;
  --orange-light:#fdf3e3;
  --blue:#3b82f6;
  --blue-light:#eaf2fe;
  --red:#dc2626;
  --purple:#8b5cf6;
  --teal:#14b8a6;
  --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 12px 32px rgba(16,24,40,.14),0 2px 8px rgba(16,24,40,.08);
  --radius:8px;
  --radius-sm:4px;
  --radius-lg:12px;
  --radius-pill:999px;
  /* 状态语义色板（唯一真相源：行内 pill / 选择器 / 小圆点 / 看板列头 / 日历 / 甘特 全部引用这里） */
  --st-todo-fg:#57616f;   --st-todo-bg:#eef1f5;   --st-todo-dot:#c3c9d3;
  --st-doing-fg:#b45309;  --st-doing-bg:#fdf3e3;  --st-doing-dot:#e8850c;
  /* 已暂停：刻意搁置但不算完成。用去饱和的蓝灰，与「进行中」的琥珀、优先级的红区分开 */
  --st-paused-fg:#475569; --st-paused-bg:#e9edf3; --st-paused-dot:#8494ab;
  --st-done-fg:#1e7a43;   --st-done-bg:#e7f6ed;   --st-done-dot:#2e9e5b;
  /* 优先级语义色板（与状态色刻意区隔：优先级只用于"左侧色条 + 文字"，不用实心填充） */
  --prio-high-fg:#b91c1c; --prio-high-bg:#fdecec; --prio-high-bar:#dc2626;
  --prio-med-fg:#b45309;  --prio-med-bg:#fdf3e3;  --prio-med-bar:#e8850c;
  --prio-low-fg:#1d4ed8;  --prio-low-bg:#eaf2fe;  --prio-low-bar:#3b82f6;
  /* 字阶 */
  --fs-xs:11px; --fs-sm:12.5px; --fs-base:13.5px; --fs-md:15px; --fs-lg:19px; --fs-xl:24px;
  --sidebar-w:248px;
  --detail-w:480px;
  --topbar-h:52px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none;scroll-behavior:auto}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
::placeholder{color:var(--text-faint)}
a{color:var(--blue);text-decoration:none}
svg{display:block;flex-shrink:0}

/* ============ 通用控件 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 14px;border-radius:6px;font-weight:600;font-size:13px;
  border:1px solid transparent;transition:all .15s;white-space:nowrap;
}
.btn-primary{background:var(--brand-dark);color:#fff}  /* 主按钮恒取 --brand-dark：#0F766E 白字 ≈4.9:1 已达 AA，深一档更稳 */
.btn-primary:hover{background:var(--brand-dark)}
.btn-ghost{color:var(--text-sub)}
.btn-ghost:hover{background:var(--bg-hover);color:var(--text)}
.btn-outline{border-color:var(--border-strong);color:var(--text)}
.btn-outline:hover{background:var(--bg-hover)}
.btn-danger{background:#fdecec;color:var(--red)}
.btn-danger:hover{background:#f9d4d4}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-icon{padding:6px;border-radius:6px;color:var(--text-sub)}
.btn-icon:hover{background:var(--bg-hover);color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:13px;font-weight:600;color:var(--text-sub)}
.field input,.field select,.field textarea{
  border:1px solid var(--border-strong);border-radius:6px;padding:8px 12px;background:#fff;
  transition:border .15s;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.14)}
.field textarea{resize:vertical;min-height:80px}
/* 行内校验错误态 */
.field input.fld-err,.field select.fld-err,.field textarea.fld-err{border-color:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.1)}
.fld-err-tip{font-size:12px;color:var(--red);font-weight:600;display:flex;align-items:center;gap:5px}
.fld-err-tip::before{content:"!";display:inline-flex;width:14px;height:14px;border-radius:50%;background:var(--red);color:#fff;
  font-size:10px;font-weight:800;align-items:center;justify-content:center;flex-shrink:0}
.modal-ok:disabled{opacity:.65;cursor:progress}
.home-stats{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.home-stats .hs-over{color:var(--red)}
.home-primary{margin-bottom:18px;border-color:#cfe0dc}
.home-sub{font-size:11.5px;font-weight:800;letter-spacing:.4px;color:var(--text-faint);margin:10px 0 4px}
.home-sub:first-of-type{margin-top:2px}
.home-sub-over{color:var(--red)}
.empty-hint{display:block;font-size:12px;color:var(--text-faint);margin-top:6px;font-weight:400}
.pref-hint{font-size:11.5px;color:var(--text-faint);line-height:1.5}
.pref-note{font-size:11.5px;color:var(--text-faint);margin:6px 0 0;line-height:1.6}
.proj-bar{flex:1;max-width:180px;height:5px;border-radius:3px;background:var(--bg-hover);overflow:hidden;margin:0 10px}
.proj-bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.qa-parse{font-size:12px;color:var(--green);min-height:16px;line-height:1.5}
.qa-parse .qa-tip{color:var(--text-faint)}
/* 启动骨架：探测本地存储服务期间（最长 1.5s）不闪登录页，也不留纯白屏 */
#boot-skeleton{display:none;position:fixed;inset:0;z-index:1200;background:var(--bg);gap:0}
body.booting #boot-skeleton{display:flex}
body.booting #auth-page{display:none !important}
.sk-side{width:var(--sidebar-w);flex-shrink:0;border-right:1px solid var(--border);padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.sk-main{flex:1;padding:34px 40px;display:flex;flex-direction:column;gap:16px}
.sk-side i,.sk-main b,.sk-cards u{display:block;height:12px;border-radius:6px;background:var(--bg-hover);animation:skpulse 1.15s ease-in-out infinite}
.sk-main b{height:20px;width:38%}
.sk-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:10px}
.sk-cards u{height:76px;border-radius:var(--radius)}
@keyframes skpulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.sk-side i,.sk-main b,.sk-cards u{animation:none}}

/* ============ 可达性与触控（阶段 F） ============ */
/* 键盘可达：div/span 型可点元素补焦点环；按压有回音 */
[role="button"]:focus-visible,.task-row:focus-visible,.board-card:focus-visible,.mini-task:focus-visible,
.search-item:focus-visible,.notif-item:focus-visible,.proj-item:focus-visible,.nav-item:focus-visible,
.view-tab:focus-visible,.f-chip:focus-visible,.tag-chip:focus-visible,.check-circle:focus-visible,
.mood-btn:focus-visible,.help-tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:var(--radius-sm)}
[role="button"]:active,.task-row:active,.board-card:active,.nav-item:active,.proj-item:active,
.f-chip:active,.tag-chip:active,.view-tab:active{transform:translateY(1px)}
/* 小控件扩大点击热区（视觉尺寸不变，用伪元素撑到 ≥28px） */
.check-circle{position:relative}
.check-circle::before{content:"";position:absolute;inset:-7px}
.sec-actions .btn-icon{position:relative}
.sec-actions .btn-icon::before{content:"";position:absolute;inset:-6px}
.status-pill,.prio-pill{position:relative}
.status-pill::before,.prio-pill::before{content:"";position:absolute;inset:-5px -3px}
.cal-more{min-height:26px}
.side-toggle{display:none}
/* 窄屏：侧栏改为抽屉式，内容占满宽度 */
@media (max-width:900px){
  #sidebar{position:fixed;left:0;top:var(--topbar-h);bottom:0;z-index:640;width:270px;
    transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow-lg)}
  body.side-open #sidebar{transform:none}
  /* 收起状态的抽屉/侧栏会溢出到视口外，窄屏下裁掉以免撑大移动端布局视口 */
  html,body{overflow-x:clip}
  body.side-open::after{content:"";position:fixed;inset:var(--topbar-h) 0 0;background:rgba(20,24,32,.4);z-index:630}
  .side-toggle{display:inline-flex}
  #topbar{gap:8px;padding:0 10px}
  #topbar .logo-mini{min-width:auto}
  #global-search{min-width:0;flex:1}
  #drawer{width:min(480px,100vw)}
  .store-status{padding:4px 8px}
}
@media (max-width:640px){
  #topbar{gap:6px;padding:0 8px}
  #topbar .logo-mini{min-width:0}
  #topbar .logo-name{display:none}
  #quick-add-btn{display:none}
  .user-chip #topbar-username,.user-chip .chev{display:none}
  .user-chip{padding-left:4px;padding-right:4px}
  .store-status{font-size:var(--fs-xs);padding:4px 7px;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #global-search{max-width:none}
  .home-grid,.ov-stats{grid-template-columns:1fr !important}
  .field-row2{grid-template-columns:1fr}
  .content-inner{padding-left:16px !important;padding-right:16px !important}
  .stat-cards{flex-wrap:wrap}
  .stat-card{min-width:120px}
}
/* 空态与筛选态 */
.group-empty,.board-col-empty{display:flex;align-items:center;gap:10px;justify-content:flex-start;
  font-size:12.5px;color:var(--text-faint);padding:14px 12px;background:var(--bg-sub);border:1px dashed var(--border);border-radius:var(--radius)}
.board-col-empty{justify-content:center;padding:20px 10px}
.link-btn{background:none;border:none;color:var(--brand);font-weight:700;font-size:12.5px;cursor:pointer;padding:0 2px;text-decoration:underline}
.link-btn:hover{color:var(--brand-dark)}
.scope-badge{font-size:10px;opacity:.75;flex-shrink:0;margin-left:4px}
#sidebar .proj-item{display:flex;align-items:center}
.proj-item .scope-badge{margin-left:auto}
.f-chip .sf-del{margin-left:5px;font-weight:800;color:var(--text-faint);cursor:pointer}
.f-chip .sf-del:hover{color:var(--red)}
.f-chip.f-save{border-style:dashed;color:var(--text-sub)}
.f-chip.f-save:hover{border-color:var(--brand);color:var(--brand)}
.search-none{color:var(--text-faint);cursor:default}
.search-more{padding:8px 12px;font-size:11.5px;color:var(--text-faint);border-top:1px solid var(--border)}
/* 应用内帮助 */
.help-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.modal-head h3 .hp-ver{font-size:11px;font-weight:700;color:var(--text-faint);margin-left:6px;vertical-align:2px}
.help-tab{border:1px solid var(--border);background:#fff;color:var(--text-sub);border-radius:var(--radius-pill);
  padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.help-tab.on{background:var(--text);color:#fff;border-color:var(--text)}
.help-p{font-size:13px;line-height:1.8;color:var(--text);margin:0 0 10px}
.help-ul{margin:0 0 10px;padding-left:18px;font-size:12.5px;line-height:1.85;color:var(--text-sub)}
.help-note{font-size:12px;color:var(--text-faint);margin:0;line-height:1.6}
.help-warn{font-size:12.5px;color:var(--orange);background:var(--orange-light);border-radius:var(--radius);padding:9px 12px;line-height:1.6;margin:0 0 10px}
.help-table{width:100%;border-collapse:collapse;font-size:12.5px}
.help-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text-sub)}
.help-table td:first-child{white-space:nowrap;width:1%;color:var(--text)}
kbd{border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;background:var(--bg-sub);
  padding:1px 6px;font-size:11px;font-family:inherit;font-weight:700;color:var(--text)}
.sec-preset{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;cursor:pointer;
  border:1.5px solid var(--border);background:#fff;color:var(--text-sub);font-size:12.5px;font-weight:600;
  transition:all .15s;
}
.sec-preset:hover{border-color:var(--brand);color:var(--brand-dark);background:var(--brand-light)}
.sec-preset.on{border-color:var(--brand);background:var(--brand-light);color:var(--brand-dark)}
.sec-preset .sp-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.member-chip{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:20px;
  padding:4px 12px 4px 5px;cursor:pointer;background:#fff;transition:all .15s;font-size:12.5px;
}
.member-chip:hover{border-color:var(--brand)}
.member-chip.on{background:var(--brand-light);border-color:var(--brand)}
.member-chip .avatar{width:22px;height:22px;font-size:10px}
.member-chip b{font-weight:600}
.member-chip .sub{color:var(--text-faint);font-size:11px}
.avatar{
  width:28px;height:28px;border-radius:50%;color:#fff;display:inline-flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;
  user-select:none;
}
.avatar-stack{display:flex}
.avatar-stack .avatar{margin-right:-7px;border:2px solid #fff;width:26px;height:26px;font-size:11px}
.avatar-stack .avatar:last-child{margin-right:0}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.tag-admin{background:#fde8e8;color:var(--brand-dark)}
.tag-member{background:var(--blue-light);color:#2563eb}
.tag-guest{background:#eef1ee;color:#5f6b62}
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:64px 24px;color:var(--text-faint);gap:8px;text-align:center;
}
.empty-state .icon-circle{
  width:52px;height:52px;border-radius:50%;background:var(--bg-sub);
  display:flex;align-items:center;justify-content:center;margin-bottom:6px;color:var(--text-faint);
}
/* toast */
#toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:#2b2f3a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;
  box-shadow:var(--shadow-lg);animation:toastIn .25s ease;max-width:80vw;
}
.toast.err{background:#b91c1c}
.toast.ok{background:#155e33}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
/* modal */
.modal-mask{
  position:fixed;inset:0;background:rgba(20,24,32,.45);z-index:900;
  display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);width:440px;max-width:92vw;
  max-height:88vh;display:flex;flex-direction:column;animation:modalIn .18s ease;
}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{padding:18px 22px 0;display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:17px}
.modal-body{padding:16px 22px;overflow-y:auto;overscroll-behavior:contain}
.modal-foot{padding:14px 22px 18px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--border)}
.modal-foot.left{justify-content:space-between}

/* ============ 登录页 ============ */
#auth-page{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fdf4f4 0%,#f6f7fb 55%,#f0f4f8 100%)}
.auth-card{
  width:400px;max-width:92vw;background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);
  border:1px solid var(--border);padding:36px 34px;animation:modalIn .25s ease;
}
.auth-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:8px}
.auth-logo .logo-mark{width:38px;height:38px;border-radius:10px;background:var(--brand);display:flex;align-items:center;justify-content:center}
.auth-title{text-align:center;font-size:21px;font-weight:800;letter-spacing:.5px}
.auth-sub{text-align:center;color:var(--text-sub);font-size:13px;margin:6px 0 24px}
.auth-switch{text-align:center;font-size:13px;color:var(--text-sub);margin-top:18px}
.auth-demo{
  margin-top:22px;padding:12px 14px;background:var(--bg-sub);border-radius:8px;font-size:12px;
  color:var(--text-sub);line-height:1.9;border:1px dashed var(--border-strong);
}
.auth-demo summary{cursor:pointer;color:var(--text-sub);font-size:12px}
.auth-demo[open] summary{margin-bottom:2px}
.auth-demo b{color:var(--text)}
.auth-demo .cred{font-family:Consolas,Monaco,monospace;background:#fff;padding:1px 6px;border-radius:4px;border:1px solid var(--border)}
.auth-err{color:var(--red);font-size:12px;margin:-8px 0 12px;min-height:16px}

/* ============ 应用布局 ============ */
#app{display:none;height:100vh;flex-direction:column}
#app.on{display:flex}
/* 顶栏 */
#topbar{
  height:var(--topbar-h);border-bottom:1px solid var(--border);display:flex;align-items:center;
  padding:0 16px;gap:14px;background:#fff;z-index:50;flex-shrink:0;
}
#topbar .logo-mini{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.3px;min-width:170px}
#topbar .logo-mini .logo-mark{width:26px;height:26px;border-radius:7px;background:var(--brand);display:flex;align-items:center;justify-content:center}
#global-search{position:relative;flex:1;max-width:420px}
#global-search input{
  width:100%;border:1px solid var(--border);background:var(--bg-sub);border-radius:7px;
  padding:7px 12px 7px 32px;font-size:13px;transition:all .15s;
}
#global-search input:focus{background:#fff;border-color:var(--brand)}
#global-search .search-ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-faint)}
#search-dropdown{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--shadow-lg);max-height:380px;overflow-y:auto;display:none;z-index:200;
}
#search-dropdown.on{display:block}
.search-group{padding:8px 12px 4px;font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px}
.search-item{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;font-size:13px}
.search-item:hover{background:var(--bg-hover)}
.search-item.kb-on{background:var(--bg-hover);outline:1.5px solid var(--brand-light)}
.search-item .sub{color:var(--text-faint);font-size:12px;margin-left:auto}
/* ============ 命令面板（Ctrl+K）：搜索 / 新建 / 跳转的统一键盘入口 ============ */
#cmdk-mask{position:fixed;inset:0;background:rgba(20,24,32,.45);z-index:980;display:none}
#cmdk-mask.on{display:block}
#cmdk{position:fixed;top:13vh;left:50%;transform:translateX(-50%);width:min(560px,94vw);background:#fff;
  border-radius:12px;box-shadow:var(--shadow-lg);z-index:990;display:none;overflow:hidden}
#cmdk.on{display:flex;flex-direction:column}
#cmdk-input{width:100%;border:none;outline:none;padding:15px 18px;font-size:15px;border-bottom:1px solid var(--border)}
#cmdk-list{max-height:344px;overflow-y:auto;padding:6px}
#cmdk-list .search-group{padding:10px 12px 4px}
#cmdk-foot{border-top:1px solid var(--border);padding:8px 16px;font-size:11.5px;color:var(--text-faint);display:flex;gap:14px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.store-status{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;
  border-radius:14px;border:1px solid var(--border-strong);color:var(--orange);background:#fff;transition:all .15s;
}
.store-status.ok{color:var(--green);border-color:var(--green)}
.store-status.saving{color:var(--blue);border-color:var(--blue)}
.store-status.err{color:var(--red);border-color:var(--red)}
.store-status:hover{background:var(--bg-hover)}
/* 冲突对话框 */
.cf-lead{font-size:13.5px;line-height:1.75;color:var(--text);margin:0 0 14px}
.cf-meta{display:flex;flex-direction:column;gap:8px;background:var(--bg-sub);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.cf-meta>div{display:flex;gap:10px;align-items:baseline;font-size:12.5px}
.cf-meta span{color:var(--text-faint);min-width:64px;flex-shrink:0}
/* 导出弹层：范围 / 内容 / 格式三组选择 + 实时预览，全部复用站内 chip 语言，不放原生表单控件 */
.ex-grp{margin-bottom:13px}
.ex-lbl{font-size:11.5px;font-weight:700;color:var(--text-faint);margin-bottom:6px;letter-spacing:.02em}
.ex-chips{display:flex;gap:6px;flex-wrap:wrap}
.ex-chips .f-chip em{font-style:normal;opacity:.65;font-weight:600}
.ex-hint{font-size:11.5px;color:var(--text-faint);margin-top:5px;line-height:1.65}
.ex-sum{font-size:12.5px;color:var(--text-sub);margin:2px 0 8px;line-height:1.7}
.ex-sum b{color:var(--text)}
.ex-name{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--text-faint);word-break:break-all}
.ex-prev{max-height:190px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
.ex-prev table{margin:0;font-size:12px}
.ex-prev th{position:sticky;top:0;background:var(--bg-sub);z-index:1}
.ex-prev td,.ex-prev th{white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.ex-warn{background:#fff8e8;border:1px solid #f0d9a0;color:#8a5a00;border-radius:var(--radius);padding:8px 11px;font-size:12px;margin-bottom:10px;line-height:1.6}
.ex-md{width:100%;min-height:170px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.7;border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;color:var(--text);background:var(--bg-sub);resize:vertical}
.cf-meta b{font-weight:700;color:var(--text)}
.cf-file{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;word-break:break-all;font-weight:600}
.cf-list{margin:0 0 12px;padding-left:18px;font-size:12.5px;line-height:1.7;color:var(--text-sub)}
.cf-list .cf-more{list-style:none;color:var(--text-faint);margin-left:-18px}
.cf-note{font-size:12px;color:var(--text-faint);margin:0;line-height:1.6}
#notif-btn{position:relative}
#notif-badge{
  position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--brand);
  color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;
}
#notif-badge.hide{display:none}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:8px;cursor:pointer}
.user-chip:hover{background:var(--bg-hover)}
.user-chip .chev{color:var(--text-faint)}
/* 用户下拉菜单 */
#user-menu{
  position:fixed;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);
  min-width:210px;z-index:800;display:none;padding:6px;
}
#user-menu.on{display:block}
.menu-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;font-size:13px;cursor:pointer;width:100%;text-align:left}
.menu-item:hover{background:var(--bg-hover)}
.menu-item.danger{color:var(--red)}
.menu-item.danger:hover{background:#fdecec}
.menu-sep{height:1px;background:var(--border);margin:5px 8px}

/* 主体 */
#main{display:flex;flex:1;overflow:hidden}
/* 侧边栏 */
#sidebar{
  width:var(--sidebar-w);border-right:1px solid var(--border);background:#fbfbfc;
  display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;overscroll-behavior:contain;
}
.side-pad{padding:14px 12px 6px}
.side-user{display:flex;align-items:center;gap:10px;padding:8px 12px}
.side-user .nm{font-weight:700;font-size:13.5px}
.side-user .rl{font-size:11px;color:var(--text-faint);margin-top:1px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:7px;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--text-sub);margin:1px 0;transition:all .12s;
}
.nav-item:hover{background:var(--bg-hover);color:var(--text)}
.nav-item.active{background:var(--brand-light);color:var(--brand-dark)}
.nav-item .ic{width:17px;height:17px}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--text-faint);font-weight:700}
.nav-item.active .count{color:var(--brand-dark)}
.side-label{
  padding:16px 14px 6px;font-size:11px;font-weight:700;color:var(--text-faint);
  text-transform:uppercase;letter-spacing:.6px;display:flex;justify-content:space-between;align-items:center;
}
.side-label button{font-size:15px;color:var(--text-faint);border-radius:4px;padding:0 4px}
.side-label button:hover{color:var(--brand)}
/* 管理员「显示全部项目」开关的打开态：必须看得出来现在是"纵览模式"，
   否则用户会以为自己被加了个项目却看不见，或反过来以为自己被移出却没被移出 */
.side-label button.on{color:var(--brand-dark);background:var(--brand-light)}
.proj-item{
  display:flex;align-items:center;gap:9px;padding:6px 12px;margin:1px 0;border-radius:7px;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--text-sub);transition:all .12s;
}
.proj-item:hover{background:var(--bg-hover);color:var(--text)}
.proj-item.active{background:var(--brand-light);color:var(--brand-dark)}
.proj-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
/* 项目标识：首字母色块（v2.0 起替代彩色圆点） */
.proj-ic{width:18px;height:18px;border-radius:5px;color:#fff;font-size:10px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.proj-item{position:relative}
.proj-item.dragging{opacity:.45}
.proj-item.drop-before::before,.proj-item.drop-after::after{content:"";position:absolute;left:6px;right:6px;height:2.5px;
  background:var(--brand);border-radius:2px;pointer-events:none}
.proj-item.drop-before::before{top:-2px}
.proj-item.drop-after::after{bottom:-2px}
.proj-item.archived{opacity:.55;font-style:italic}
.side-foot{margin-top:auto;padding:10px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-faint)}

/* 内容区 */
#content{flex:1;overflow-y:auto;background:#fff;position:relative;overscroll-behavior:contain}
.content-inner{max-width:1080px;margin:0 auto;padding:0 32px 80px}
.page-head{padding:28px 0 18px;border-bottom:1px solid var(--border);margin-bottom:22px}
.page-head h1{font-size:22px;font-weight:800;display:flex;align-items:center;gap:12px}
.page-head .desc{color:var(--text-sub);font-size:13px;margin-top:8px;line-height:1.7}
.page-head .head-row{display:flex;align-items:flex-start;gap:14px}
.page-head .head-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}

/* ============ 项目页 ============ */
.proj-head{padding:26px 0 0;position:sticky;top:0;background:#fff;z-index:20;border-bottom:1px solid var(--border)}
.proj-head .proj-title-row{display:flex;align-items:flex-start;gap:10px;padding-bottom:10px;flex-wrap:wrap}
.proj-head .proj-title-row h1{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-views{flex-wrap:wrap}
.proj-head h1 .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.proj-head .proj-members{display:flex;align-items:center;gap:10px}
.proj-views{display:flex;gap:2px;margin-left:auto}
.view-tab{
  display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:13px;font-weight:600;
  color:var(--text-sub);border-bottom:2.5px solid transparent;cursor:pointer;
}
.view-tab:hover{color:var(--text)}
.view-tab.active{color:var(--brand-dark);border-bottom-color:var(--brand)}
.proj-meta-row{display:flex;align-items:center;gap:16px;padding:8px 0}
.progress-wrap{flex:1;max-width:280px}
.progress-bar{height:6px;border-radius:3px;background:var(--bg-sub);overflow:hidden}
.progress-bar .fill{height:100%;border-radius:3px;background:var(--green);transition:width .3s}
.progress-text{font-size:11.5px;color:var(--text-sub);margin-top:4px}

/* 列表视图 */
.section-block{margin:4px 0 14px}
.section-head{display:flex;align-items:center;gap:8px;padding:8px 4px;color:var(--text-sub)}
.section-head .sec-title{font-size:13px;font-weight:700;letter-spacing:.2px}
.section-head .sec-count{font-size:11px;color:var(--text-faint)}
.section-head .sec-actions{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.section-block:hover .section-head .sec-actions{opacity:1}
.task-row{
  display:flex;align-items:center;gap:12px;padding:9px 10px 9px 14px;border-radius:8px;
  border-top:1px solid #f0f1f3;cursor:pointer;transition:background .1s;position:relative;
}
.task-row:first-of-type{border-top:none}
.task-row:hover{background:var(--bg-hover)}
.task-row.dragging{opacity:.4}
.task-row.drop-above::before,.task-row.drop-below::after{
  content:"";position:absolute;left:8px;right:8px;height:2.5px;background:var(--brand);border-radius:2px;
}
.task-row.drop-above::before{top:-2px}
.task-row.drop-below::after{bottom:-2px}
.task-row.done-row .task-title{color:var(--text-faint);text-decoration:line-through}
.check-circle{
  width:18px;height:18px;border-radius:50%;border:1.6px solid var(--border-strong);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .15s;cursor:pointer;background:#fff;
}
.check-circle:hover{border-color:var(--green)}
.check-circle.on{background:var(--green);border-color:var(--green)}
.check-circle.st-doing{border-color:var(--blue)}
.check-circle.st-doing:hover{border-color:var(--green)}
.check-circle svg{opacity:0;transform:scale(.5);transition:all .15s}
.check-circle.on svg{opacity:1;transform:scale(1)}
.rec-ic{color:var(--text-faint);display:inline-flex;align-items:center;margin-left:5px;flex-shrink:0}
.task-row .task-title{flex:1;font-size:13.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-row .task-title .subtask-count{color:var(--text-faint);font-size:12px;margin-left:6px}
.task-row .task-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.due-badge{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--bg-sub);color:var(--text-sub);white-space:nowrap}
.due-badge.today{background:var(--green-light);color:var(--green)}
.due-badge.overdue{background:#fdecec;color:var(--red)}
.due-badge.soon{background:var(--orange-light);color:var(--orange)}
.proj-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--text-sub);background:var(--bg-sub);border-radius:12px;padding:2px 9px;cursor:pointer;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.proj-chip:hover{background:var(--bg-hover);color:var(--text)}
.proj-chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
/* 优先级：左侧色条 + 彩色文字，刻意与"实心填充"的标签 pill 区隔（标签=实心，优先级=色条） */
.prio-pill{display:inline-flex;align-items:center;font-size:var(--fs-xs);font-weight:800;
  padding:1px 6px 1px 5px;line-height:1.5;flex-shrink:0;border-left:3px solid var(--border-strong);color:var(--text-sub)}
.prio-pill.prio-high{border-left-color:var(--prio-high-bar);color:var(--prio-high-fg)}
.prio-pill.prio-med{border-left-color:var(--prio-med-bar);color:var(--prio-med-fg)}
.prio-pill.prio-low{border-left-color:var(--prio-low-bar);color:var(--prio-low-fg)}
.task-row .avatar{width:22px;height:22px;font-size:9.5px}
.add-task-row{
  display:flex;align-items:center;gap:12px;padding:8px 10px 8px 14px;border-radius:8px;
  color:var(--text-faint);cursor:pointer;font-size:13px;border-top:1px solid #f0f1f3;
}
.add-task-row:hover{color:var(--brand-dark);background:var(--brand-light)}
.add-task-row .plus{width:18px;text-align:center;font-size:15px}
.done-section .task-row{opacity:.75}

/* 看板视图 */
.board-wrap{display:flex;gap:14px;padding:18px 0 30px;overflow-x:auto;align-items:flex-start;min-height:calc(100vh - 240px)}
.board-col{
  width:272px;flex-shrink:0;background:var(--bg-sub);border-radius:10px;border:1px solid var(--border);
  display:flex;flex-direction:column;max-height:calc(100vh - 220px);
}
.board-col.drag-over{border-color:var(--brand);background:var(--brand-light)}
.board-col-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.board-col-head .col-name{font-size:13px;font-weight:700;color:var(--text-sub)}
.board-col-head .col-count{font-size:11px;color:var(--text-faint);font-weight:700}
.board-col-head .col-actions{margin-left:auto;display:flex;gap:2px;opacity:0}
.board-col:hover .board-col-head .col-actions{opacity:1}
.board-col-body{padding:4px 8px 8px;overflow-y:auto;flex:1;min-height:40px;overscroll-behavior:contain}
.board-card{
  background:#fff;border:1px solid var(--border);border-radius:8px;padding:11px 12px;margin-bottom:8px;
  cursor:pointer;box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s;position:relative;
}
.board-card:hover{box-shadow:0 3px 12px rgba(16,24,40,.12)}
.board-card.dragging{opacity:.45;transform:rotate(2deg)}
.board-card.drop-above::before,.board-card.drop-below::after{
  content:"";position:absolute;left:8px;right:8px;height:3px;background:var(--brand);border-radius:2px;z-index:2;
}
.board-card.drop-above::before{top:-5px}
.board-card.drop-below::after{bottom:-5px}
.board-col-empty{
  padding:14px 10px;text-align:center;font-size:12px;color:var(--text-faint);
  border:1.5px dashed var(--border);border-radius:8px;margin:2px 0;
}
.board-col.drag-over .board-col-empty{border-color:var(--brand);color:var(--brand-dark);background:var(--brand-light)}
.board-card .card-title{font-size:13px;font-weight:600;line-height:1.45;word-break:break-word;padding-right:24px}
.board-card .check-circle{position:absolute;top:10px;right:10px;width:16px;height:16px}
.board-card.done-card .card-title{color:var(--text-faint);text-decoration:line-through}
.board-card .card-foot{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.board-card .card-foot .avatar{width:22px;height:22px;font-size:9.5px;margin-left:auto}
.board-add-card{padding:6px 12px 10px;color:var(--text-faint);font-size:12.5px;cursor:pointer;font-weight:600}
.board-add-card:hover{color:var(--brand-dark)}
.board-add-col{
  width:272px;flex-shrink:0;padding:14px;color:var(--text-faint);font-size:13px;font-weight:600;
  cursor:pointer;border:1.5px dashed var(--border-strong);border-radius:10px;text-align:center;
  transition:all .15s;background:transparent;
}
.board-add-col:hover{color:var(--brand-dark);border-color:var(--brand);background:var(--brand-light)}

/* ============ 任务详情抽屉 ============ */
#drawer-mask{position:fixed;inset:0;background:rgba(20,24,32,.28);z-index:600;display:none}
#drawer-mask.on{display:block;animation:fadeIn .15s}
#drawer{
  position:fixed;top:0;right:0;bottom:0;width:var(--detail-w);max-width:96vw;background:#fff;
  z-index:610;box-shadow:var(--shadow-lg);transform:translateX(100%);
  transition:transform .22s ease;display:flex;flex-direction:column;
}
#drawer.on{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.drawer-head #drawer-copy-link{margin-left:auto}
.drawer-head .drawer-close{margin-left:2px}
.drawer-body{flex:1;overflow-y:auto;padding:6px 24px 40px;overscroll-behavior:contain}
.drawer-title-row{display:flex;align-items:flex-start;gap:12px;padding:18px 0 10px}
.drawer-title-row .check-circle{margin-top:3px;width:20px;height:20px}
#dt-title,#ds-title{
  font-size:18px;font-weight:700;border:none;background:transparent;width:100%;line-height:1.4;
  padding:2px 4px;border-radius:6px;resize:none;overflow:hidden;
}
#dt-title:hover,#ds-title:hover{background:var(--bg-hover)}
#dt-title:focus,#ds-title:focus{background:var(--bg-sub)}
.dt-meta-grid{display:grid;grid-template-columns:88px 1fr;row-gap:2px;margin:6px 0 14px}
.dt-meta-label{padding:9px 0;font-size:12.5px;font-weight:700;color:var(--text-faint);display:flex;align-items:center;gap:6px}
.dt-meta-value{padding:4px 0;display:flex;align-items:center;gap:8px;min-height:38px;flex-wrap:wrap}
.dt-meta-value .plain{font-size:13px;color:var(--text-sub)}
.date-field{
  position:relative;display:inline-flex;align-items:center;gap:6px;min-height:30px;cursor:pointer;
  border:1px solid var(--border-strong);border-radius:6px;background:#fff;padding:4px 10px;font-size:12.5px;
  color:var(--text);transition:border .15s,box-shadow .15s;white-space:nowrap;
}
.date-field:hover{border-color:var(--brand)}
.date-field:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.14)}
.date-field .df-txt{pointer-events:none;display:inline-flex;align-items:center;gap:5px}
.date-field .df-empty{color:var(--text-faint)}
.date-field .df-ic{color:var(--text-faint);font-size:11px}
.date-field input[type=date]{position:absolute;inset:0;opacity:0;cursor:pointer;border:none;padding:0;width:100%;height:100%}
.date-field input[type=date]::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;opacity:0}
.dt-edit{
  display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;cursor:pointer;
  font-size:13px;border:1px solid transparent;transition:all .12s;
}
.dt-edit:hover{background:var(--bg-hover);border-color:var(--border)}
.dt-edit .caret{color:var(--text-faint);font-size:10px}
.dt-sec{border-top:1px solid var(--border);margin-top:16px;padding-top:16px}
.dt-sec-title{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--text-faint);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px}
#dt-desc,#ds-desc{
  width:100%;border:none;background:transparent;font-size:13.5px;line-height:1.75;color:var(--text-sub);
  min-height:36px;resize:vertical;padding:6px;border-radius:6px;
}
#dt-desc:hover,#ds-desc:hover{background:var(--bg-hover)}
#dt-desc:focus,#ds-desc:focus{background:var(--bg-sub)}
.subtask-row{display:flex;align-items:center;gap:10px;padding:6px 6px;border-radius:6px}
.subtask-row:hover{background:var(--bg-hover)}
.subtask-row .st-title{flex:1;font-size:13px;min-width:0}
.subtask-row.done .st-title{color:var(--text-faint);text-decoration:line-through}
.subtask-row{position:relative}
/* v1.8.1 子任务拖拽排序 */
.subtask-row.dragging{opacity:.4}
.subtask-row.drop-above::before,.subtask-row.drop-below::after{content:'' ;position:absolute;left:8px;right:8px;height:2px;background:var(--brand);border-radius:1px}
.subtask-row.drop-above::before{top:-1px}
.subtask-row.drop-below::after{bottom:-1px}
.subtask-row .st-del{opacity:0;color:var(--text-faint);font-size:16px;padding:0 4px;border-radius:4px}
.subtask-row:hover .st-del{opacity:1}
.subtask-row .st-del:hover{color:var(--red)}
.add-subtask{display:flex;align-items:center;gap:10px;padding:6px;color:var(--text-faint);font-size:13px;cursor:pointer;border-radius:6px}
.add-subtask:hover{color:var(--brand-dark);background:var(--brand-light)}
.add-subtask .plus{width:18px;text-align:center}
.comment-box{display:flex;gap:10px;margin-top:14px}
.comment-box textarea{
  flex:1;border:1px solid var(--border-strong);border-radius:8px;padding:9px 12px;font-size:13px;
  resize:vertical;min-height:42px;background:var(--bg-sub);
}
.comment-box textarea:focus{background:#fff;border-color:var(--brand)}
.comment-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f2f3f5}
.comment-item .c-head{display:flex;align-items:baseline;gap:8px}
.comment-item .c-user{font-weight:700;font-size:12.5px}
.comment-item .c-time{font-size:11px;color:var(--text-faint)}
.comment-item .c-text{font-size:13px;color:var(--text);line-height:1.6;margin-top:3px;word-break:break-word}
.comment-item .c-actions{display:flex;gap:8px;margin-left:auto;opacity:0;transition:opacity .15s}
.comment-item:hover .c-actions{opacity:1}
.comment-item .c-actions button{font-size:11px;color:var(--text-faint);background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:4px}
.comment-item .c-actions button:hover{color:var(--brand);background:var(--bg-hover)}
.comment-item.editing{background:var(--brand-light);border-radius:8px;padding:10px 10px 8px;margin:0 -4px}
.comment-edit-area{width:100%;border:1px solid var(--brand);border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.5;resize:vertical;min-height:60px;margin-top:4px}
.comment-edit-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.comment-item .edited-mark{font-size:10px;color:var(--text-faint);margin-left:4px}
.activity-item{display:flex;gap:10px;padding:7px 0;font-size:12.5px;color:var(--text-sub);align-items:baseline}
.activity-item .a-time{font-size:11px;color:var(--text-faint);margin-left:auto;white-space:nowrap}
/* v1.7.5 活动记录折叠按钮 */
.act-fold{display:block;margin-top:6px;padding:2px 0;font-size:12px;text-align:left}
.dt-danger-zone{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dt-danger-hint{font-size:11.5px;color:var(--text-faint);line-height:1.5}

/* ============ 我的任务 / 通知 / 成员管理 ============ */
.group-head{display:flex;align-items:center;gap:8px;padding:14px 4px 8px;font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.group-head .g-dot{width:8px;height:8px;border-radius:50%}
.g-overdue{color:var(--red)}.g-overdue .g-dot{background:var(--red)}
.g-paused{color:var(--st-paused-fg)}.g-paused .g-dot{background:var(--st-paused-dot)}
.g-today{color:var(--green)}.g-today .g-dot{background:var(--green)}
.g-upcoming{color:var(--orange)}.g-upcoming .g-dot{background:var(--orange)}
.g-nodate{color:var(--text-faint)}.g-nodate .g-dot{background:var(--text-faint)}
.notif-item{display:flex;gap:12px;padding:13px 14px;border-radius:10px;cursor:pointer;align-items:flex-start;transition:background .12s;border:1px solid transparent}
.notif-item:hover{background:var(--bg-hover)}
.notif-item.unread{background:var(--brand-light);border-color:#f5d5d9;margin-bottom:6px}
.notif-item .n-text{font-size:13px;line-height:1.55;flex:1}
.notif-item .n-text b{font-weight:700}
.notif-item .n-time{font-size:11px;color:var(--text-faint);white-space:nowrap;margin-top:2px}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{
  text-align:left;padding:10px 12px;font-size:11.5px;font-weight:800;color:var(--text-faint);
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1.5px solid var(--border);
}
.table td{padding:12px;border-bottom:1px solid #f0f1f3;vertical-align:middle}
.table tr:hover td{background:var(--bg-sub)}
.role-select{border:1px solid var(--border-strong);border-radius:6px;padding:5px 8px;font-size:12.5px;background:#fff;cursor:pointer}
.stat-cards{display:flex;gap:14px;margin:18px 0 6px;flex-wrap:wrap}
.stat-card{flex:1;min-width:150px;background:var(--bg-sub);border:1px solid var(--border);border-radius:10px;padding:16px}
.stat-card .s-num{font-size:26px;font-weight:800;line-height:1.1}
.stat-card .s-label{font-size:12px;color:var(--text-sub);margin-top:5px}

/* 首页 */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
.home-card{border:1px solid var(--border);border-radius:12px;padding:18px 20px;background:#fff}
.home-card h3{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.home-card h3 .badge{font-size:11px;background:var(--bg-sub);border-radius:10px;padding:2px 8px;color:var(--text-sub)}
.mini-task{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:7px;cursor:pointer;font-size:13px}
.mini-task:hover{background:var(--bg-hover)}
.mini-task .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-task.mini-sub{padding-left:18px}
.mini-sub .sub-chip{font-size:10px;font-weight:700;color:var(--brand-dark);background:var(--brand-light);border-radius:4px;padding:1px 5px;flex-shrink:0}
.mini-task .p{font-size:11px;color:var(--text-faint)}
.link-more{font-size:12.5px;font-weight:700;margin-top:10px;display:inline-block;cursor:pointer}
.link-more:hover{text-decoration:underline}

/* 滚动条 */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d4d7dd;border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#b9bec7;background-clip:content-box;border:2px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* 只读模式提示 */
.readonly-banner{
  background:var(--orange-light);color:#a05e00;font-size:12.5px;padding:8px 16px;
  display:flex;align-items:center;gap:8px;border-bottom:1px solid #f3e0bd;
}
/* ============ v2：状态三选 / 子任务编辑 / 标签 / 关注人 ============ */
.status-chip{width:8px;height:8px;padding:0;border-radius:50%;flex-shrink:0;display:inline-block}
.status-chip.s-todo{background:var(--st-todo-dot)}
.status-chip.s-doing{background:var(--st-doing-dot)}
.status-chip.s-paused{background:var(--st-paused-dot)}
.status-chip.s-done{background:var(--st-done-dot)}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:800;padding:1px 8px;border-radius:var(--radius-pill)}
.status-pill.s-todo{background:var(--st-todo-bg);color:var(--st-todo-fg)}
.status-pill.s-doing{background:var(--st-doing-bg);color:var(--st-doing-fg)}
/* 已暂停用虚线边框强化「刻意搁置」的读法，与进行中/已完成一眼可分 */
.status-pill.s-paused{background:var(--st-paused-bg);color:var(--st-paused-fg);border:1px dashed var(--st-paused-dot)}
.status-pill.s-done{background:var(--st-done-bg);color:var(--st-done-fg)}
/* 已暂停的卡片整体降饱和，让"不用管它"在扫一眼时就传达出来 */
.board-card.is-paused .card-title{color:var(--text-sub)}
.task-row.is-paused .task-title{color:var(--text-sub)}
.task-row.is-paused,.board-card.is-paused{background:repeating-linear-gradient(135deg,#fff 0 10px,var(--st-paused-bg) 10px 11px)}
.board-col.paused-col .board-col-head .col-name{color:var(--st-paused-fg)}
/* 子任务编辑 */
.subtask-row{position:relative}
.subtask-row .st-title{cursor:pointer;padding:2px 4px;border-radius:4px;min-width:40px}
.subtask-row .st-title:hover{background:#eef0f3}
.subtask-row .st-edit-input{
  flex:1;border:1.5px solid var(--brand);border-radius:5px;padding:2px 6px;font-size:13px;
}
.subtask-row .st-assign{cursor:pointer;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.subtask-row .st-due{cursor:pointer;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--bg-sub);color:var(--text-sub);border:none}
.subtask-row .st-due:hover{border:1px solid var(--brand-strong,var(--border-strong))}
.subtask-row .st-due.overdue{background:#fdecec;color:var(--red)}
.subtask-row .st-due.today{background:var(--green-light);color:var(--green)}
.subtask-row .st-due.empty{color:var(--text-faint);background:transparent;border:1px dashed var(--border-strong)}
.subtask-row .st-due-input{border:1.5px solid var(--brand);border-radius:5px;font-size:11.5px;padding:2px 4px}
/* 子任务评论角标 */
.subtask-row .st-cmt{cursor:pointer;border-radius:9px;padding:1px 6px;font-size:11px;background:transparent;color:var(--text-faint);border:1px solid transparent;line-height:1.5}
.subtask-row .st-cmt:hover{color:var(--brand);background:var(--brand-light)}
.subtask-row .st-cmt.has{color:var(--brand-dark);font-weight:700}
/* popover */
.popover{
  position:fixed;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);
  min-width:180px;max-height:300px;overflow-y:auto;z-index:950;padding:6px;animation:modalIn .12s ease;
}
.popover .po-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;font-size:13px;cursor:pointer}
.popover .po-item:hover{background:var(--bg-hover)}
.popover .po-item.hl{background:var(--bg-hover)}
.popover .po-item b{font-weight:700}
.popover .po-item .sub{font-size:11px;color:var(--text-faint);margin-left:auto}
.popover .po-sep{height:1px;background:var(--border);margin:4px 6px}
/* v1.7.1：可搜索项目选择器 */
.pp-search{padding:2px 4px 8px;border-bottom:1px solid var(--border);margin:-2px -4px 4px;position:sticky;top:-6px;background:#fff;z-index:1}
.pp-search input{width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;box-sizing:border-box}
.pp-search input:focus{border-color:var(--brand)}
.pp-list{max-height:230px;overflow-y:auto}
.pp-empty{padding:12px 8px;font-size:12.5px;color:var(--text-faint);line-height:1.6}
/* 任务抽屉「所属项目」按钮：显示当前项目，点击弹出搜索切换 */
.proj-move-btn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;font-weight:600;font-size:13.5px;background:#fff;color:var(--text);max-width:280px}
.proj-move-btn:hover{background:var(--bg-hover);border-color:var(--border-strong)}
.proj-move-btn > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-move-btn .chev{color:var(--text-faint)}
/* 标签 */
.tag-chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:14px;font-size:11px;font-weight:800;
  cursor:pointer;border:1px solid transparent;transition:all .12s;user-select:none;
}
.tag-chip.off{background:#fff;border-color:var(--border-strong);color:var(--text-faint)}
.tag-chip.on{color:#fff}
.tag-chip.mini{padding:1px 7px;font-size:10px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag-more{font-size:10px;font-weight:800;color:var(--text-faint);border:1px solid var(--border);border-radius:var(--radius-pill);padding:1px 6px;cursor:default}
/* 过滤条 */
.filter-bar{position:relative;display:flex;align-items:center;gap:10px;padding:10px 0 4px;flex-wrap:wrap}
.filter-btn{
  display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--border-strong);
  border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text-sub);background:#fff;transition:all .15s;
}
.filter-btn:hover{border-color:var(--text-sub);color:var(--text)}
.filter-btn.on{border-color:var(--brand);color:var(--brand-dark);background:var(--brand-light)}
.filter-btn .fb-count{background:var(--brand);color:#fff;border-radius:8px;font-size:10px;padding:0 5px;min-width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.f-summary{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.f-sum{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;background:var(--brand-light);color:var(--brand-dark);border-radius:12px;padding:3px 9px;cursor:pointer}
.f-sum b{opacity:.55;font-weight:800}
.f-sum:hover b{opacity:1}
.filter-panel{
  display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:130;background:#fff;border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--shadow-lg);padding:14px 16px;width:480px;max-width:calc(100vw - 90px);
  animation:fadeIn .12s ease;
}
.filter-panel.on{display:block}
.fp-group{margin-bottom:11px}
.fp-group:last-child{margin-bottom:0}
.fp-title{font-size:11px;font-weight:800;color:var(--text-faint);letter-spacing:.4px;margin-bottom:6px}
.fp-opts{display:flex;flex-wrap:wrap;gap:6px}
.f-chip{
  padding:3px 11px;border-radius:16px;font-size:11.5px;font-weight:700;border:1px solid var(--border-strong);
  color:var(--text-sub);cursor:pointer;background:#fff;transition:all .12s;display:inline-flex;align-items:center;gap:5px;
}
.f-chip:hover{border-color:var(--text-faint)}
.f-chip.on{background:var(--text);color:#fff;border-color:var(--text)}
.f-chip .fdot{width:7px;height:7px;border-radius:50%}
/* 多选批量 */
.batch-bar{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2b2f3a;color:#fff;
  border-radius:12px;padding:10px 18px;box-shadow:var(--shadow-lg);z-index:700;
  display:flex;align-items:center;gap:10px;font-size:13px;animation:toastIn .2s ease;
}
.batch-bar button{color:#d6d9df;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:6px}
.batch-bar button:hover{background:#3c424f;color:#fff}
.batch-bar button.ba-del{color:#fca5a5}
.batch-bar button.ba-del:hover{background:var(--brand-dark);color:#fff}
.batch-bar .cnt{font-weight:800;margin-right:4px}
.task-row.multi-on{cursor:pointer}
.task-row.selected{background:var(--blue-light) !important;outline:1.5px solid var(--blue)}
.batch-check{display:none;align-items:center;justify-content:center}
.multi-mode .task-row .batch-check{display:flex}
/* 日历视图 */
.cal-wrap{padding:18px 0 30px}
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cal-head .cal-title{font-size:15px;font-weight:800;min-width:130px}
.cal-nav{display:flex;align-items:center;gap:4px}
.cal-weekrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-weekrow div{text-align:center;font-size:11.5px;font-weight:800;color:var(--text-faint);padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{
  min-height:104px;border:1px solid var(--border);border-radius:8px;padding:6px;background:#fdfdfe;
  display:flex;flex-direction:column;gap:3px;transition:all .12s;
}
.cal-cell.other{background:#f8f9fb;opacity:.6}
.cal-cell.today{border-color:var(--brand);box-shadow:0 0 0 1.5px var(--brand-light)}
.cal-cell:hover{border-color:var(--border-strong)}
.cal-cell .cd{font-size:12px;font-weight:700;color:var(--text-sub);padding:1px 4px 3px}
.cal-cell.today .cd{color:var(--brand);font-weight:800}
.cal-task{
  font-size:11px;padding:3px 7px;border-radius:5px;background:var(--bg-sub);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;border-left:3px solid var(--border-strong);
}
.cal-task:hover{background:var(--bg-hover)}
.cal-task.done-t{opacity:.55;text-decoration:line-through}
.cal-task.cal-sub{font-size:10.5px;opacity:.92}
.cal-more{font-size:10.5px;color:var(--text-faint);font-weight:700;padding:1px 5px;cursor:pointer}
.cal-task{display:flex;align-items:center;gap:4px}
.cal-task .cal-tag{font-size:9px;padding:1px 4px;border-radius:3px;background:var(--brand-light);color:var(--brand-dark);font-weight:800;flex-shrink:0}
.cal-task .cal-title-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.po-tag{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--brand-light);color:var(--brand-dark);font-weight:700}
/* 项目概览 */
.ov-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.ov-stat{border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:#fff}
.ov-stat .n{font-size:22px;font-weight:800}
.ov-stat .l{font-size:11.5px;color:var(--text-sub);margin-top:3px}
.su-item{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid #f0f1f3}
.su-mood{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.mood-ontrack{background:var(--green)}
.mood-atrisk{background:var(--orange)}
.mood-offtrack{background:var(--red)}
.mood-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--border-strong);border-radius:16px;font-size:12px;font-weight:700;cursor:pointer;background:#fff}
.mood-btn.on{border-width:2px}
/* 快速添加 */
.field-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row2 .field{margin-bottom:14px}
.qa-hint{font-size:11px;color:var(--text-faint);margin-top:10px;text-align:center}
/* 通用小头像按钮 */
.avatar-btn{
  width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--border-strong);color:var(--text-faint);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;background:#fff;
}
.avatar-btn:hover{border-color:var(--brand);color:var(--brand)}
/* 关注人入口：带文字的幽灵按钮（替代此前 8px 虚线小圆，用户看不见这里能加人） */
.follower-add{border:1px dashed var(--border-strong);background:#fff;color:var(--text-sub);
  border-radius:var(--radius-pill);padding:3px 10px;font-size:var(--fs-xs);font-weight:700;cursor:pointer;transition:all .12s}
.follower-add:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-light)}
/* 甘特图视图 */
.gantt-wrap{padding:18px 0 30px;min-width:0}
.gantt-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.gantt-head .gantt-title{font-size:15px;font-weight:800}
.gantt-head .gantt-legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--text-sub);margin-left:auto}
.gantt-head .gantt-legend span{display:inline-flex;align-items:center;gap:4px}
.gantt-head .gantt-legend b{display:inline-block;width:12px;height:12px;border-radius:3px}
.gantt-scroll{overflow:auto;border:1px solid var(--border);border-radius:10px;background:#fff}
.gantt-grid{min-width:760px;display:grid;grid-template-columns:260px 1fr}
.gantt-sidebar{border-right:1px solid var(--border);background:var(--bg-sub);position:sticky;left:0;z-index:2}
.gantt-header-row{display:contents;font-size:11.5px;font-weight:700;color:var(--text-sub)}
.gantt-header-row .gh-cell{padding:10px 12px;background:var(--bg-sub);border-bottom:1px solid var(--border)}
.gantt-header-row .gh-months{display:flex;border-bottom:1px solid var(--border);background:var(--bg-sub)}
.gantt-header-row .gh-month{text-align:center;padding:6px 0;font-size:11px;font-weight:800;color:var(--text-sub);border-right:1px solid var(--border)}
.gantt-header-row .gh-timeline{display:flex;border-bottom:1px solid var(--border);background:var(--bg-sub)}
.gantt-header-row .gh-day{flex:1;text-align:center;padding:7px 0;border-right:1px solid var(--border);min-width:34px}
.gantt-header-row .gh-day.weekend{background:rgba(0,0,0,.02)}
.gantt-header-row .gh-day.today{color:var(--brand);font-weight:800}
.gantt-row{display:contents;font-size:12.5px}
.gantt-row:hover .gantt-cell{background:var(--bg-hover)}
.gantt-row:hover .gantt-bar-cell{background:var(--bg-hover)}
.gantt-cell{padding:9px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:#fff;min-width:0}

<script>
/* =========================================================
 * FlowTask — 本地项目管理平台（数据存储于 localStorage）
 * 核心功能：项目/任务/子任务（状态分组）/评论/活动记录/
 * 列表+看板视图/我的任务/通知/成员管理与三级权限
 * ========================================================= */
'use strict';

/* ---------- 工具 ---------- */
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const DB_KEY = 'flowtask_db_v1';
const AUTH_KEY = 'flowtask_auth_v1';   // 账户表的浏览器兜底
const OLD_SESSION_KEY = 'flowtask_session';      // v1.4 及更早的裸 uid 会话，升级时清掉

/*==TEST-BEGIN==*/
function uid(p=''){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s=''){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* P0-3：属性上下文（style / class / title 等）安全化——esc() 只覆盖文本节点，
   属性值里直接拼接数据同样能撑破引号造成存储型 XSS，这里再补一道属性专用过滤 */
function escAttr(s=''){ return esc(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f`]/g, ''); }
/* P0-3：颜色白名单——属性里拼颜色只放行 #RGB / #RRGGBB，其余一律回退到中性色，
   从根上堵死 style="background:${颜色}" 这类拼接点的注入 */
function safeColor(c, fallback='#9aa1ac'){
  return (typeof c === 'string' && (/^#[0-9a-fA-F]{3}$/.test(c) || /^#[0-9a-fA-F]{6}$/.test(c))) ? c : fallback;
}
/* P0-3：项目播报心情白名单——class="mood-${...}" 同样是属性拼接，不能直落数据 */
const MOOD_KEYS = ['ontrack','atrisk','offtrack'];
function safeMood(m){ return MOOD_KEYS.indexOf(m) >= 0 ? m : 'ontrack'; }
/* P1-5：静默 catch 的统一去处——不再无声吞掉异常，至少留一条可追查的线索 */
function logSoft(msg, e){
  try{ console.warn('[FlowTask] ' + msg + (e && e.message ? '：' + e.message : '')); }catch(_e){}
}
/* 本地日期串（修复原 toISOString 取 UTC 日期，在东八区 0:00-8:00 会把"今天"算成昨天的问题） */
function localDateStr(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return localDateStr(new Date()); }
function dateOffset(days){ const d=new Date(); d.setDate(d.getDate()+days); return localDateStr(d); }
/* 日期串加法（基于本地时区） */
function dateAddStr(ds, n){ const d=new Date(ds + 'T00:00:00'); d.setDate(d.getDate()+n); return localDateStr(d); }
function fmtDate(ds){
  if(!ds) return '';
  const d = new Date(ds + 'T00:00:00');
  if(isNaN(d.getTime())) return '';
  const now = new Date(); now.setHours(0,0,0,0);
  const d0 = new Date(d); d0.setHours(0,0,0,0);
  const diff = Math.round((d0 - now) / 86400000);
  if(diff === 0) return '今天';
  if(diff === 1) return '明天';
  if(diff === -1) return '昨天';
  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  const day = d.getDate();
  const ny = now.getFullYear();
  if(y === ny) return `${m}月${day}日`;
  return `${y}年${m}月${day}日`;
}
function fmtDateFull(ts){
  const d = new Date(ts);
  if(isNaN(d.getTime())) return '—';
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
/* 自定义日期字段：替代原生 date 输入框，空值显示"未设置"而非浏览器"年/月/日"占位 */
function dateFieldHTML(id, value){
  const v = value ? fmtDateFull(value) : '';
  return `<span class="date-field" data-df="${id}">
    <span class="df-txt">${v ? esc(v) : '<span class="df-empty">未设置</span>'}<span class="df-ic">📅</span></span>
    <input type="date" id="${id}" value="${escAttr(value||'')}">
  </span>`;
}
function bindDateFieldDisplay(scope){
  $$('.date-field input[type=date]', scope).forEach(inp=>{
    const txt = $('.df-txt', inp.parentElement);
    const refresh = ()=>{
      if(!txt) return;
      txt.innerHTML = (inp.value ? esc(fmtDateFull(inp.value)) : '<span class="df-empty">未设置</span>') + '<span class="df-ic">📅</span>';
    };
    inp.addEventListener('change', refresh);
    inp.addEventListener('input', refresh);
  });
}
/* 项目成员选择 chip（头像 + 姓名 + 角色，横向排列，点击选中/取消） */
function memberChipHTML(u, checked){
  return `<button type="button" class="member-chip ${checked?'on':''}" data-uid="${u.id}">
    <span class="avatar" style="background:${safeColor(u.color)}">${esc(u.name.slice(0,1))}</span>
    <b>${esc(u.name)}</b><span class="sub">${ROLE_NAME[u.role]}</span></button>`;
}
function bindMemberChips(scope){
  $$('.member-chip', scope).forEach(chip=>{
    chip.onclick = ()=> chip.classList.toggle('on');
  });
}
/*==TEST-END==*/
/* 下面这处 BEGIN/END 成对标记是修好的错位：原先 990 那段一直没能收尾，
   而 toast/PRIO/prioName 这一段只有 END 没有 BEGIN，整段落在测试沙箱之外 */
/*==TEST-BEGIN==*/
const APP_VERSION = '2.1.1';   /* 与 CHANGELOG.md 顶部版本号保持一致（单测有守卫断言） */
/* 任务状态的唯一真相源：名称 / 样式类 / 色板令牌 / 选择器 全部从这里派生 */
const STATUS_DEF = [
  { st:'todo',   name:'待办',   cls:'s-todo',   dot:'var(--st-todo-dot)'   },
  { st:'doing',  name:'进行中', cls:'s-doing',  dot:'var(--st-doing-dot)'  },
  /* 已暂停放在「已完成」之前：它是未完成的一种，不是完成之后的一步 */
  { st:'paused', name:'已暂停', cls:'s-paused', dot:'var(--st-paused-dot)' },
  { st:'done',   name:'已完成', cls:'s-done',   dot:'var(--st-done-dot)'   },
];
const STATUS_ORDER = STATUS_DEF.map(s=>s.st);
const VIEW_NAME = { overview:'详情', list:'列表', board:'看板', calendar:'日历', gantt:'排期' };
const STATUS_NAME  = STATUS_DEF.reduce((m,s)=>(m[s.st]=s.name, m), {});
const STATUS_CLS   = STATUS_DEF.reduce((m,s)=>(m[s.st]=s.cls,  m), {});
const STATUS_PILLS = STATUS_DEF.map(s=>({ st:s.st, name:s.name, color:s.dot }));
const statusName = st => STATUS_NAME[st] || STATUS_NAME.todo;
/* 勾选圈统一提示：回显当前状态，避免"完成 / 完成取消完成"两种文案并存 */
const checkTitle = (done, st) => done ? '取消完成（当前：已完成）' : `标记完成（当前：${statusName(st)}）`;
/* 起止日期配对：任一端越过另一端时自动顺延另一端（YYYY-MM-DD 可直接字典序比较） */
function applyDatePair(cur, which, value){
  const startDate = which==='start' ? (value||null) : (cur.startDate||null);
  const dueDate   = which==='due'   ? (value||null) : (cur.dueDate||null);
  if(startDate && dueDate && startDate > dueDate){
    return which==='start' ? { startDate, dueDate:startDate, moved:'dueDate' }
                           : { startDate:dueDate, dueDate, moved:'startDate' };
  }
  return { startDate, dueDate, moved:null };
}
/* 同列表内重名检测（trim 后比较），用于项目名 / 标签名防错 */
/* 渲染索引：把"每个项目都全表扫一遍"换成一次构建的 Map（数据量大时决定流畅度） */
let _idx = { epoch:-1, byProj:null, projById:null, userById:null, tagById:null };
let _dataEpoch = 0;            // 每次数据变化 +1：索引失效的唯一信号
function bumpDataEpoch(){ _dataEpoch++; }
function buildIdx(){
  if(_idx.epoch === _dataEpoch && _idx.byProj) return _idx;
  const byProj = new Map(), projById = new Map(), userById = new Map(), tagById = new Map();
  (DB.projects||[]).forEach(p=>{ byProj.set(p.id, []); projById.set(p.id, p); });
  (DB.tasks||[]).forEach(t=>{ const arr = byProj.get(t.projectId); if(arr) arr.push(t); });
  /* v1.10：行渲染里「每行 find 一次 users/tags」的 O(行×成员) 扫描换成 Map（同纪元只建一次） */
  (DB.users||[]).forEach(u=>{ if(u && u.id) userById.set(u.id, u); });
  (DB.tags||[]).forEach(g=>{ if(g && g.id) tagById.set(g.id, g); });
  _idx = { epoch: _dataEpoch, byProj, projById, userById, tagById };
  return _idx;
}
function userById(id){ buildIdx(); return _idx.userById.get(id) || null; }
function tagById(id){ buildIdx(); return _idx.tagById.get(id) || null; }
/* 返回副本：调用方常做 .sort()，不能污染索引 */
function tasksOfProject(pid){ buildIdx(); const a = _idx.byProj.get(pid); return a ? a.slice() : []; }
function projectOf(t){ buildIdx(); return t ? (_idx.projById.get(t.projectId) || null) : null; }
function findDupName(list, name, key='name', exceptId=null){
  const n = String(name||'').trim();
  if(!n) return null;
  return (list||[]).find(x => x && x.id !== exceptId && String(x[key]||'').trim() === n) || null;
}
const WEEK_DAYS = ['日','一','二','三','四','五','六'];
/* 中文日期词 → YYYY-MM-DD（today 也是 YYYY-MM-DD，全部按本地日期算，不用 UTC） */
function resolveDateToken(tok, today){
  if(!tok || !today) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(tok)) return tok;
  const base = new Date(today + 'T00:00:00');
  if(isNaN(base.getTime())) return null;
  const shift = n => { const d = new Date(base); d.setDate(d.getDate() + n); return localDateStr(d); };
  if(tok === '今天') return today;
  if(tok === '明天') return shift(1);
  if(tok === '后天') return shift(2);
  if(tok === '大后天') return shift(3);
  let m = tok.match(/^(\d+)天后$/); if(m) return shift(Number(m[1]));
  m = tok.match(/^周([日一二三四五六])$/);
  if(m){ const t = WEEK_DAYS.indexOf(m[1]); return shift(((t - base.getDay() + 7) % 7) || 7); }
  m = tok.match(/^下周([日一二三四五六])$/);
  if(m){ const t = WEEK_DAYS.indexOf(m[1]); const iso = ((base.getDay() + 6) % 7) + 1;   // 周一=1 … 周日=7
    return shift((8 - iso) + ((t === 0 ? 7 : t) - 1)); }
  m = tok.match(/^(\d{1,2})月(\d{1,2})[日号]?$/);
  if(m){ const y = base.getFullYear();
    let d = new Date(y, Number(m[1]) - 1, Number(m[2]));
    if(localDateStr(d) < today) d = new Date(y + 1, Number(m[1]) - 1, Number(m[2]));
    return localDateStr(d); }
  return null;
}
/* 一句话解析：@负责人  !优先级  #标签  今天/明天/周五/下周二/3天后/9月5日/2026-09-05 */
function parseQuickText(raw, ctx){
  const out = { title:'', assigneeId:null, priority:null, dueDate:null, tagIds:[], matched:{} };
  const users = (ctx && ctx.users) || [], tags = (ctx && ctx.tags) || [], today = ctx && ctx.today;
  let text = String(raw || '');
  text = text.replace(/(^|\s)@([^\s@]+)/g, (m, sp, nm)=>{
    const u = users.find(x=>x.name===nm) || users.find(x=>x.name.indexOf(nm)===0)
           || (nm.length>=2 ? users.find(x=>x.name.indexOf(nm)>=0) : null);
    if(!u) return m;
    out.assigneeId = u.id; out.matched.assignee = u.name; return sp;
  });
  text = text.replace(/(^|\s)!(高|中|低)/g, (m, sp, p)=>{
    out.priority = p==='高' ? 'high' : (p==='中' ? 'med' : 'low');
    out.matched.priority = p; return sp;
  });
  text = text.replace(/(^|\s)#([^\s#]+)/g, (m, sp, nm)=>{
    const g = tags.find(x=>x.name===nm) || tags.find(x=>x.name.indexOf(nm)===0);
    if(!g) return m;
    if(out.tagIds.indexOf(g.id) < 0) out.tagIds.push(g.id);
    out.matched.tags = (out.matched.tags || []).concat(g.name); return sp;
  });
  text = text.replace(/(^|\s)(今天|明天|后天|大后天|下周[日一二三四五六]|周[日一二三四五六]|\d+天后|\d{1,2}月\d{1,2}[日号]?|\d{4}-\d{2}-\d{2})/g, (m, sp, tok)=>{
    const d = resolveDateToken(tok, today);
    if(!d) return m;
    out.dueDate = d; out.matched.date = tok; return sp;
  });
  out.title = text.replace(/\s+/g, ' ').trim();
  return out;
}

/* 时间显示策略（v1.7.3）：24 小时内用相对时间感受新旧，超过 24 小时一律给日期——
   评论/动态要靠日期追溯「哪一次评审、哪一周的事」，「21天前」这种表述换算成本高。 */
function fmtTime(ts){
  const diff = (Date.now() - ts) / 1000;
  if(diff < 0) return '刚刚';
  if(diff < 60) return '刚刚';
  if(diff < 3600) return Math.floor(diff/60) + ' 分钟前';
  if(diff < 86400) return Math.floor(diff/3600) + ' 小时前';
  return fmtDateShort(ts);
}
/* 超过一天的时间点：昨天 / M月D日 HH:MM（今年内）/ YYYY年M月D日（跨年） */
function fmtDateShort(ts){
  const d = new Date(ts);
  if(isNaN(d.getTime())) return '—';
  const now = new Date();
  const hm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  const yd = new Date(now.getFullYear(), now.getMonth(), now.getDate()-1);
  if(d.getFullYear()===yd.getFullYear() && d.getMonth()===yd.getMonth() && d.getDate()===yd.getDate()) return '昨天 ' + hm;
  if(d.getFullYear()===now.getFullYear()) return (d.getMonth()+1) + '月' + d.getDate() + '日 ' + hm;
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
}
/* v1.7.5：活动记录折叠——平时只显示「创建任务」那条 + 最近 3 条，点一下才展开全部。
   长任务的活动流不该把描述与评论挤出视野。 */
const ACT_FOLD_KEEP = 3;      // 折叠时保留的最近条数
const ACT_FOLD_MAX = 30;      // 单次最多渲染条数（历史再长也不卡）
function foldActivity(list, expanded){
  const arr = (list || []).slice(-ACT_FOLD_MAX);
  const total = arr.length;
  const desc = arr.slice().reverse();                                  // 新 → 旧
  const foldable = total > ACT_FOLD_KEEP + 1;
  if(!foldable || expanded) return { rows: desc, total, foldable, hidden: 0 };
  const first = arr[0];                                                // 最早一条（通常是「创建了任务」）
  const recent = desc.slice(0, ACT_FOLD_KEEP);
  const rows = first && recent.indexOf(first) < 0 ? recent.concat([first]) : recent;
  rows.sort((a,b)=> (Number(b.ts)||0) - (Number(a.ts)||0));            // 创建记录落在最旧端
  return { rows, total, foldable, hidden: total - rows.length };
}
/* v1.7.5：快速添加的默认项目 = 显式传入 > 当前所在项目 > 上一次创建任务的项目 > 第一个项目 */
function quickAddDefaultProject(explicit, projects, route, lastPid){
  const has = id => !!id && (projects || []).some(p=>p.id===id);
  if(has(explicit)) return explicit;
  if(route && route.page === 'project' && has(route.pid)) return route.pid;
  if(has(lastPid)) return lastPid;
  return projects[0].id;
}

/* ============================================================
   v1.9 数据导出 · 纯函数层
   ------------------------------------------------------------
   设计要点（都是踩过的坑，不是假想）：
   · CSV 必须带 UTF-8 BOM + CRLF，否则中文在 Excel 里直接乱码；
   · 单元格里的换行统一成 LF 并整体加引号，Excel 能正确显示多行单元格；
   · 同事可写的标题/描述若以 = + - @ 开头，Excel 会当公式执行（CSV 注入），
     纯数字除外 —— 所以导出前统一加前导单引号；
   · 描述是富文本，导出要抽成纯文本，不能带标签和实体；
   · 导出只认传进来的 tasks/ctx，不读全局状态，方便单测与复用。
   ============================================================ */
/*==TEST-BEGIN==*/
const CSV_BOM = String.fromCharCode(0xFEFF);   // 不用字面 BOM 字符：它看不见，编辑器一存盘就丢，Excel 随即乱码
const EXPORT_MAX_ROWS = 20000;         // 超过就提示缩小范围：共享给全组后数据会长

/* 富文本 → 纯文本（先护住换行，再剥标签，最后解实体） */
function plainText(v){
  if(v === null || v === undefined || v === '') return '';
  let s = String(v);
  s = s.replace(/<br\s*\/?>/gi, '\n')
       .replace(/<\/(p|div|li|tr)>/gi, '\n')
       .replace(/<[^>]*>/g, '');
  s = s.replace(/&nbsp;/gi, ' ').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
       .replace(/&quot;/gi, '"').replace(/&#0*39;/gi, "'").replace(/&amp;/gi, '&');
  return s.replace(/\n{3,}/g, '\n\n').trim();
}
/* 时间戳 → 导出用「YYYY-MM-DD HH:MM」；空值给空串而不是 1970 */
function fmtStamp(ts){
  const n = Number(ts);
  if(!n) return '';
  const d = new Date(n), p = x => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDay(ds){ return ds ? String(ds) : ''; }
/* 逾期口径统一在这里：已完成的任务不算逾期（界面上多处内联判断，导出必须以这里为准） */
function isTaskOverdue(t, today){
  return !!(t && t.dueDate && !t.completed && today && String(t.dueDate) < String(today));
}
function subProgress(t){
  const list = (t && t.subtasks) || [];
  if(!list.length) return '';
  return list.filter(s => s && s.done).length + '/' + list.length;
}
function statusOf(t){ return t && t.completed ? statusName('done') : statusName(t && t.status); }
/* 「已暂停」的统一口径：未完成且状态为 paused。
   所有"要不要催办"的判断都必须走这两个谓词，不要在调用点内联比较 ——
   之前逾期判断在 5 处各写一遍，加一个状态就得记着改 5 处，漏一处就出现
   「已暂停的任务还在首页催我逾期」这种自相矛盾。 */
function isPaused(t){ return !!(t && !t.completed && t.status === 'paused'); }
/* 该被催办的任务：未完成、没被暂停，且有截止日期 */
function isActionable(t){ return !!(t && !t.completed && !isPaused(t)); }
/* 逾期判定统一入口：已暂停不算逾期（这正是暂停的目的），已完成也不算 */
function isOverdue(t, today){ return !!(isActionable(t) && t.dueDate && today && String(t.dueDate) < String(today)); }

/* 单个单元格：转义 + 防公式注入 */
function csvCell(v){
  let s = (v === null || v === undefined) ? '' : String(v);
  s = s.replace(/\r\n?/g, '\n');
  const numeric = /^-?\d+(\.\d+)?$/.test(s);              // 纯数字（评论数等）不必护
  if(!numeric && /^[=+\-@\t\r]/.test(s)) s = "'" + s;      // =SUM() / @cmd / -2+3 都会被 Excel 执行
  return '"' + s.replace(/"/g, '""') + '"';
}
function rowsToCSV(head, rows){
  const out = [head.map(csvCell).join(',')];
  for(const r of rows) out.push(r.map(csvCell).join(','));
  return CSV_BOM + out.join('\r\n') + '\r\n';
}

/* 列清单：on=默认勾选。新增列只改这里，界面与导出自动跟上 */
const EXPORT_COLUMNS = [
  { key:'title',     label:'任务',     on:true,  get:(t,c)=>t.title },

  { key:'followers', label:'关注人',   on:false, get:(t,c)=>(t.followers || []).map(c.userName).join(' / ') }
];
/* 这两个入口用 function 声明：测试沙箱只收 function/var，收不到顶层 const */
function exportColumnsOf(keys){ return EXPORT_COLUMNS.filter(c => keys.indexOf(c.key) >= 0); }
function exportColumnDefs(){ return EXPORT_COLUMNS; }

/* 子任务展开成独立行——「包含子任务」语义，与主流任务工具的筛选一致 */
function flattenWithSubtasks(tasks){
  const out = [];
  for(const t of tasks){
    out.push({ task:t, kind:'任务', parentTitle:'' });
    for(const s of ((t && t.subtasks) || [])){
      out.push({ task:t, kind:'子任务', parentTitle:t.title, sub:s });
    }
  }
  return out;
}
/* 一行「子任务」映射成任务形状的只读视图，列取值逻辑完全复用。
   状态只看子任务自己的 done：父任务是「进行中」还是「待办」说明不了这个子任务的状态；
   负责人则沿用——子任务未单独指派时实际就是父任务的负责人在跟 */
function subAsTask(parent, s){
  return { id:s.id, title:s.title, projectId:parent.projectId, desc:s.desc || '',
    assigneeId:(s.assigneeId === undefined || s.assigneeId === null ? parent.assigneeId : s.assigneeId),
    dueDate:s.dueDate || null, startDate:s.startDate || null,
    priority:(s.priority || parent.priority || 'low'),
    status:s.done ? 'done' : 'todo', completed:!!s.done,
    completedAt:s.doneAt || null, createdAt:parent.createdAt, createdBy:s.createdBy || parent.createdBy,
    comments:s.comments || [], tags:[], subtasks:[], followers:[] };
}
/* 生成表头与数据行：cols 为选中的列对象数组，units 为 flattenWithSubtasks 的结果 */
function buildExportRows(cols, units, ctx){
  const head = cols.map(c => c.label);
  const rows = [];
  for(const u of units){
    const t = u.kind === '子任务' ? subAsTask(u.task, u.sub) : u.task;
    const one = Object.assign({}, ctx, { kind:u.kind, parentTitle:u.parentTitle || '' });
    rows.push(cols.map(c => { try{ return c.get(t, one); }catch(e){ return ''; } }));
  }
  return { head, rows, truncated:rows.length > EXPORT_MAX_ROWS };
}

/* ---------- 密码哈希（SubtleCrypto 优先，纯JS回退） ---------- */
function fallbackHash(str){
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for(let r=0; r<3; r++){
    for(let i=0;i<str.length;i++){
      h1 ^= str.charCodeAt(i); h1 = Math.imul(h1, 16777619) >>> 0;
      h2 = (h2 + str.charCodeAt(i)*(i+r+1)) >>> 0;
    }
  }
  return 'fb$' + h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}
/* ---------- 密码哈希：PBKDF2-SHA256 优先（p1$），兼容旧格式（s2$/fb$）并透明升级 ---------- */
async function legacyHash(password, salt){
  const input = salt + '::' + password;
  try{
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
      return 's2$' + Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return fallbackHash(input);
}
async function hashPassword(password, salt){
  try{
    if(window.crypto && crypto.subtle){
      const enc = new TextEncoder();
      const keyMat = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', hash:'SHA-256', salt: enc.encode(salt), iterations: 100000 }, keyMat, 256);
      return 'p1$' + Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return legacyHash(password, salt);   // crypto 不可用环境回退旧算法
}
/* 校验密码（自动识别新旧格式）；旧格式校验通过后透明升级为 PBKDF2 */
async function verifyPassword(user, password){
  const isP1 = typeof user.passHash === 'string' && user.passHash.startsWith('p1$');
  const h = await (isP1 ? hashPassword(password, user.salt) : legacyHash(password, user.salt));
  if(h !== user.passHash) return false;
  if(!isP1){
    user.passHash = await hashPassword(password, user.salt);
    saveAuth();            // 哈希升级属于账户表变更，不该顶高数据库版本号
  }
  return true;
}
